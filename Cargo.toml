[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# I test di budget misurano prestazioni, e `cargo test` compila a
# `opt-level = 0`: misurerebbero rustc senza ottimizzazioni, non ciò che
# gira in produzione. Su `keeppix-media`, che macina byte, la differenza
# non è marginale — misurata sulle stesse fixture:
#
#     estrazione preview CR3    debug 116,90 ms    release 4,19 ms
#
# 28×, abbastanza da far fallire un budget che in release ha 12× di
# margine. Il numero in debug non dice niente di utile: dipende dalla
# macchina, e infatti passava su una e falliva su un'altra.
#
# Si ottimizzano solo le crate che macinano byte: il resto resta veloce da
# compilare. `dev` e `test` sono entrambi necessari — le librerie usate dai
# test di integrazione si compilano col profilo `dev`, i binari di test col
# profilo `test`.
[profile.dev.package.keeppix-media]
opt-level = 2

[profile.test.package.keeppix-media]
opt-level = 2

# libwebp-sys è C: a opt-level=0 l'encoder lossy risultava più lento del
# lossless Rust (1,06 s vs 0,48 s sulla stessa fixture). Stesso motivo
# dell'ottimizzazione di keeppix-media: i budget devono parlare della
# produzione, non di rustc -O0 sul C.
[profile.dev.package.libwebp-sys]
opt-level = 2

[profile.test.package.libwebp-sys]
opt-level = 2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
