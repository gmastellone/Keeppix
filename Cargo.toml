[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.41", default-features = false, features = ["serialize"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Budget tests measure performance, and `cargo test` compiles at
# `opt-level = 0`: they'd be measuring rustc without optimizations, not
# what runs in production. On `keeppix-media`, which grinds through bytes,
# the difference isn't marginal — measured on the same fixtures:
#
#     CR3 preview extraction    debug 116.90 ms    release 4.19 ms
#
# 28×, enough to fail a budget that has a 12× margin in release. The debug
# number tells you nothing useful: it depends on the machine, and indeed
# it passed on one and failed on another.
#
# Only the crates that grind through bytes get optimized: everything else
# stays fast to compile. `dev` and `test` are both needed — libraries used
# by integration tests compile under the `dev` profile, test binaries
# under the `test` profile.
[profile.dev.package.keeppix-media]
opt-level = 2

[profile.test.package.keeppix-media]
opt-level = 2

# libwebp-sys is C: at opt-level=0 the lossy encoder was slower than the
# lossless Rust one (1.06 s vs 0.48 s on the same fixture). Same reason as
# the keeppix-media optimization: budgets need to speak to production, not
# to rustc -O0 on the C code.
[profile.dev.package.libwebp-sys]
opt-level = 2

[profile.test.package.libwebp-sys]
opt-level = 2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
