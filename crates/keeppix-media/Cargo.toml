[package]
name = "keeppix-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
keeppix-domain = { path = "../keeppix-domain" }
chrono.workspace = true
serde_json.workspace = true
walkdir = "2"
exif = { package = "kamadak-exif", version = "0.6.1" }
blake3 = "1"
libc = "0.2"
serde.workspace = true
zune-jpeg = "0.4"
png = { version = "0.18", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }
fast_image_resize = "5"
# Binding to libwebp: `image-webp`'s lossless encoder (VP8L) produced
# ~1.54 MB/photo. Pinned to 0.3.1, not `*`: it's a C dependency.
webp = { version = "0.3.1", default-features = false }
thumbhash = "0.1"
quick-xml = { workspace = true }
filetime = "0.2"
# HEIF/HEIC only runs out-of-process (`heif-convert`, same binding style as
# the RAW pipeline's libheif C library): it needs a real file for input and
# output, not a stream — the library doesn't read/write from pipes.
tempfile = "3"
# ONNX runtime. Tract runs the model in isolation, but tract-data's
# `libm = 0.2.11` collides with crypto-primes (russh) in the workspace.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
# CLIP BPE tokenizer: uses the same `tokenizer.json` as the ONNX model.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
# Comparison in the budget test: the "current" lossless (VP8L) that lossy
# must stay under 1/3 of. Not in the production binary.
image-webp = "0.2"
serial_test = "3"

[lints]
workspace = true
