[package]
name = "keeppix-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
keeppix-domain = { path = "../keeppix-domain" }
chrono.workspace = true
serde_json.workspace = true
walkdir = "2"
exif = { package = "kamadak-exif", version = "0.6.1" }
blake3 = "1"
libc = "0.2"
serde.workspace = true
zune-jpeg = "0.4"
fast_image_resize = "5"
# Binding a libwebp: l'encoder lossless di `image-webp` (VP8L) produceva
# ~1,54 MB/foto. Si fissa 0.3.1, non `*`: è una dipendenza C.
webp = { version = "0.3.1", default-features = false }
thumbhash = "0.1"
quick-xml = { workspace = true }
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
# Confronto nel test di budget: il lossless "odierno" (VP8L) contro cui
# il lossy deve stare sotto 1/3. Non è nel binario di produzione.
image-webp = "0.2"
serial_test = "3"

[lints]
workspace = true
