[package]
name = "keeppix-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
keeppix-domain = { path = "../keeppix-domain" }
chrono.workspace = true
serde_json.workspace = true
walkdir = "2"
exif = { package = "kamadak-exif", version = "0.6.1" }
blake3 = "1"
libc = "0.2"
serde.workspace = true
zune-jpeg = "0.4"
png = { version = "0.18", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }
fast_image_resize = "5"
# Binding a libwebp: l'encoder lossless di `image-webp` (VP8L) produceva
# ~1,54 MB/foto. Si fissa 0.3.1, non `*`: è una dipendenza C.
webp = { version = "0.3.1", default-features = false }
thumbhash = "0.1"
quick-xml = { workspace = true }
filetime = "0.2"
# HEIF/HEIC gira solo fuori processo (`heif-convert`, stesso binding della
# libreria C di libheif del task RAW): serve un file reale in ingresso e in
# uscita, non uno stream — la libreria non legge/scrive da pipe.
tempfile = "3"
# Runtime ONNX (Fase 7 Task 2). Tract gira il modello in isolamento ma
# `libm = 0.2.11` di tract-data collide con crypto-primes (russh) in workspace.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
# Tokenizer CLIP BPE (Fase 7 Task 2bis): stesso `tokenizer.json` del modello ONNX.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
# Confronto nel test di budget: il lossless "odierno" (VP8L) contro cui
# il lossy deve stare sotto 1/3. Non è nel binario di produzione.
image-webp = "0.2"
serial_test = "3"

[lints]
workspace = true
