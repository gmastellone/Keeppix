[package]
name = "keeppix-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
keeppix-domain = { path = "../keeppix-domain" }
keeppix-db = { path = "../keeppix-db" }
keeppix-media = { path = "../keeppix-media" }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
notify = "8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
age = "0.11"
zstd = "0.13"
tar = "0.4"
serde = { workspace = true, features = ["derive"] }
blake3 = "1"
libc = "0.2"
aws-sigv4 = { version = "1.3", default-features = true }
aws-credential-types = "1.2"
http = "1"
hex = "0.4"
russh = { version = "0.60.3", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "2.1"
# Pin russh's rsa stack: newer rsa/crypto-primes want crypto-bigint 0.7.5,
# which conflicts with russh's =0.7.0-rc.28. Keep the locked pre-release set.
rsa = "=0.10.0-rc.16"
crypto-primes = "=0.7.0-pre.9"
crypto-bigint = "=0.7.0-rc.28"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
uuid.workspace = true
tempfile = "3"
filetime = "0.2"
chrono.workspace = true
