  });
  root.querySelectorAll('[data-facechip]').forEach(el=>{
    bindActivatable(el, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); const f=FACES.find(x=>x.id===el.dataset.facechip); if(f) openFaceBoxMenuDialog(f); });
    wireLbFaceHover(root, el, el.dataset.facechip);
  });
  const addPersonChip = document.getElementById('lbAddPersonChip');
  if(addPersonChip) addPersonChip.onclick = ()=>{
    openPersonPickerDialog((pid)=>{ addManualFaceToPhoto(p.id, pid); showToast('Persona aggiunta.'); renderAll(); });
  };
  const addTagChip = document.getElementById('lbAddTagChip');
  if(addTagChip) addTagChip.onclick = ()=> openTagPickerDialog([p.id]);
  root.querySelectorAll('[data-lbtagchip][data-origin="ai"]').forEach(chip=>{
    bindActivatable(chip, ()=>{ confirmAiApplied(chip.dataset.lbtagchip, p.id); showToast('Tag confermato.'); renderAll(); });
  });
  root.querySelectorAll('[data-lbtagremove]').forEach(x=>{
    bindActivatable(x, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); removeTagFromPhoto(x.dataset.lbtagremove, p.id); showToast('Tag rimosso.'); renderAll(); });
  });
  root.querySelectorAll('[data-lbtagconfirm]').forEach(el=>{
    bindActivatable(el, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); confirmSuggestion(el.dataset.lbtagconfirm, p.id); showToast('Tag confermato.'); renderAll(); });
  });
  root.querySelectorAll('[data-lbtagreject]').forEach(el=>{
    bindActivatable(el, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); rejectSuggestion(el.dataset.lbtagreject, p.id); showToast('Suggerimento rifiutato — non verrà riproposto.'); renderAll(); });
  });
  attachStarHandlers(root, id=>lbLookup(id));
}
/* ===== sezione Tag nel dettaglio foto: distinzione visiva netta fra "l'IA l'ha messo lei
   in automatico, nessuno l'ha ancora guardato" (chip più leggera + marcatore "IA", cliccarla
   la conferma), "confermato da un umano" (chip piena) e "in attesa di conferma" (chip
   tratteggiata con conferma/rifiuto inline, sezione separata sotto). ===== */
function lbTagSectionHTML(p){
  const confirmed = confirmedTagsForPhoto(p.id);
  const suggested = suggestedTagsForPhoto(p.id);
  // raggruppa i tag confermati per categoria (stesso ordine di TAG_CATEGORIES, come nella
  // pagina "Tag e categorie") così nel dettaglio foto si vede anche la categoria di
  // appartenenza, non solo l'elenco piatto dei tag.
  const catGroups = TAG_CATEGORIES.map(cat=>({cat, items: confirmed.filter(c=>c.tag.categoryId===cat.id)})).filter(g=>g.items.length);
  const uncategorized = confirmed.filter(c=>!c.tag.categoryId || !tagCategoryById(c.tag.categoryId));
  if(uncategorized.length) catGroups.push({cat:null, items:uncategorized});
  const chipHTML = ({tag,origin})=>`<div class="lb-tag-chip ${origin==='ai'?'ai-applied':''}" data-lbtagchip="${tag.id}" data-origin="${origin}" ${origin==='ai'?'role="button" tabindex="0" aria-label="Conferma tag '+tag.name+', assegnato in automatico dall\'IA"':''}>
        <span class="lb-tag-dot" style="background:hsl(${tag.color},60%,55%)" aria-hidden="true"></span>${tag.name}
        ${origin==='ai'?`<span class="lb-tag-ai-mark" title="Assegnato in automatico dall'IA — clicca per confermarlo">IA</span>`:''}
        <span class="lb-tag-x" data-lbtagremove="${tag.id}" role="button" tabindex="0" aria-label="Rimuovi tag ${tag.name}">${icon('close',10)}</span>
      </div>`;
  return `<div class="lb-info-section">
    <div class="lb-info-label">Tag</div>
    ${catGroups.map(g=>`<div class="lb-tag-cat-group" data-tagcatgroup="${g.cat?g.cat.id:'none'}">
      <div class="lb-tag-cat-name">${g.cat ? g.cat.name : 'Senza categoria'}</div>
      <div class="lb-album-chips">${g.items.map(chipHTML).join('')}</div>
    </div>`).join('')}
    <div class="lb-album-chips" ${catGroups.length?'style="margin-top:'+(catGroups.length?'2px':'0')+'"':''}>
      <div class="lb-album-chip" style="cursor:pointer" id="lbAddTagChip">${icon('plus',11)} aggiungi</div>
    </div>
    ${suggested.length ? `<div class="lb-info-label" style="margin-top:12px">In attesa di conferma</div>
    <div class="lb-album-chips">
      ${suggested.map(tag=>`<div class="lb-suggested-tag-chip">
        <span class="lb-tag-dot" style="background:hsl(${tag.color},60%,55%)" aria-hidden="true"></span>${tag.name}
        <div class="lb-suggested-tag-actions">
          <span class="confirm" data-lbtagconfirm="${tag.id}" role="button" tabindex="0" aria-label="Conferma ${tag.name}">${icon('check',10)}</span>
          <span class="reject" data-lbtagreject="${tag.id}" role="button" tabindex="0" aria-label="Rifiuta ${tag.name}">${icon('close',10)}</span>
        </div>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}

/* =========================================================
   VIEW: CERCA
   La sfida: un solo campo che gestisca testo libero semantico, filtri strutturati
   (anno, fotocamera, ISO, cartella, GPS) e tag — e che li combini — senza sembrare
   un pannello da database. Soluzione: si scrive come una frase. Ciò che viene
   riconosciuto come "strutturato" (scegliendolo da un suggerimento) diventa una
   pillola rimovibile a sinistra nel campo; quello che resta scritto è testo, ed è
   quello a cui viene applicata la ricerca per descrizione libera (stesso meccanismo,
   nessun tag scritto a mano richiesto — vedi sceneKeywordMatch). Le due cose
   convivono nello stesso campo e si sommano nei risultati.
========================================================= */
if(!state.cercaType) state.cercaType='all';
if(!state.savedSearches) state.savedSearches=[{label:'RAW · Urbino', query:'', type:'raw', hint:'esempio'}];
if(!('searchSuggestOpen' in state)) state.searchSuggestOpen = false;
function pillLabel(type, value){
  if(type==='tag') return `Tag: ${tagById(value).name}`;
  if(type==='camera') return value;
  if(type==='folder') return FOLDERS.find(f=>f.id===value).name;
  if(type==='iso') return `ISO ${value}`;
  if(type==='year') return `Anno ${value}`;
  if(type==='gps') return 'Con posizione GPS';
  if(type==='country') return 'Italia';
  return String(value);
}
function addSearchPill(type, value){
  if(state.searchPills.some(p=>p.type===type && p.value===value)) return;
  state.searchPills.push({type, value, label: pillLabel(type, value)});
  state.cercaQuery = '';
  state.searchSuggestOpen = false;
}
function buildSearchSuggestions(text){
  const q = text.trim().toLowerCase();
  const has = (type,value)=> state.searchPills.some(p=>p.type===type && p.value===value);
  const groups = [];
  const tagHits = TAGS.filter(t=>!has('tag',t.id) && (!q || t.name.toLowerCase().includes(q))).slice(0,5);
  if(tagHits.length) groups.push({label:'Tag', rows: tagHits.map(t=>({type:'tag', value:t.id, dot:`hsl(${t.color},60%,50%)`, label:t.name}))});
  if(q){
    const camHits = [...new Set(CAMERAS.map(c=>c.camera))].filter(c=>!has('camera',c) && c.toLowerCase().includes(q)).slice(0,4);
    if(camHits.length) groups.push({label:'Fotocamera', rows: camHits.map(c=>({type:'camera', value:c, ic:'photo', label:c}))});
    const folderHits = FOLDERS.filter(f=>!has('folder',f.id) && f.name.toLowerCase().includes(q));
    if(folderHits.length) groups.push({label:'Cartella', rows: folderHits.map(f=>({type:'folder', value:f.id, ic:'folder', label:f.name}))});
    const isoValues = [100,200,400,800,1600];
    const isoMatch = q.match(/(\d{2,4})/);
    if(isoMatch && isoValues.includes(Number(isoMatch[1])) && !has('iso',Number(isoMatch[1]))){
      groups.push({label:'ISO', rows:[{type:'iso', value:Number(isoMatch[1]), ic:'settings', label:`ISO ${isoMatch[1]}`}]});
    }
    if('2026'.includes(q) && q.length>=2 && !has('year','2026')){
      groups.push({label:'Anno', rows:[{type:'year', value:'2026', ic:'search', label:'2026'}]});
    }
    if('gps'.includes(q) && !has('gps',true)){
      groups.push({label:'Posizione', rows:[{type:'gps', value:true, ic:'locate', label:'Ha coordinate GPS'}]});
    }
    if('italia'.includes(q) && !has('country','it')){
      groups.push({label:'Paese', rows:[{type:'country', value:'it', ic:'globe', label:'Italia'}]});
    }
  } else {
    // campo vuoto ma con focus: incoraggia la scoperta con qualche cartella oltre ai tag
    groups.push({label:'Cartella', rows: FOLDERS.filter(f=>!has('folder',f.id)).map(f=>({type:'folder', value:f.id, ic:'folder', label:f.name}))});
  }
  return groups;
}
function renderSearchSuggest(){
  const host = document.getElementById('searchSuggest');
  if(!host) return;
  if(!state.searchSuggestOpen){ host.innerHTML=''; return; }
  const text = state.cercaQuery;
  const groups = buildSearchSuggestions(text);
  const freeText = text.trim();
  host.innerHTML = `<div class="search-suggest-panel" id="searchSuggestPanel">
    ${groups.length ? groups.map(g=>`<div class="search-suggest-group">
      <div class="search-suggest-group-label">${g.label}</div>
      ${g.rows.map(r=>`<div class="search-suggest-row" data-suggestpill="1" data-pilltype="${r.type}" data-pillvalue="${escAttr(String(r.value))}">
        ${r.dot?`<span class="search-suggest-dot" style="background:${r.dot}" aria-hidden="true"></span>`:ico(r.ic||'search',14)}
        <span>${r.label}</span>
      </div>`).join('')}
    </div>`).join('') : (freeText ? '' : `<div class="search-suggest-empty">Scrivi per cercare per tag, fotocamera, cartella, ISO… oppure descrivi la foto («tramonto con casa»).</div>`)}
    ${freeText ? `<div class="search-suggest-free">Come descrizione libera: <b>«${freeText}»</b></div>` : ''}
  </div>`;
  host.querySelectorAll('[data-suggestpill]').forEach(row=>{
    row.onclick = ()=>{
      const type = row.dataset.pilltype;
      let value = row.dataset.pillvalue;
      if(type==='iso') value = Number(value);
      else if(type==='gps') value = true;
      addSearchPill(type, value);
      renderSearchPills();
      renderSearchSuggest();
      renderCercaResultsArea();
      const input = document.getElementById('cercaInput');
      if(input){ input.value=''; input.focus(); }
    };
  });
}
function renderSearchPills(){
  const host = document.getElementById('searchPillsHost');
  if(!host) return;
  host.innerHTML = state.searchPills.map((pill,i)=>`<span class="search-pill" data-pillindex="${i}">
    ${pill.type==='tag'?`<span class="search-suggest-dot" style="background:hsl(${tagById(pill.value).color},60%,85%)" aria-hidden="true"></span>`:''}
    ${pill.label}<span class="search-pill-x" data-removepill="${i}" role="button" tabindex="0" aria-label="Rimuovi filtro ${pill.label}">${icon('close',10)}</span>
  </span>`).join('');
  host.querySelectorAll('[data-removepill]').forEach(x=>{
    bindActivatable(x, ()=>{
      state.searchPills.splice(Number(x.dataset.removepill),1);
      renderSearchPills();
      renderCercaResultsArea();
    });
  });
}
function renderCerca(root){
  const typeChips = [
    {id:'all', label:'Tutti i tipi'},

  const input = document.getElementById('cercaInput');
  input.oninput = (e)=>{ state.cercaQuery = e.target.value; state.searchSuggestOpen = true; renderSearchSuggest(); renderCercaResultsArea(); };
  input.onfocus = ()=>{ state.searchSuggestOpen = true; renderSearchSuggest(); };
  bindActivatable(document.getElementById('searchClearAll'), ()=>{
    state.searchPills = []; state.cercaQuery=''; state.searchSuggestOpen=false;

  root.querySelectorAll('[data-typechip]').forEach(el=>{
    el.onclick = ()=>{
      state.cercaType = el.dataset.typechip;
      root.querySelectorAll('[data-typechip]').forEach(c=>c.classList.toggle('active', c===el));
      renderCercaResultsArea();
    };
  });
  renderCercaDynamic();
}

  renderCercaResults();

// ricalcola SOLO l'area risultati (usata a ogni tasto premuto o pillola aggiunta/rimossa) —
// il composer con l'input resta intatto, così il focus e il cursore non saltano via a ogni
// carattere digitato (stesso trucco già usato per l'input di Cerca prima di questa modifica).
function renderCercaResultsArea(){
  if(document.getElementById('cercaDynamic')) renderCercaDynamic();
}
function queryRecapHTML(){
  const parts = state.searchPills.map(p=>`<b style="color:var(--text)">${p.label}</b>`);
  if(state.cercaQuery.trim()) parts.push(`descrizione libera <b style="color:var(--text)">«${state.cercaQuery.trim()}»</b>`);
  if(!parts.length) return '';
  return `Ricerca: ${parts.join(' + ')} — `;
}
function computeSearchResults(){
  let pool = allPhotos();
  if(state.cercaType==='raw') pool = pool.filter(p=>p.isRaw);
  if(state.cercaType==='jpg') pool = pool.filter(p=>!p.isRaw);
  if(state.cercaType==='fav') pool = pool.filter(p=>p.isFav);
  state.searchPills.forEach(pill=>{
    if(pill.type==='tag') pool = pool.filter(p=>{ const e=tagEntry(pill.value,p.id); return e && e.status==='confirmed'; });
    else if(pill.type==='camera') pool = pool.filter(p=>p.camera===pill.value);
    else if(pill.type==='folder') pool = pool.filter(p=>p.folderId===pill.value);
    else if(pill.type==='iso') pool = pool.filter(p=>p.iso===pill.value);
    // year/gps/country: nel catalogo demo valgono per tutte le foto (un anno solo, tutto in
    // Italia, tutto geolocalizzato) — la pillola resta comunque applicabile e combinabile,
    // pronta per quando il catalogo reale avrà più varietà.
  });
  const q = state.cercaQuery.trim().toLowerCase();
  if(q){
    const scenes = sceneKeywordMatch(q);
    if(scenes.size){
      pool = pool.filter(p=>scenes.has(p.scene));
    } else {
      pool = pool.filter(p=> p.filename.toLowerCase().includes(q) || FOLDERS.find(f=>f.id===p.folderId).name.toLowerCase().includes(q));
    }
  }
  return pool;
}
function renderCercaResults(){
  const grid = document.getElementById('cercaGrid');
  const countEl = document.getElementById('cercaResultsCount');
  if(!grid) return;
  const hasSearch = !!state.cercaQuery.trim() || state.searchPills.length>0;
  let list;
  if(hasSearch){
    list = computeSearchResults();
    countEl.innerHTML = `${queryRecapHTML()}${list.length} risultat${list.length===1?'o':'i'}`;
  } else {
    list = computeSearchResults().slice().sort((a,b)=>monthDistance(a.monthIdx)-monthDistance(b.monthIdx)).slice(0,32);
    countEl.textContent = '';
  }
  grid.innerHTML = list.length ? list.map(tileHTML).join('') : '';
  if(list.length===0){ grid.outerHTML = `<div id="cercaGrid">${emptyStateHTML('search','Nessun risultato','Prova a togliere un filtro, o descrivi la foto in un altro modo.')}</div>`; attachSelectionBar([]); return; }
  attachTileHandlers(grid, list);
  attachSelectionBar(list);
  // renderAll() richiama layoutJustifiedGrids() dopo ogni render completo, ma la ricerca
  // ricostruisce questa griglia anche FUORI da renderAll() (a ogni carattere digitato o
  // pillola aggiunta/rimossa, per non far perdere il focus al campo di testo — vedi
  // renderCercaResultsArea) — senza questa chiamata le tile restano a dimensione 0.
  layoutJustifiedGrids(document.getElementById('viewRoot'));
}

function conditionEditorHTML(cond, idx){

      <input type="date" id="condFrom${idx}" data-daterole="from" value="${cond.from||''}" min="2026-01-01" max="2026-12-31">

      <input type="date" id="condTo${idx}" data-daterole="to" value="${cond.to||''}" min="2026-01-01" max="2026-12-31">
    </div>`;
  } else {
    editor = `<label class="sr-only" for="condSel${idx}">Valore per ${def.label}</label>
    <select class="filter-select" id="condSel${idx}" data-condidx="${idx}">
      <option value="">Scegli…</option>

    </select>`;

  </div>`;
}

    // il trigger apre/chiude il pannello, le righe al suo interno spuntano/tolgono un
    // valore — sostituisce il muro di checkbox in linea, più difficile da scansionare.
    root.querySelectorAll('.picklist').forEach(box=>{
      const idx = Number(box.dataset.condidx);
      const trigger = box.querySelector('.picklist-trigger');
      if(trigger) bindActivatable(trigger, (e)=>{
        if(e && e.stopPropagation) e.stopPropagation();
        state.openPicklistIdx = (state.openPicklistIdx===idx) ? null : idx;
        renderAll();
      });
      box.querySelectorAll('.picklist-row').forEach(row=>{
        bindActivatable(row, (e)=>{
          if(e && e.stopPropagation) e.stopPropagation();
          const arr = d.conditions[idx].value;
          const val = row.dataset.condval;
          const pos = arr.indexOf(val);
          if(pos===-1) arr.push(val); else arr.splice(pos,1);
          renderAll();
        });
      });
    });
    root.querySelectorAll('.filter-daterange').forEach(box=>{
      const idx = Number(box.dataset.condidx);
      box.querySelectorAll('input[type=date]').forEach(inp=>{
        inp.onchange = ()=>{ d.conditions[idx][inp.dataset.daterole] = inp.value; updatePreview(); };
      });
    });
    bindActivatable(document.getElementById('addConditionBtn'), ()=>{ d.conditions.push(freshCondition('folder')); renderAll(); });
  }

  bindActivatable(document.getElementById('createAlbumSubmit'), ()=>{
    const name = d.name.trim();
    if(!name){ showToast('Dai un nome all\'album prima di crearlo.'); nameInput.focus(); return; }
    if(d.kind==='dynamic' && d.conditions.length===0){ showToast('Aggiungi almeno una condizione, oppure passa a "Manuale".'); return; }
    state.customAlbumSeq = (state.customAlbumSeq||0)+1;
    const id = 'alc'+state.customAlbumSeq;
    const hh = hash(name+'::'+id);
    const newAlbum = { id, name, shared: d.shared, hue: HUES[hh%HUES.length] };
    if(d.kind==='dynamic' && d.filterMode==='auto'){
      newAlbum.dynamic = true;
      newAlbum.matchAll = d.matchAll;
      newAlbum.conditions = JSON.parse(JSON.stringify(d.conditions));
    } else if(d.kind==='dynamic' && d.filterMode==='once'){
      // applicato una tantum: le foto che corrispondono ORA diventano membership fissa,
      // da quel momento l'album è manuale a tutti gli effetti (modificabile a mano).
      const snapshot = allPhotos().filter(p => d.matchAll ? d.conditions.every(c=>condMatches(p,c)) : d.conditions.some(c=>condMatches(p,c)));
      newAlbum.memberIds = new Set(snapshot.map(p=>p.id));
      newAlbum.count = snapshot.length;
      newAlbum.range = computeRangeFromItems(snapshot);
    } else {
      newAlbum.memberIds = new Set();
      newAlbum.count = 0;
      newAlbum.range = 'nessuna foto ancora';
    }
    ALBUMS.push(newAlbum);
    showToast(`Album "${name}" creato.`);
    state.openAlbum = id;
    state.newAlbumDraft = null;
    state.openPicklistIdx = null;
    state.view = 'album';
    renderAll();
  });
}

  ];
}
const DEMO_PROBLEMS = seedProblems();
// esposto per la QA: dopo aver verificato che ogni azione rimuove davvero il problema
// dalla lista, il resto della suite (es. gli screenshot mobile più avanti) deve poter
// ripartire da una pagina Problemi popolata invece che vuota.
function resetDemoProblems(){ DEMO_PROBLEMS.length = 0; DEMO_PROBLEMS.push(...seedProblems()); }
function renderProblemi(root){
  if(DEMO_PROBLEMS.length===0){
    root.innerHTML = emptyStateHTML('check','Nessun problema rilevato','File corrotti, librerie offline o job falliti compariranno qui.');
    return;
  }
  root.innerHTML = `
    <div class="section-title">Problemi</div>
    <div class="section-sub">${DEMO_PROBLEMS.length} elementi richiedono attenzione</div>
    ${DEMO_PROBLEMS.map(p=>`<div class="problem-row">
      <div class="problem-ico ${p.sev==='warn'?'warn':''}">${icon(p.sev==='warn'?'alert':'close',17)}</div>
      <div>
        <div class="problem-title">${p.title}</div>
        <div class="problem-sub">${p.sub}</div>
        <div class="problem-actions">${p.actions.map((a,i)=>`<div class="btn btn-sm ${i===0?'':'btn-ghost'}" data-probid="${p.id}" data-probaction="${a.key}" role="button" tabindex="0">${a.label}</div>`).join('')}</div>
      </div>
    </div>`).join('')}`;

/* ===== azioni della pagina Problemi: prima erano pulsanti senza alcun comportamento
   collegato — "Vedi i file" non faceva nulla. Ognuna ora fa qualcosa di reale nel mockup. ===== */
function attachProblemHandlers(root){
  root.querySelectorAll('[data-probaction]').forEach(btn=>{
    bindActivatable(btn, ()=>{
      const problem = DEMO_PROBLEMS.find(x=>x.id===btn.dataset.probid);
      if(!problem) return;
      handleProblemAction(problem, btn.dataset.probaction, btn);
    });
  });
}
function removeProblem(id){
  const idx = DEMO_PROBLEMS.findIndex(x=>x.id===id);
  if(idx>-1) DEMO_PROBLEMS.splice(idx,1);
}
function handleProblemAction(problem, actionKey, triggerEl){
  if(actionKey==='viewFiles'){
    openProblemFilesDialog(problem);
  } else if(actionKey==='ignore'){
    removeProblem(problem.id);
    showToast('Problema ignorato.');
    renderAll();
  } else if(actionKey==='retry'){
    showToast('Verifica della connessione in corso…');
    if(triggerEl) triggerEl.style.opacity = '.6';
    setTimeout(()=>{
      removeProblem(problem.id);
      showToast(`Connessione ripristinata — ${FOLDERS.find(f=>f.id===problem.folderId).name} di nuovo online.`);
      renderAll();
    }, 700);
  } else if(actionKey==='details'){
    openInfoDialog('Libreria offline: dettagli', `
      <div class="modal-sub" style="margin-top:0">Keeppix indicizza questa cartella da un percorso di rete (NAS/SMB), non dal disco locale del server.</div>
      <ul style="margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-secondary);line-height:1.6">
        <li>Ultimo contatto riuscito: 2 giorni fa</li>
        <li>Percorso: <code>//nas-casa/foto/lago-di-braies</code></li>
        <li>Le foto già indicizzate restano visibili dalla cache locale; import e culling di nuovi file sono sospesi finché il percorso non torna raggiungibile</li>
      </ul>`);
  }
}

/* =========================================================
   VIEW: DUPLICATI (sezione Utilities)
   Dalla spec: la dedup via content-hash è già supportata dal modello dati, ma non
   era ancora rappresentata in questo mockup — vedi la nota nel changelog dell'iterazione
   iniziale. Aggiunta ora, sotto "Libreria" insieme a Cestino/Problemi: è un'altra pagina
   di manutenzione della libreria, non una raccolta curata come Album/Preferiti — non
   sembrava valesse la pena inventare un intero gruppo "Utilities" a parte per una voce sola.
========================================================= */
/* Ogni "file" di un gruppo duplicati è un record leggero e indipendente dal catalogo
   principale (non un oggetto photosFor), perché copie duplicate vere condividono lo
   stesso contenuto: stesso colore/miniatura, stessa dimensione, stessa estensione — solo
   il nome cambia, di solito con un suffisso "(1)"/"(copia)" come aggiunge il filesystem
   quando importi due volte lo stesso file. Pescare foto qualsiasi dal catalogo con colori
   ed estensioni diverse le avrebbe fatte sembrare tutto tranne che duplicati reali. */
function buildDuplicateGroups(){
  const dupFile = (base, id, filename) => ({
    id, filename, colorA: base.colorA, colorB: base.colorB, isRaw: base.isRaw,
    sizeMB: parseFloat(String(base.isRaw?base.sizeRaw:base.sizeJpg).replace(',','.')),
    day: base.day, monthIdx: base.monthIdx,
  });
  const withCopySuffix = (filename, suffix) => filename.replace(/(\.\w+)$/, ` ${suffix}$1`);
  const b1 = photosFor('urbino')[2];
  const b2 = photosFor('chioggia')[4];
  const group1 = [
    dupFile(b1, 'dup1a', b1.filename),
    dupFile(b1, 'dup1b', withCopySuffix(b1.filename, '(1)')),
  ];
  const group2 = [
    dupFile(b2, 'dup2a', b2.filename),
    dupFile(b2, 'dup2b', withCopySuffix(b2.filename, '(copia)')),
    dupFile(b2, 'dup2c', withCopySuffix(b2.filename, '(2)')),
  ];
  return [
    {id:'dup1', reason:'Stesso file importato due volte — import manuale e poi sync automatico dalla stessa scheda SD', items:group1, keepId:group1[0].id},
    {id:'dup2', reason:'La stessa foto è stata reimportata più volte per errore nella stessa cartella', items:group2, keepId:group2[0].id},
  ];
}
let DUPLICATE_GROUPS = buildDuplicateGroups();
function dupGroupMB(g){ return g.items.reduce((sum,it)=>sum+it.sizeMB, 0); }
function dupGroupRecoverableMB(g){
  const keep = g.items.find(it=>it.id===g.keepId);
  return Math.max(0, dupGroupMB(g) - keep.sizeMB);
}
function renderDuplicati(root){
  if(DUPLICATE_GROUPS.length===0){
    root.innerHTML = emptyStateHTML('check','Nessun duplicato trovato','Keeppix confronta l\'hash del contenuto dei file, non solo il nome — trova copie identiche anche se rinominate o in cartelle diverse.');
    return;
  }
  const totalFiles = DUPLICATE_GROUPS.reduce((s,g)=>s+g.items.length,0);
  const totalRecoverable = DUPLICATE_GROUPS.reduce((s,g)=>s+dupGroupRecoverableMB(g),0);
  root.innerHTML = `
    <div class="section-title">Duplicati</div>
    <div class="section-sub">${DUPLICATE_GROUPS.length} grupp${DUPLICATE_GROUPS.length===1?'o':'i'} · ${totalFiles} file coinvolti · fino a ${totalRecoverable.toFixed(1)} MB recuperabili tenendo una sola copia per gruppo</div>
    ${DUPLICATE_GROUPS.map(g=>`<div class="problem-row dup-group" data-dupid="${g.id}">
      <div class="problem-ico warn">${icon('copy',16)}</div>
      <div style="flex:1;min-width:0">
        <div class="problem-title">${g.items.length} file identici (stesso hash del contenuto)</div>
        <div class="problem-sub">${g.reason} — ${dupGroupRecoverableMB(g).toFixed(1)} MB recuperabili se tieni solo la copia evidenziata</div>
        <div class="bulk-strip" style="margin-top:8px">
          ${g.items.map(it=>{
            const keep = g.keepId===it.id;
            return `<div class="dup-thumb-wrap ${keep?'keep':''}" data-dupkeep="${it.id}" role="button" tabindex="0" aria-pressed="${keep}" aria-label="${keep?'Mantieni':'Segna come duplicato da eliminare, mantieni invece'} ${it.filename}">
              <div class="bulk-thumb" style="background:linear-gradient(135deg,${it.colorA},${it.colorB})">${keep?`<div class="dup-keep-badge">${icon('check',10)}</div>`:''}</div>
              <div class="dup-thumb-label">${it.filename}<br>${it.sizeMB.toFixed(1)} MB</div>
            </div>`;
          }).join('')}
        </div>
        <div class="problem-actions">
          <div class="btn btn-sm" data-dupresolve="${g.id}" role="button" tabindex="0">Risolvi gruppo</div>
          <div class="btn btn-sm btn-ghost" data-dupignore="${g.id}" role="button" tabindex="0">Ignora</div>
        </div>
      </div>
    </div>`).join('')}`;
  attachDuplicatiHandlers(root);
}
function attachDuplicatiHandlers(root){
  root.querySelectorAll('[data-dupkeep]').forEach(el=>{
    bindActivatable(el, ()=>{
      const groupEl = el.closest('[data-dupid]');
      const g = DUPLICATE_GROUPS.find(x=>x.id===groupEl.dataset.dupid);
      if(!g) return;
      g.keepId = el.dataset.dupkeep;
      renderAll();
    });
  });
  root.querySelectorAll('[data-dupresolve]').forEach(el=>{
    bindActivatable(el, ()=>{
      const g = DUPLICATE_GROUPS.find(x=>x.id===el.dataset.dupresolve);
      if(!g) return;
      const toRemove = g.items.length-1;
      const keepName = g.items.find(it=>it.id===g.keepId).filename;
      openDeleteDialogGeneric(`Eliminare ${toRemove} cop${toRemove===1?'ia duplicata':'ie duplicate'}?`, (choice)=>{
        if(choice){
          DUPLICATE_GROUPS = DUPLICATE_GROUPS.filter(x=>x.id!==g.id);
          showToast(`${toRemove} cop${toRemove===1?'ia rimossa':'ie rimosse'}, mantenuta ${keepName}.`);
        }
        renderAll();
      });
    });
  });
  root.querySelectorAll('[data-dupignore]').forEach(el=>{
    bindActivatable(el, ()=>{
      DUPLICATE_GROUPS = DUPLICATE_GROUPS.filter(x=>x.id!==el.dataset.dupignore);
      showToast('Gruppo ignorato — non verrà più segnalato.');
      renderAll();
    });
  });
}

function deleteTag(tagId){
  delete TAG_ASSIGNMENTS[tagId];
  const idx = TAGS.findIndex(t=>t.id===tagId);
  if(idx>-1) TAGS.splice(idx,1);
}
function deleteCategory(catId){
  TAGS.forEach(t=>{ if(t.categoryId===catId) t.categoryId=null; });
  const idx = TAG_CATEGORIES.findIndex(c=>c.id===catId);
  if(idx>-1) TAG_CATEGORIES.splice(idx,1);
}
const TAG_SWATCH_HUES = [24,150,205,340,270,34,195,0,120,290];
/* ===== crea/modifica tag: nome (per gli umani) vs prompt (per il modello) sono

    <div class="field">

    </div>
    <div class="field"><label>Colore</label></div>
    <div class="tag-swatches" id="tagSwatches">

      <div class="btn btn-primary" id="tagEditorSave" role="button" tabindex="0">${isNew?'Crea tag':'Salva'}</div>
      <div class="btn btn-ghost" id="tagEditorCancel" role="button" tabindex="0">Annulla</div>
      ${!isNew?`<div class="btn btn-ghost btn-danger" id="tagEditorDelete" role="button" tabindex="0" style="margin-left:auto">Elimina tag</div>`:''}
    </div>
  </div>`;
  host.appendChild(el);
  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
  };
  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };
  document.addEventListener('keydown', escHandler);
  const updateThresholdNote = ()=>{
    document.getElementById('tagThresholdNote').textContent =
      `Sopra il ${draft.threshold}% l'IA assegna il tag in automatico. Sotto, lo propone soltanto — resta in attesa della tua conferma nella coda di revisione.`;
  };

  bindActivatable(document.getElementById('tagEditorCancel'), closeDialog);
  if(!isNew) bindActivatable(document.getElementById('tagEditorDelete'), ()=>{

    const count = tagConfirmedCount(tag);

/* =========================================================
   RINOMINA CON FORMULA — un solo pannello, tre punti d'ingresso
   (dettaglio foto singola, selezione multipla, intera cartella/lotto). Lo scope
   decide solo l'etichetta e l'elenco di foto coinvolte: la logica di
   anteprima/collisione/applicazione è identica ovunque.
========================================================= */
function openRenameDialog(scope){
  const host = document.getElementById('lightboxRoot').parentElement;
  const trigger = document.activeElement;
  const draft = { schema:'{data}_{luogo}_{n:3}', includeSub:false };
  const scopeLabel = scope.kind==='single' ? `1 foto — ${scope.photos[0].filename}`
    : scope.kind==='selection' ? `${scope.photos.length} foto selezionate`
    : `Tutta la cartella "${scope.label}" (${scope.photos.length} foto)`;
  const el = document.createElement('div');
  el.className = 'modal-scrim';
  el.innerHTML = `<div class="modal-card rename-card" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
    <div class="modal-title" id="renameTitle">Rinomina con formula</div>
    <div class="modal-sub">${scopeLabel}</div>
    ${scope.hasSubfolders ? `<div class="settings-row" style="padding:6px 0 2px">
      <div class="settings-row-label" style="font-size:12.5px">Includi anche presi e scartati, non solo da valutare</div>
      <div class="mini-switch" id="renameIncludeSub" role="switch" aria-checked="false" tabindex="0"><div class="knob"></div></div>
    </div>` : ''}
    <div class="field" style="margin-top:8px">
      <label for="renameSchemaInput">Schema del nome file</label>
      <input type="text" id="renameSchemaInput" value="${escAttr(draft.schema)}" autocomplete="off">
    </div>
    <div class="rename-token-row">
      ${RENAME_TOKENS.map(t=>`<div class="rename-token-btn" data-token="${t.key}" role="button" tabindex="0">${t.label}</div>`).join('')}
    </div>
    <div class="rename-preview-label">Anteprima <span style="font-weight:400;color:var(--text-tertiary)">(prime foto)</span></div>
    <div class="rename-preview-list" id="renamePreviewList"></div>
    <div class="rename-collision-warning" id="renameCollisionWarning" style="display:none"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <div class="btn btn-primary" id="renameApplyBtn" role="button" tabindex="0">Applica</div>
      <div class="btn btn-ghost" id="renameCancelBtn" role="button" tabindex="0">Annulla</div>
    </div>
  </div>`;
  host.appendChild(el);
  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
  };
  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };
  document.addEventListener('keydown', escHandler);
  const input = document.getElementById('renameSchemaInput');
  function activePhotos(){
    if(!scope.hasSubfolders) return scope.photos;
    return draft.includeSub ? scope.photos : scope.photos.filter(p=>p.cullState==='root');
  }
  function updatePreview(){
    const list = activePhotos();
    const names = list.map((p,i)=>computeRenamedFilename(draft.schema, p, i));
    const counts = {};
    names.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
    const dupCount = names.filter(n=>counts[n]>1).length;
    document.getElementById('renamePreviewList').innerHTML = list.length ? list.slice(0,5).map((p,i)=>
      `<div class="rename-preview-row"><span class="old">${p.filename}</span>${icon('chevronRight',11)}<span class="new">${names[i]}</span></div>`
    ).join('') : `<div class="rename-preview-row" style="color:var(--text-tertiary)">Nessuna foto in questo ambito.</div>`;
    const warn = document.getElementById('renameCollisionWarning');
    const applyBtn = document.getElementById('renameApplyBtn');
    if(dupCount>0){
      warn.style.display='block';
      warn.textContent = `${dupCount} nomi risulterebbero uguali tra loro — aggiungi {n:3} o un altro campo che li distingua prima di applicare.`;
      applyBtn.style.opacity='.4'; applyBtn.style.pointerEvents='none'; applyBtn.setAttribute('aria-disabled','true');
    } else {
      warn.style.display='none';
      applyBtn.style.opacity=''; applyBtn.style.pointerEvents=''; applyBtn.removeAttribute('aria-disabled');
    }
    return {list, names, dupCount};
  }
  input.oninput = ()=>{ draft.schema = input.value; updatePreview(); };
  el.querySelectorAll('[data-token]').forEach(btn=>{
    bindActivatable(btn, ()=>{
      const token = `{${btn.dataset.token}}`;
      const start = input.selectionStart!=null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd!=null ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0,start) + token + input.value.slice(end);
      draft.schema = input.value;
      input.focus();
      const pos = start + token.length;
      input.setSelectionRange(pos,pos);
      updatePreview();
    });
  });
  const subToggle = document.getElementById('renameIncludeSub');
  if(subToggle) bindActivatable(subToggle, ()=>{
    draft.includeSub = !draft.includeSub;
    subToggle.classList.toggle('on', draft.includeSub);
    subToggle.setAttribute('aria-checked', String(draft.includeSub));
    updatePreview();
  });
  bindActivatable(document.getElementById('renameCancelBtn'), closeDialog);
  bindActivatable(document.getElementById('renameApplyBtn'), ()=>{
    const {list, names, dupCount} = updatePreview();
    if(dupCount>0 || list.length===0) return;
    list.forEach((p,i)=>{ p.filename = names[i]; });
    showToast(`${list.length} fot${list.length===1?'a rinominata':'e rinominate'}.`);
    closeDialog();
    if(typeof scope.onApplied==='function') scope.onApplied();
    renderAll();
  });
  updatePreview();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
/* ===== cartella radice di culling (Impostazioni) — un albero finto, non c'è un

function openCullingRootPickerDialog(){

    </div>
  </div>`;
  host.appendChild(el);
  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
  };
  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };
  document.addEventListener('keydown', escHandler);
  function render(){
    const crumbsHost = document.getElementById('fsCrumbs');
    crumbsHost.innerHTML = `<span class="folder-tree-crumb" data-gopath="0">/</span>` + draft.path.map((seg,i)=>` / <span class="folder-tree-crumb" data-gopath="${i+1}">${seg}</span>`).join('');
    crumbsHost.querySelectorAll('[data-gopath]').forEach(c=>{ bindActivatable(c, ()=>{ draft.path = draft.path.slice(0, Number(c.dataset.gopath)); render(); }); });
    const node = fsNodeAt(draft.path) || MOCK_FS_TREE;
    const children = node.children || [];
    const listHost = document.getElementById('fsList');
    listHost.innerHTML = children.length ? children.map(c=>`<div class="folder-tree-row" data-enter="${c.name}" role="button" tabindex="0">${icon('folder',14)}<span>${c.name}</span>${icon('chevronRight',12)}</div>`).join('') : `<div class="region-search-empty">Nessuna sottocartella qui.</div>`;
    listHost.querySelectorAll('[data-enter]').forEach(r=>{ bindActivatable(r, ()=>{ draft.path.push(r.dataset.enter); render(); }); });
  }
  render();
  bindActivatable(document.getElementById('fsCancelBtn'), closeDialog);
  bindActivatable(document.getElementById('fsUseBtn'), ()=>{
    state.cullingRootFolder = '/' + draft.path.join('/');
    showToast('Cartella di culling aggiornata.');
    closeDialog();
    renderAll();
  });
}

/* =========================================================
   VIEW: REVISIONE (coda dei suggerimenti dell'IA)
   Sopra la soglia alta l'IA assegna direttamente (vedi Tag dettaglio foto); qui vivono
   solo i suggerimenti a confidenza intermedia, che restano tali finché un umano non

function revisioneTabsHTML(){

  </div>`;
}
function wireRevisioneTabs(root){
  root.querySelectorAll('[data-revtab]').forEach(el=>{
    bindActivatable(el, ()=>{ state.revisioneTab = el.dataset.revtab; renderAll(); });
  });
}
function renderRevisione(root){
  if(!('revisioneTab' in state)) state.revisioneTab = 'tag';
  if(state.revisioneTab==='volti'){ renderRevisioneVolti(root); return; }
  const groups = TAGS.map(t=>({tag:t, photos: allPhotos().filter(p=>{ const e=tagEntry(t.id,p.id); return e && e.status==='suggested'; })}))
    .filter(g=>g.photos.length>0);
  if(groups.length===0){
    root.innerHTML = revisioneTabsHTML() + emptyStateHTML('inbox','Nessun suggerimento in attesa','Quando l\'IA troverà corrispondenze a confidenza intermedia per i tuoi tag, appariranno qui per la tua conferma — mai applicate da sole.');
    wireRevisioneTabs(root);

/* =========================================================
   VIEW: ANALISI LIBRERIA
   La pausa è automatica (in base alla navigazione reale nell'app, vedi renderAll) e deve
   leggersi come comportamento previsto, mai come "bloccato": nessuna icona d'errore, nessun
   colore d'allarme, solo un badge neutro e una frase che spiega perché.
========================================================= */
let _analysisTicker = null;
function analysisIsPaused(){ return !state.forceRunningOnce && (Date.now() - state.lastNavAt) < 4000; }
function ensureAnalysisTicker(){
  if(_analysisTicker) return;
  _analysisTicker = setInterval(()=>{
    if(state.view!=='analisiLibreria' || state.aiTier==='spento'){ clearInterval(_analysisTicker); _analysisTicker=null; return; }
    if(!analysisIsPaused()){
      state.analysisProgress.done = Math.min(state.analysisProgress.total, state.analysisProgress.done + 55);
    }
    const root = document.getElementById('viewRoot');
    if(root && state.view==='analisiLibreria') renderAnalisiLibreria(root, true);
  }, 1000);
}
function renderAnalisiLibreria(root, tickOnly){
  if(!tickOnly) ensureAnalysisTicker();
  if(state.aiTier==='spento'){
    root.innerHTML = `<div class="section-title">Analisi libreria</div>
      <div class="section-sub">Riconoscimento tag e ricerca semantica su tutte le foto</div>
      ${emptyStateHTML('cpu','Analisi automatica disattivata','Questo server è in modalità "Spenta" (Impostazioni → Intelligenza artificiale) — hardware o database non adatti. Tag manuali e ricerca per nome, cartella o data restano disponibili.')}`;
    return;
  }
  const prog = state.analysisProgress;
  const pct = Math.min(100, Math.round(prog.done/prog.total*100));
  const remaining = Math.max(0, prog.total - prog.done);
  const paused = analysisIsPaused();
  const done = pct>=100;
  root.innerHTML = `
    <div class="section-title">Analisi libreria</div>
    <div class="section-sub">Riconoscimento tag su tutte le foto — gira in background, non blocca l'uso dell'app</div>
    <div class="analysis-card">
      <div class="analysis-status-row">
        ${done ? `<div class="analysis-status-badge running">${icon('check',12)} Completata</div><div class="analysis-status-note">Tutta la libreria è stata analizzata. Le nuove foto importate entrano automaticamente in coda.</div>`
        : paused ? `<div class="analysis-status-badge paused">${icon('info',12)} In pausa</div><div class="analysis-status-note">Stai usando l'app — riprende da sola pochi secondi dopo l'ultima azione, senza bisogno di far nulla.</div>`
        : `<div class="analysis-status-badge running"><span class="analysis-pulse"></span> In corso</div><div class="analysis-status-note">Nessuna attività recente: sta usando la macchina a piena capacità.</div>`}
      </div>
      <div class="analysis-progress-bar"><div class="analysis-progress-fill" style="width:${pct}%"></div></div>
      <div class="analysis-progress-meta">
        <span><b>${prog.done.toLocaleString('it-IT')}</b> di ${prog.total.toLocaleString('it-IT')} foto (${pct}%)</span>
        ${done ? '' : `<span>${paused ? 'in pausa' : `stima: ${etaLabel(remaining)} rimanenti a questa velocità`}</span>`}
      </div>
      <div class="settings-section-sub" style="margin-top:12px;margin-bottom:0">Di notte (2:00–7:00) l'analisi lavora a piena velocità su tutti i core disponibili, ignorando le pause di inattività.</div>
      ${(paused && !done) ? `<div class="btn btn-sm" id="analysisContinueNow" role="button" tabindex="0" style="margin-top:12px">${icon('activity',13)} Continua ora</div>` : ''}
    </div>
    ${state.aiTier==='ridotto' ? `<div class="settings-section" style="margin-top:20px">
      <div class="settings-section-title">Modalità "Ridotta"</div>
      <div class="settings-section-sub">Niente analisi automatica di massa in background su questa macchina — puoi comunque analizzare a mano quello che serve.</div>
      <div class="btn btn-sm" id="analysisManualRun" role="button" tabindex="0">${icon('activity',13)} Analizza ora ${(FOLDERS.find(f=>f.id===state.currentFolder) || FOLDERS[0]).name}</div>
    </div>` : ''}
    <div class="settings-section" style="margin-top:20px">
      <div class="settings-section-title">Cosa fa</div>
      <div class="settings-section-sub" style="margin-bottom:0">Per ogni foto calcola una volta un vettore che serve sia per abbinare i tag che crei in "Tag e categorie", sia per la ricerca per descrizione libera in "Cerca". Non serve rifarlo per ogni ricerca.</div>
    </div>
  `;
  const btn = document.getElementById('analysisContinueNow');
  if(btn) bindActivatable(btn, ()=>{ state.forceRunningOnce = true; renderAnalisiLibreria(root); });
  const manualBtn = document.getElementById('analysisManualRun');
  if(manualBtn) bindActivatable(manualBtn, ()=>{
    state.analysisProgress.done = Math.min(state.analysisProgress.total, state.analysisProgress.done + 640);
    showToast(`Analisi manuale completata per ${(FOLDERS.find(f=>f.id===state.currentFolder) || FOLDERS[0]).name}.`);
    renderAnalisiLibreria(root);
  });
}
function etaLabel(remainingPhotos){
  const min = Math.round(remainingPhotos*aiMsPerPhoto()/1000/60);
  return min<60 ? `${min} min` : `${(min/60).toFixed(1)} h`;
}

            <div class="mobile-back" id="regionSearchClose" role="button" tabindex="0" aria-label="Chiudi ricerca regioni, senza aggiungere nulla">${icon('close',15)}</div>
          </div>
          <div class="region-search-results" id="regionSearchResults" role="listbox" aria-label="Risultati ricerca regioni"></div>
        </div>` : `<div class="btn btn-sm btn-ghost" id="regionAddBtn" role="button" tabindex="0" style="margin-top:10px">${icon('plus',13)} Aggiungi regione</div>`}
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Cartella di culling</div>
      <div class="settings-section-sub">La cartella radice sul disco dentro cui vivono i lotti — una sottocartella per importazione. Serve anche a poterla sincronizzare da un altro computer (es. via WebDAV) dopo aver scelto le foto.</div>
      <div class="region-row">
        <div><div class="region-name">${state.cullingRootFolder}</div><div class="region-sub">${CULLING_BATCHES.length} lotti attivi</div></div>
        <div class="btn btn-sm" id="cullingRootChangeBtn" role="button" tabindex="0">Cambia…</div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Notifiche</div>
      <div class="settings-row"><div class="settings-row-label">Riepilogo settimanale</div><div class="mini-switch ${state.notifPrefs.digest?'on':''}" data-notif="digest"><div class="knob"></div></div></div>
      <div class="settings-row"><div class="settings-row-label">Nuove condivisioni ricevute</div><div class="mini-switch ${state.notifPrefs.condivisioni?'on':''}" data-notif="condivisioni"><div class="knob"></div></div></div>
      <div class="settings-row"><div class="settings-row-label">Problemi rilevati</div><div class="mini-switch ${state.notifPrefs.problemi?'on':''}" data-notif="problemi"><div class="knob"></div></div></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Lingua</div>
      <div class="field" style="max-width:220px"><select><option>Italiano</option><option>English</option></select></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Intelligenza artificiale</div>
      <div class="settings-section-sub">Misurata automaticamente su questo server — le tre modalità sono tutte configurazioni valide, non errori</div>
      <div class="seg-control" id="aiTierSeg" role="radiogroup" aria-label="Modalità intelligenza artificiale">
        <div class="seg-option ${state.aiTier==='pieno'?'active':''}" data-aitier="pieno" role="radio" aria-checked="${state.aiTier==='pieno'}" tabindex="${state.aiTier==='pieno'?0:-1}">Piena</div>
        <div class="seg-option ${state.aiTier==='ridotto'?'active':''}" data-aitier="ridotto" role="radio" aria-checked="${state.aiTier==='ridotto'}" tabindex="${state.aiTier==='ridotto'?0:-1}">Ridotta</div>
        <div class="seg-option ${state.aiTier==='spento'?'active':''}" data-aitier="spento" role="radio" aria-checked="${state.aiTier==='spento'}" tabindex="${state.aiTier==='spento'?0:-1}">Spenta</div>
      </div>
      <div class="ai-tier-note">${AI_TIER_COPY[state.aiTier]}</div>
      ${state.aiTier!=='spento' ? `
      <div class="settings-row"><div class="settings-row-label">Modello in uso</div><div style="font-size:12.5px;color:var(--text-secondary)">${AI_MODEL_NAME}</div></div>
      <div class="settings-row"><div class="settings-row-label">Velocità misurata su questa macchina</div><div style="font-size:12.5px;color:var(--text-secondary)">${aiMsPerPhoto()} ms per foto</div></div>
      ` : ''}
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Riconoscimento volti</div>
      <div class="settings-section-sub">I volti sono dati biometrici — un trattamento diverso da un tag "tramonto". Non compaiono mai su un link pubblico condiviso: non è configurabile, vale sempre.</div>
      <div class="settings-row">
        <div class="settings-row-label">Riconoscimento facciale attivo</div>
        <div class="mini-switch ${state.faceRecognitionEnabled?'on':''}" id="faceRecToggle" role="switch" aria-checked="${state.faceRecognitionEnabled}" tabindex="0"><div class="knob"></div></div>
      </div>
      ${!state.faceRecognitionEnabled ? `<div class="settings-section-sub" style="margin-top:0">Disattivato: nessun volto nuovo viene rilevato, e "Persone" non mostra più nulla. I dati già raccolti restano salvati finché non li elimini qui sotto.</div>` : ''}
      <div class="btn btn-sm btn-ghost btn-danger" id="faceDataDeleteBtn" role="button" tabindex="0" style="margin-top:12px">${icon('trash',13)} Elimina tutti i dati dei volti</div>
    </div>

    <div class="settings-section demo-section">
      <div class="settings-section-title">Anteprima stati ${ico('flask',13,'demo-flag')}</div>
      <div class="settings-section-sub">Solo in questo prototipo. Gli stati di caricamento ed errore dipendono dalla rete e da un server vero: qui i dati sono già in memoria, quindi senza questi interruttori non si vedrebbero mai. Accendili per rivederne il disegno in ogni schermata. Nel prodotto finito questa sezione non esiste.</div>
      <div class="settings-row">
        <div><div class="settings-row-label">Rete lenta</div><div class="settings-row-sub">Ogni schermata impiega ${(DEMO_LATENCY_MS/1000).toFixed(1).replace('.',',')} s a caricare i suoi dati, mostrando intanto lo scheletro del contenuto.</div></div>
        <div class="mini-switch ${state.demo.slow?'on':''}" data-demo="slow" role="switch" tabindex="0" aria-checked="${state.demo.slow}" aria-label="Simula rete lenta"><div class="mini-knob"></div></div>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Errore di caricamento</div><div class="settings-row-sub">Le richieste falliscono invece di completarsi: mostra lo stato d'errore a piena vista, con il suo "Riprova".</div></div>
        <div class="mini-switch ${state.demo.loadError?'on':''}" data-demo="loadError" role="switch" tabindex="0" aria-checked="${state.demo.loadError}" aria-label="Simula errore di caricamento"><div class="mini-knob"></div></div>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">Esito parziale</div><div class="settings-row-sub">Le azioni su più foto riescono solo su una parte — il caso più probabile su un'operazione di massa, e quello che di solito nessuno disegna.</div></div>
        <div class="mini-switch ${state.demo.partial?'on':''}" data-demo="partial" role="switch" tabindex="0" aria-checked="${state.demo.partial}" aria-label="Simula esito parziale"><div class="mini-knob"></div></div>
      </div>
    </div>`;

  root.querySelectorAll('[data-demo]').forEach(el=>{
    bindActivatable(el, ()=>{
      const k = el.dataset.demo;
      state.demo[k] = !state.demo[k];
      // Cambiando le condizioni simulate, le viste già "caricate" vanno dimenticate:
      // altrimenti accendere l'errore non avrebbe effetto su ciò che è già a schermo.
      resetLoadStates();
      renderAll();
    });
  });

  root.querySelectorAll('[data-theme-pref]').forEach(el=>{
    el.onclick = ()=>{
      state.themePref = el.dataset.themePref;
      if(state.themePref==='sistema'){
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        state.theme = prefersDark ? 'dark' : 'light';
      } else {
        state.theme = state.themePref==='scuro' ? 'dark' : 'light';
      }
      applyTheme(); renderAll();
    };
  });
  root.querySelectorAll('[data-aitier]').forEach(el=>{
    bindActivatable(el, ()=>{ state.aiTier = el.dataset.aitier; renderAll(); });
  });
  bindActivatable(document.getElementById('cullingRootChangeBtn'), openCullingRootPickerDialog);
  bindActivatable(document.getElementById('faceRecToggle'), ()=>{ state.faceRecognitionEnabled = !state.faceRecognitionEnabled; renderAll(); });
  bindActivatable(document.getElementById('faceDataDeleteBtn'), ()=>{
    openConfirmDialog('Eliminare tutti i dati dei volti?', 'Persone, gruppi e volti riconosciuti verranno cancellati per sempre — non tocca le foto, solo i dati di riconoscimento facciale. Non è recuperabile.', 'Elimina tutto', ()=>{
      wipeAllFaceData();
      state.openPerson = null;
      state.personSelectedIds.clear();
      showToast('Dati dei volti eliminati.');
      renderAll();
    });
  });
  const slider = document.getElementById('densitySlider');
  if(slider){
    slider.oninput = (e)=>{
      const n = Number(e.target.value);
      state.gridDensity[state.device] = n;
      state.customDensity[state.device] = true;
      const sub = document.getElementById('densitySub');
      const devLabel2 = state.device==='mobile' ? 'Mobile' : 'Desktop';
      if(sub) sub.textContent = `Colonne nella Timeline su questo dispositivo (${devLabel2}) — salvata separatamente da desktop e mobile (${n} colonne)`;
    };
  }
  root.querySelectorAll('[data-notif]').forEach(el=>{
    el.onclick = ()=>{ const k=el.dataset.notif; state.notifPrefs[k]=!state.notifPrefs[k]; renderAll(); };
  });
  root.querySelectorAll('[data-region-download]').forEach(el=>{
    bindActivatable(el, ()=>{
      const r = state.mapRegions.find(x=>x.id===el.dataset.regionDownload);
      if(r){ r.status='scaricata'; showToast(`${r.name} scaricata.`); renderAll(); }
    });
  });
  root.querySelectorAll('[data-region-remove]').forEach(el=>{
    bindActivatable(el, ()=>{
      const r = state.mapRegions.find(x=>x.id===el.dataset.regionRemove);
      if(r){ r.status='non scaricata'; showToast(`${r.name} rimossa — spazio liberato.`); renderAll(); }
    });
  });
  root.querySelectorAll('[data-region-delete]').forEach(el=>{
    bindActivatable(el, ()=>{
      state.mapRegions = state.mapRegions.filter(x=>x.id!==el.dataset.regionDelete);
      renderAll();
    });
  });
  bindActivatable(document.getElementById('regionAddBtn'), ()=>{
    state.regionPickerOpen = true; state.regionSearchQuery=''; renderAll();
    setTimeout(()=>{ const i=document.getElementById('regionSearchInput'); if(i) i.focus(); },0);
  });
  const regionSearchInput = document.getElementById('regionSearchInput');
  if(regionSearchInput){
    regionSearchInput.focus();
    regionSearchInput.setSelectionRange(regionSearchInput.value.length, regionSearchInput.value.length);
    regionSearchInput.oninput = (e)=>{ state.regionSearchQuery = e.target.value; renderRegionSearchResults(); };
    // Esc funziona ovunque sia il focus: gestito globalmente in KEYBOARD SHORTCUTS più sotto.
  }
  bindActivatable(document.getElementById('regionSearchClose'), ()=>{ state.regionPickerOpen=false; state.regionSearchQuery=''; renderAll(); });
  renderRegionSearchResults();
}
function renderRegionSearchResults(){
  const host = document.getElementById('regionSearchResults');
  if(!host) return;
  const q = (state.regionSearchQuery||'').trim().toLowerCase();
  const already = new Set(state.mapRegions.map(r=>r.id));
  let results = EXTRA_REGIONS_POOL.filter(x=>!already.has(x.id));
  if(q) results = results.filter(x=>x.name.toLowerCase().includes(q));
  results = results.slice(0,8);
  host.innerHTML = results.length ? results.map(x=>`
    <div class="region-search-row" data-region-add="${x.id}" role="option" tabindex="0" aria-selected="false">
      <span>${x.name}</span><span class="region-search-size">${x.size}</span>
    </div>`).join('')
    : `<div class="region-search-empty">${q ? 'Nessuna regione trovata.' : 'Digita per cercare tra le regioni disponibili — ce ne sono troppe per un elenco unico.'}</div>`;
  host.querySelectorAll('[data-region-add]').forEach(el=>{
    bindActivatable(el, ()=>{
      const pool = EXTRA_REGIONS_POOL.find(x=>x.id===el.dataset.regionAdd);
      if(pool){ state.mapRegions.push({id:pool.id, name:pool.name, size:pool.size, status:'non scaricata', builtin:false}); }
      state.regionPickerOpen = false;
      state.regionSearchQuery = '';
      showToast(`${pool.name} aggiunta all'elenco.`);
      renderAll();
    });
  });
}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */
document.addEventListener('keydown', (e)=>{
  if(state.lightbox){
    // Esc chiude prima il menu ⋯ se aperto, solo un secondo Esc chiude il lightbox intero
    if(e.key==='Escape' && state.lbMoreOpen){ state.lbMoreOpen=false; renderAll(); return; }
    if(e.key==='Escape') closeLightbox();
    else if(e.key==='ArrowLeft') lbNav(-1);
    else if(e.key==='ArrowRight') lbNav(1);
    else if(e.key==='i' || e.key==='I'){ state.lbInfoOpen=!state.lbInfoOpen; renderAll(); }
    else if(e.key==='f' || e.key==='F'){ state.lightbox.isFav=!state.lightbox.isFav; renderAll(); }
    return;
  }
  // Esc chiude la ricerca regioni indipendentemente da dove si trova il focus in quel
  // momento (non solo quando il focus è nel campo di testo) — prima si poteva restare
  // "intrappolati" lì se il focus era finito su un risultato o sul pulsante Annulla.
  // Esc a livelli sul pannello dei caricamenti: prima chiude il menu della destinazione,
  // solo un secondo Esc chiude il pannello. Il caricamento continua comunque: chiudere il
  // pannello non annulla nulla, ed è il dock nella sidebar a ricordarlo.
  if(state.upload.destMenuOpen && e.key==='Escape'){
    state.upload.destMenuOpen = false; renderUploadPanel(); return;
  }
  if(state.upload.open && e.key==='Escape'){
    state.upload.open = false; renderUploadPanel(); renderUploadDock(); return;
  }
  if(state.regionPickerOpen && e.key==='Escape'){
    state.regionPickerOpen = false; state.regionSearchQuery = ''; renderAll(); return;
  }
  if(state.openPicklistIdx!==null && e.key==='Escape'){
    state.openPicklistIdx = null; renderAll(); return;
  }
  if(state.browseFilterOpen && e.key==='Escape'){
    state.browseFilterOpen = false; renderAll(); return;
  }
  if(state.searchSuggestOpen && e.key==='Escape'){
    state.searchSuggestOpen = false; renderSearchSuggest(); return;
  }
  if(state.view==='culling' && state.cullingBatchId){
    const q=cullingQueue();
    if(e.key==='ArrowLeft'){
      if(e.shiftKey){
        const anchor = state.cullingSelectAnchor!==null ? state.cullingSelectAnchor : state.cullingIdx;
        state.cullingIdx = Math.max(0,state.cullingIdx-1);
        cullingSelectRange(q, anchor, state.cullingIdx);
        state.cullingSelectAnchor = anchor;
      } else {
        if(state.cullingSelectedIds.size>0) cullingClearSelection();
        state.cullingIdx=Math.max(0,state.cullingIdx-1);
      }
      renderAll();
    }
    else if(e.key==='ArrowRight'){
      if(e.shiftKey){
        const anchor = state.cullingSelectAnchor!==null ? state.cullingSelectAnchor : state.cullingIdx;
        state.cullingIdx = Math.min(q.length-1,state.cullingIdx+1);
        cullingSelectRange(q, anchor, state.cullingIdx);
        state.cullingSelectAnchor = anchor;
      } else {
        if(state.cullingSelectedIds.size>0) cullingClearSelection();
        state.cullingIdx=Math.min(q.length-1,state.cullingIdx+1);
      }
      renderAll();
    }
    else if(e.key==='p'||e.key==='P') decideCulling('taken');
    else if(e.key==='x'||e.key==='X'||e.key==='Delete') decideCulling('skipped');
    else if(['1','2','3','4','5'].includes(e.key)){ const cur=q[state.cullingIdx]; if(cur){ const n=Number(e.key); cur.rating=(cur.rating===n)?0:n; renderAll(); } }
  }
});

/* =========================================================
   CARICAMENTO — trascinamento e selettore di file
   Il trascinamento è la porta principale da desktop: è quello che un fotografo fa già
   dal gestore file, e a riposo non occupa un solo pixel dell'interfaccia.
========================================================= */
(function wireUploadEntryPoints(){
  const app = document.getElementById('app');
  if(!app) return;

  const hasFiles = (e)=> e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files');

  app.addEventListener('dragenter', (e)=>{
    if(!hasFiles(e)) return;
    e.preventDefault();
    _dragDepth++;
    if(!state.dragging){ state.dragging = true; renderDropOverlay(); }
  });
  app.addEventListener('dragover', (e)=>{
    if(!hasFiles(e)) return;
    e.preventDefault();                       // senza questo il browser apre il file
    e.dataTransfer.dropEffect = 'copy';
  });
  app.addEventListener('dragleave', (e)=>{
    if(!hasFiles(e)) return;
    _dragDepth = Math.max(0, _dragDepth-1);
    if(_dragDepth===0 && state.dragging){ state.dragging = false; renderDropOverlay(); }
  });
  app.addEventListener('drop', (e)=>{
    if(!hasFiles(e)) return;
    e.preventDefault();
    _dragDepth = 0;
    state.dragging = false;
    renderDropOverlay();
    // La destinazione si eredita da dove si è rilasciato: dentro una cartella è quella.
    // Il Culling non accetta rilasci — è un'area separata con un suo flusso.
    if(state.view==='culling'){
      showToast('Il Culling ha un suo percorso di importazione: qui non si rilasciano file.', {kind:'error'});
      return;
    }
    uploadAddFiles(e.dataTransfer.files, state.view==='foto' ? state.currentFolder : null);
  });

  const inp = document.getElementById('uploadInput');
  if(inp){
    inp.addEventListener('change', (e)=>{
      const hint = inp.dataset.destHint || null;
      uploadAddFiles(e.target.files, hint || null);
      inp.value = '';
    });
  }
})();

/* =========================================================
   INIT
========================================================= */
applyTheme();
renderAll();
</script>
