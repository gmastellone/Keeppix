<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeppix — Fase 7, tredicesima iterazione</title>
<style>
:root{
  --page-bg:#f5f5f5;
  --page-text:#16161a;
  --page-text-soft:#6b6b6f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--page-bg);
  color:var(--page-text);
  padding:40px 32px 80px;
}
.wrap{max-width:1220px;margin:0 auto;}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#F2812E;margin-bottom:8px;
}
h1{font-size:28px;margin:0 0 14px;letter-spacing:-.01em;}
.intro{font-size:14.5px;line-height:1.6;color:var(--page-text-soft);max-width:820px;margin:0 0 10px;}
.intro b{color:var(--page-text);}
.changelog{
  max-width:820px;font-size:13.5px;line-height:1.7;color:var(--page-text-soft);
  margin:14px 0 26px;padding:14px 16px;background:#fff;border:1px solid #e6e6e6;border-radius:10px;
}
.changelog b{color:var(--page-text);}
.changelog ul{margin:6px 0 0;padding-left:18px;}
.changelog li{margin-bottom:4px;}
.tag-new{display:inline-block;font-size:10px;font-weight:700;background:#FDE7D6;color:#A14D12;border-radius:4px;padding:1px 5px;margin-right:5px;letter-spacing:.02em;}
.tag-fix{display:inline-block;font-size:10px;font-weight:700;background:#E4EEFB;color:#2A5FA8;border-radius:4px;padding:1px 5px;margin-right:5px;letter-spacing:.02em;}

/* ===== app frame chrome ===== */
.frame-outer{
  background:#ececec;border-radius:14px;padding:0;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.08);
  border:1px solid #ddd;
}
.frame-bar{
  height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;
  background:#ececec;border-bottom:1px solid #ddd;
}
.frame-dot{width:10px;height:10px;border-radius:50%;background:#d0d0d0;}
.frame-url{
  margin-left:10px;font-size:12px;color:#8a8a8a;background:#fff;border:1px solid #ddd;
  border-radius:6px;padding:3px 12px;flex:0 0 auto;
}

/* ===== themed app ===== */
#app{
  display:flex;height:680px;overflow:hidden;position:relative;
  transition:background .25s ease,color .25s ease;
}
#app[data-theme="light"]{
  --bg:#ffffff; --bg-elevated:#ffffff; --sidebar-bg:#ffffff;
  --text:#16161a; --text-secondary:#6b6b6f; --text-tertiary:#757580;
  --border:#ececec; --border-strong:#dcdcdc;
  --accent:#F2812E; --accent-text:#1a1005;
  --accent-tint:#FDE7D6; --accent-tint-strong:#FBDABE;
  --danger:#CC4038; --danger-tint:#FBE4E2; --danger-border:#F0BDB8;
  /* "riuscito solo in parte" non è né un successo né un errore: ha un colore proprio */
  --warn:#A15C00; --warn-tint:#FDF0DC; --warn-border:#EFD4A8;
  /* il toast è invertito rispetto al tema (fondo scuro su tema chiaro), quindi i suoi
     filetti colorati non possono usare --danger/--warn: servono varianti che si leggano
     sulla superficie invertita */
  --toast-danger:#FF7A6E; --toast-warn:#FFB84D;
  --skel-sheen:rgba(255,255,255,.9);
  --chip-bg:#f5f5f5; --chip-bg-hover:#ececec; --card-bg:#ffffff;
  --scrim:rgba(20,20,20,.72);
  --map-bg:linear-gradient(160deg,#eef3ea,#e4ece2 40%,#dbe7e0);
  --shadow:0 1px 2px rgba(0,0,0,.05);
  background:var(--bg); color:var(--text);
}
#app[data-theme="dark"]{
  --bg:#000000; --bg-elevated:#0a0a0a; --sidebar-bg:#000000;
  --text:#f2f2f2; --text-secondary:#9a9a9e; --text-tertiary:#6b6b6f;
  --border:#1e1e1e; --border-strong:#2c2c2c;
  --accent:#FF9D52; --accent-text:#1a1005;
  --accent-tint:#2c1c0e; --accent-tint-strong:#3d2712;
  --danger:#FF6B61; --danger-tint:#331411; --danger-border:#5A2621;
  --warn:#F0A23C; --warn-tint:#2E2110; --warn-border:#4A361A;
  --toast-danger:#C6382F; --toast-warn:#A66200;
  --skel-sheen:rgba(255,255,255,.06);
  --chip-bg:#141414; --chip-bg-hover:#1c1c1c; --card-bg:#0a0a0a;
  --scrim:rgba(0,0,0,.85);
  --map-bg:linear-gradient(160deg,#10151c,#0c1116 45%,#0a0f13);
  --shadow:0 1px 2px rgba(0,0,0,.6);
  background:var(--bg); color:var(--text);
}
#app *{transition:background-color .2s ease,border-color .2s ease,color .2s ease;}

/* scrollbars inside app */
#app ::-webkit-scrollbar{width:9px;height:9px;}
#app ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}
#app ::-webkit-scrollbar-track{background:transparent;}

/* ===== sidebar ===== */
.sidebar{
  width:216px;flex:0 0 auto;background:var(--sidebar-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;}
/* Simbolo del logo (brand guidelines v4): anello + pallino — il pallino è l'unico elemento
   a colore in tutto il sistema. L'anello segue il colore del testo (grafite su chiaro,
   quasi-bianco su scuro, si legge in entrambi i temi senza bisogno di due asset diversi);
   il pallino resta sempre var(--accent) e in tema chiaro ha un sottile contorno grafite
   (fix di accessibilità dall'audit: senza, il pallino pieno arancione su bianco è 2.64:1,
   sotto la soglia minima 3:1 anche per un elemento grafico — col contorno sale a 11.37:1).*/
.brand-mark{width:26px;height:26px;flex:0 0 auto;color:var(--text);}
.brand-mark svg{display:block;width:100%;height:100%;}
.brand-mark-dot{stroke:none;}
#app[data-theme="light"] .brand-mark-dot{stroke:#3A3A3A;stroke-width:3;}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:-.01em;}
.nav-group{margin-bottom:16px;}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);padding:0 10px;margin:0 0 6px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:8px;font-size:14px;color:var(--text);cursor:pointer;
  border-left:2.5px solid transparent;margin-bottom:1px;user-select:none;
}
.nav-item:hover{background:var(--chip-bg);}
/* stesso linguaggio ovunque nella sidebar (voci di primo livello, sotto-voci, cartelle):
   grigio + bordino a sinistra arancione — mai il pieno arancione, che qui è riservato al
   pallino di notifica. Vedi .folder-item.active poco sotto, stesso identico trattamento. */
.nav-item.active{background:var(--chip-bg);border-left-color:var(--accent);font-weight:600;}
.nav-item .ico{width:16px;height:16px;flex:0 0 auto;opacity:.85;}
.nav-item-left{display:flex;align-items:center;gap:9px;}
/* voce a scomparsa "Manutenzione" (Cestino/Duplicati/Problemi): stessa riga di un
   nav-item normale, più una chevron che ruota in apertura; le sotto-voci sono
   nav-item leggermente più piccoli e rientrati, per restare leggibili come
   "dentro" il gruppo senza sembrare una sezione completamente nuova. */
.nav-maint-toggle{justify-content:space-between;}
.nav-maint-toggle .ico:last-child{transition:transform .15s ease;opacity:.6;}
.nav-maint-toggle.open .ico:last-child{transform:rotate(180deg);}
/* il gruppo va "segnalato" quando una delle sue sotto-voci è la vista corrente, ma non con
   lo stesso trattamento della sotto-voce stessa (altrimenti sembrano entrambe "qui sei") —
   solo il testo si scurisce/appesantisce, niente sfondo né bordino: quello resta un segnale
   esclusivo di dove ci si trova davvero. */
.nav-maint-toggle.parent-active{font-weight:600;}
.nav-maint-toggle.parent-active .ico{opacity:1;}
.nav-subitem{padding-left:26px;font-size:13px;}
.nav-subitem .nav-item-left{gap:8px;}
.nav-badge{
  background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;
  padding:1px 6px;min-width:16px;text-align:center;
}
.folder-item{
  display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;
  font-size:13.5px;color:var(--text-secondary);cursor:pointer;border-left:2.5px solid transparent;
}
.folder-item:hover{background:var(--chip-bg);color:var(--text);}
.folder-item.active{color:var(--text);font-weight:600;border-left-color:var(--accent);background:var(--chip-bg);}
.sidebar-spacer{flex:1;}
.storage-card{
  background:var(--chip-bg);border-radius:10px;padding:11px 12px;margin:6px 2px 12px;
}
.storage-label{font-size:11px;color:var(--text-secondary);margin-bottom:2px;}
.storage-value{font-size:12.5px;font-weight:600;margin-bottom:8px;}
.storage-bar{height:5px;border-radius:3px;background:var(--border-strong);overflow:hidden;}
.storage-bar-fill{height:100%;background:var(--accent);width:12.75%;}
.user-footer{display:flex;align-items:center;gap:9px;padding:8px 6px 2px;cursor:pointer;border-radius:8px;position:relative;}
.user-footer:hover{background:var(--chip-bg);}
.user-menu{
  position:absolute;bottom:calc(100% + 6px);left:2px;width:190px;background:var(--card-bg);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);
  padding:6px;z-index:20;
}
.user-menu-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--text);}
.user-menu-item:hover{background:var(--chip-bg);}
.user-menu-item.danger{color:var(--danger);}
.user-menu-sep{height:1px;background:var(--border);margin:5px 2px;}
.toast{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);font-size:12.5px;padding:9px 16px;border-radius:9px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s ease,transform .2s ease;z-index:90;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== profilo / impostazioni ===== */
.settings-section{margin-bottom:28px;max-width:560px;}
.settings-section-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.settings-section-sub{font-size:12px;color:var(--text-tertiary);margin-bottom:12px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:14px;}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:13px;font-weight:600;}
.settings-row-sub{font-size:11.5px;color:var(--text-tertiary);margin-top:1px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:11.5px;font-weight:600;color:var(--text-secondary);}
.field input, .field select{
  font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--chip-bg);color:var(--text);width:100%;
}
.mini-switch{width:36px;height:20px;border-radius:11px;background:var(--border-strong);position:relative;cursor:pointer;flex:0 0 auto;}
.mini-switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s ease;}
.mini-switch.on{background:var(--accent);}
.mini-switch.on .knob{left:18px;}
.seg-control{display:flex;background:var(--chip-bg);border-radius:9px;padding:3px;gap:2px;width:fit-content;}
.seg-option{font-size:12.5px;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--text-secondary);}
.seg-option.active{background:var(--card-bg);color:var(--text);font-weight:600;box-shadow:var(--shadow);}
.density-slider{width:100%;accent-color:var(--accent);}
.region-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.region-row:last-child{border-bottom:none;}
.region-name{font-size:13px;font-weight:600;}
.region-sub{font-size:11.5px;color:var(--text-tertiary);}
.session-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
.session-row:last-child{border-bottom:none;}
.session-ico{width:32px;height:32px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.problem-row{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;}
.problem-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--danger-tint);color:var(--danger);}
.problem-ico.warn{background:var(--accent-tint);color:var(--accent);}
.problem-title{font-size:13.5px;font-weight:700;}
.problem-sub{font-size:12px;color:var(--text-tertiary);margin:2px 0 9px;}
.problem-actions{display:flex;gap:8px;}
/* Testo sempre bianco, non var(--accent-text): l'avatar (iniziali) resta leggibile sopra
   qualunque sfondo scelto — sia il default arancione, sia gli altri colori assegnati alle
   persone (share/collaboratori) o scelti dall'utente in Profilo — mentre --accent-text
   (ora scuro in tema chiaro) resta riservato ai veri elementi su sfondo --accent puro
   (bottoni, badge, spunte). Confermato da Giovanni: bianco su arancione va bene qui,
   trattato come elemento di marca più che testo da leggere a lungo. */
.avatar{
  width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;
}
.user-name{font-size:13px;font-weight:600;}
.user-status{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;}
.avatar-color-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px;}
.avatar-color-swatch{
  width:30px;height:30px;border-radius:50%;cursor:pointer;color:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 0 0 2px transparent;transition:box-shadow .12s ease;
}
.avatar-color-swatch:hover{box-shadow:0 0 0 2px var(--border-strong);}
.avatar-color-swatch.on{box-shadow:0 0 0 2px var(--text);}
/* verde più scuro dello stato "online" originale (#3FB65C, 2.61:1 su bianco — sotto la
   soglia grafica minima 3:1): stesso verde semantico già usato per "Scelta"/pick nel
   culling (#2E9E5B, 3.4:1 su bianco), riusato qui invece di introdurre una terza tonalità. */
.status-dot{width:6px;height:6px;border-radius:50%;background:#2E9E5B;}

/* ===== main / topbar ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.topbar{
  height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--border);gap:16px;
}
.breadcrumb{font-size:14.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.breadcrumb b{color:var(--text);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;flex:0 0 auto;}
.theme-toggle{
  width:46px;height:25px;border-radius:14px;background:var(--chip-bg);border:1px solid var(--border-strong);
  position:relative;cursor:pointer;flex:0 0 auto;
}
.theme-toggle-knob{
  position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--accent);
  transition:left .18s ease;
}
#app[data-theme="dark"] .theme-toggle-knob{left:25px;}
.search-box{
  width:230px;font-size:13px;color:var(--text-secondary);background:var(--chip-bg);
  border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:text;
}
.search-box:hover{background:var(--chip-bg-hover);}

.view-root{flex:1;overflow-y:auto;padding:22px 24px 40px;position:relative;}
.view-root.no-pad{padding:0;}
/* Foto usa lo scrubber custom al posto della scrollbar di sistema: le due, sovrapposte
   sullo stesso bordo destro, si intralciavano a vicenda (drag che non rispondeva bene). */
.view-root.hide-native-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
.view-root.hide-native-scrollbar::-webkit-scrollbar{width:0;height:0;display:none;}
/* Lo scrubber deve restare "fermo" nella sua colonna mentre il contenuto scorre sotto di
   lui. Prima .scrubber era figlio dello stesso #viewRoot che scrollava (era lui il
   contenitore overflow-y:auto) — essendo position:absolute rispetto a quel contenitore,
   scrollava anche lui insieme al resto invece di restare ancorato al bordo destro. Il
   risultato: più si scrollava, più le coordinate dello scrubber "scivolavano" rispetto al
   mouse, finché il drag smetteva di rispondere del tutto oltre un certo punto (esattamente
   il bug segnalato). Fix: su Foto lo scroll si sposta su un contenitore INTERNO
   (#fotoScroll), mentre #viewRoot smette di scrollare e resta solo la cornice non
   scrollabile su cui lo scrubber è ancorato. */
.view-root.has-scrubber{overflow:hidden;padding:0;}
.foto-scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 54px 40px 24px;}
.foto-scroll.hide-native-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
.foto-scroll.hide-native-scrollbar::-webkit-scrollbar{width:0;height:0;display:none;}

/* ===== buttons / chips ===== */
.btn{
  font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--border-strong);
  background:var(--card-bg);color:var(--text);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:var(--chip-bg);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
.btn-danger:hover{background:var(--danger-tint);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--chip-bg);}
.btn-sm{padding:5px 10px;font-size:12px;}
.chip{
  font-size:12.5px;padding:6px 12px;border-radius:20px;background:var(--chip-bg);color:var(--text-secondary);
  cursor:pointer;border:1px solid transparent;white-space:nowrap;
}
.chip:hover{background:var(--chip-bg-hover);}
.chip.active{background:var(--accent-tint);color:var(--accent);border-color:var(--accent);font-weight:600;}
.chip.disabled{opacity:.5;cursor:default;}
.section-title{font-size:15px;font-weight:700;margin:0 0 3px;}
.section-sub{font-size:12.5px;color:var(--text-tertiary);margin:0 0 12px;}

/* ===== photo grid ===== */
.month-block{margin-bottom:26px;}
.month-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.month-title{font-size:16px;font-weight:700;}
.month-count{font-size:12.5px;color:var(--text-tertiary);}
/* Griglia "justified" (come Google Photos/Immich/Flickr): tutte le foto di una riga
   condividono la STESSA ALTEZZA, è la LARGHEZZA a variare col rapporto reale di ciascuna
   — non il contrario. Un mosaico a colonne (larghezza fissa, altezza variabile) rende le
   verticali enormi e le orizzontali minuscole; le righe "giustificate" restano organiche
   perché l'occhio segue l'altezza costante riga per riga. Larghezza/altezza di ogni tile
   sono calcolate in JS (layoutJustifiedGrids) dopo il layout, .photo-grid è solo il
   contenitore flex che le raccoglie in righe.  */
.photo-grid{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.tile{
  position:relative;border-radius:7px;overflow:hidden;cursor:pointer;
  border:1px solid var(--border);
}
.tile-badge{
  position:absolute;top:5px;left:5px;font-size:9.5px;font-weight:700;letter-spacing:.02em;
  background:rgba(10,10,10,.55);color:#fff;padding:2px 6px;border-radius:4px;
  transition:opacity .12s ease;
}
/* stesso angolo del cerchio di selezione: invece di farli convivere (si sovrappongono ed
   è illeggibile), la label RAW/JPEG cede il posto ai comandi rapidi non appena compaiono —
   hover, focus da tastiera, o tile già selezionata (il cerchio pieno resta visibile anche
   senza hover, quindi la label deve restare nascosta anche lì) */
.tile:hover .tile-badge,
.tile:focus-within .tile-badge,
.tile.selected .tile-badge{opacity:0;}
.tile-actions{
  position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2;
}
/* round 5: niente cerchietto, ma l'ombra torna — senza, il cuoricino bianco spariva sulle
   foto chiare. Stesso "peso" visivo del pallino di selezione (22px di area di tocco,
   icona quasi altrettanto grande, non più 12px persa dentro un cerchio). Cambia solo il
   riempimento del cuoricino (contorno -> bianco pieno), non la forma. */
.tile-actions .mini-btn{
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  opacity:0;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.65)) drop-shadow(0 0 3px rgba(0,0,0,.45));
  transition:opacity .12s ease;
}
.tile-actions .mini-btn.on,
.tile:hover .tile-actions .mini-btn,
.tile:focus-within .tile-actions .mini-btn,
.tile-actions .mini-btn:focus-visible{opacity:1;pointer-events:auto;}
.tile-actions .mini-btn.fav-btn svg{width:19px;height:19px;}
.tile-actions .mini-btn.fav-btn.on svg{fill:currentColor;}

/* ===== scrubber ===== */
.scrubber{
  position:absolute;top:0;right:0;bottom:0;width:34px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;padding:8px 0;z-index:5;cursor:ns-resize;user-select:none;
}
/* prima le tick erano impacchettate in alto (nessun justify-content sul contenitore
   flex): 6 mesi finivano tutti nei primi ~100px di una rail alta 600+px, lasciando il
   resto vuoto — "le date non sono ben distanziate". space-between le distribuisce lungo
   tutta l'altezza della rail, dal primo mese in cima all'ultimo in fondo. */
.scrubber-tick{font-size:8.5px;color:var(--text-tertiary);writing-mode:vertical-rl;}
.scrubber-rail{position:absolute;right:6px;top:8px;bottom:8px;width:2px;background:var(--border-strong);border-radius:1px;}
.scrubber-thumb{
  position:absolute;right:2px;width:10px;height:26px;border-radius:5px;background:var(--accent);
}
.scrubber-tooltip{
  position:absolute;right:26px;background:var(--text);color:var(--bg);font-size:11.5px;font-weight:600;
  padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;
}
.scrubber-tooltip.show{opacity:1;}

/* ===== tooltip generico per pulsanti icon-only (barra di selezione ecc.) =====
   stessa resa cromatica dello scrubber-tooltip (testo su sfondo, invertiti
   rispetto al tema) così il linguaggio visivo resta coerente in tutta l'app.
   Disattivato su mobile: niente hover sul touch, l'icona deve bastare da sola. */
[data-tip]{position:relative;}
[data-tip]::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(3px);
  background:var(--text);color:var(--bg);font-size:11px;font-weight:600;
  padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .12s ease,transform .12s ease;z-index:30;
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0);}
#app.device-mobile [data-tip]::after{display:none;}

/* ===== culling ===== */
.culling-wrap{display:flex;flex-direction:column;height:100%;padding:0;}
.culling-top{display:flex;align-items:center;justify-content:center;padding:16px 0 6px;flex:0 0 auto;}
.culling-progress{
  font-size:12.5px;color:var(--text-secondary);background:var(--chip-bg);padding:5px 12px;border-radius:20px;
}
.culling-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 40px;min-height:0;}
.culling-nav-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:var(--card-bg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--text-secondary);
}
.culling-nav-btn:hover{background:var(--chip-bg);color:var(--text);}
.culling-image{
  flex:1;max-width:520px;height:100%;max-height:340px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.culling-image .tile-badge{top:10px;left:10px;font-size:11px;padding:3px 8px;}
.culling-info-btn{
  position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.culling-info-btn:hover{background:rgba(0,0,0,.65);}
.culling-keyhint{position:absolute;bottom:10px;right:10px;font-size:10.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.35);padding:3px 7px;border-radius:5px;}
.culling-filmstrip{display:flex;gap:6px;padding:10px 40px;flex:0 0 auto;overflow-x:auto;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.culling-thumb{width:58px;height:58px;border-radius:6px;flex:0 0 auto;cursor:pointer;border:2px solid transparent;position:relative;}
.culling-thumb.current{border-color:var(--accent);}
.culling-thumb.selected{box-shadow:0 0 0 2px var(--accent);}
.culling-thumb .mini-tag{position:absolute;top:2px;left:2px;font-size:7px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 3px;border-radius:3px;}
.culling-thumb-check{
  position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:4px;
  background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;opacity:0;transition:opacity .12s;
}
.culling-thumb:hover .culling-thumb-check, .culling-thumb-check.checked{opacity:1;}
.culling-thumb-check.checked{background:var(--accent);border-color:var(--accent);}
.culling-bottom{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;flex:0 0 auto;}
.culling-meta{font-size:12.5px;color:var(--text-secondary);}
.culling-meta b{color:var(--text);font-size:13.5px;display:block;font-weight:600;margin-bottom:1px;}
.culling-actions{display:flex;gap:8px;}
.btn-pick{border-color:#2E9E5B;color:#2E9E5B;background:transparent;}
.btn-pick:hover{background:rgba(46,158,91,.1);}
.btn-pick.chosen{background:#2E9E5B;color:#fff;}
/* ===== culling: griglia lotti + selettore lotto + breadcrumb (Gruppo C) ===== */
.culling-root-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);margin-bottom:18px;}
.culling-root-line b{color:var(--text);font-weight:600;}
.culling-root-change{margin-left:8px;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12px;}
.culling-batch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.culling-batch-card{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--card-bg);}
.culling-batch-card:hover{border-color:var(--border-strong);}
.culling-batch-cover{height:110px;}
.culling-batch-body{padding:12px 14px;}
.culling-batch-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.culling-batch-sub{font-size:12px;color:var(--text-tertiary);margin-bottom:8px;}
.culling-batch-counts{display:flex;gap:12px;font-size:11.5px;color:var(--text-secondary);}
.culling-switch-panel{
  position:absolute;top:calc(100% + 6px);left:0;z-index:60;min-width:220px;background:var(--card-bg);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);overflow:hidden;
}
.culling-switch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border);}
.culling-switch-row:last-child{border-bottom:none;}
.culling-switch-row:hover{background:var(--chip-bg);}
.culling-switch-row.current{color:var(--accent);font-weight:600;}
.culling-switch-count{color:var(--text-tertiary);font-weight:400;}
.culling-breadcrumb{display:block;font-size:11.5px;color:var(--text-tertiary);margin-bottom:6px;}
.culling-breadcrumb .crumb-part{cursor:pointer;text-decoration:underline;}
.culling-breadcrumb .crumb-current{color:var(--text-secondary);cursor:default;text-decoration:none;}
/* ===== rinomina con formula: token cliccabili + anteprima + avviso collisioni ===== */
.rename-card{width:440px;}
.rename-token-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.rename-token-btn{
  font-size:11.5px;padding:5px 10px;border-radius:14px;background:var(--chip-bg);color:var(--text-secondary);
  cursor:pointer;border:1px solid transparent;
}
.rename-token-btn:hover{border-color:var(--border-strong);color:var(--text);}
.rename-preview-label{font-size:11.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.rename-preview-list{border:1px solid var(--border);border-radius:9px;overflow:hidden;max-height:150px;overflow-y:auto;}
.rename-preview-row{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--border);}
.rename-preview-row:last-child{border-bottom:none;}
.rename-preview-row .old{color:var(--text-tertiary);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rename-preview-row .new{color:var(--text);font-weight:600;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rename-collision-warning{
  margin-top:10px;padding:9px 11px;border-radius:9px;font-size:12px;line-height:1.4;
  background:rgba(214,80,52,.1);color:var(--danger);border:1px solid rgba(214,80,52,.3);
}
/* ===== albero cartelle finto: usato solo per scegliere la cartella radice di culling ===== */
.folder-tree-crumbs{font-size:12px;color:var(--text-secondary);margin:8px 0 10px;}
.folder-tree-crumbs .folder-tree-crumb{cursor:pointer;}
.folder-tree-crumbs .folder-tree-crumb:hover{text-decoration:underline;color:var(--text);}
.folder-tree-list{border:1px solid var(--border);border-radius:9px;overflow:hidden;max-height:220px;overflow-y:auto;}
.folder-tree-row{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
.folder-tree-row:last-child{border-bottom:none;}
.folder-tree-row:hover{background:var(--chip-bg);}
.folder-tree-row span{flex:1;}

/* ===== lightbox ===== */
.lightbox{
  position:absolute;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;color:#f2f2f2;
}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex:0 0 auto;}
.lb-top-left,.lb-top-right{display:flex;align-items:center;gap:6px;}
.lb-icon-btn{
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#f2f2f2;cursor:pointer;background:transparent;
}
.lb-icon-btn:hover{background:rgba(255,255,255,.12);}
.lb-icon-btn.active{color:var(--accent);}
/* stesso principio del cuoricino nella griglia: forma invariata, solo il riempimento
   cambia quando è preferita — niente più scambio cuore/stella */
.lb-icon-btn.fav.active svg{fill:currentColor;}
/* menu "altre azioni" (⋯): stessa struttura del menu account (.user-menu/-item/-sep),
   solo ancorato in basso a destra invece che in alto a sinistra — il bottone ⋯ che lo
   apre è position:relative apposta per fargli da riferimento */
.lb-more-menu{
  position:absolute;top:calc(100% + 6px);right:0;width:200px;background:var(--card-bg);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  padding:6px;z-index:20;color:var(--text);text-align:left;
}
.lb-filename{font-size:13px;color:#d8d8d8;}
.lb-body{flex:1;display:flex;min-height:0;}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 60px;min-width:0;}
.lb-image{width:100%;height:100%;max-height:100%;border-radius:6px;position:relative;}
/* ===== riquadri volto sovrapposti alla foto (Gruppo B) — coordinate in % così restano
   corrette qualunque sia la dimensione finale renderizzata di .lb-image. Restano invisibili
   per non ingombrare la foto: compaiono solo passando sopra il nome corrispondente nella
   sezione "Persone" del pannello info (vedi wireLbFaceHover in renderLightbox). ===== */
.lb-face-box{position:absolute;border:2px solid rgba(255,255,255,.85);border-radius:4px;cursor:pointer;transition:opacity .12s ease,border-color .12s ease;opacity:0;pointer-events:none;}
.lb-face-box.face-hint-visible{opacity:1;pointer-events:auto;}
.lb-face-box:hover{border-color:var(--accent);}
.lb-face-label{
  position:absolute;left:-2px;bottom:0;transform:translateY(100%);font-size:10px;font-weight:700;
  background:rgba(0,0,0,.65);color:#fff;padding:2px 6px;border-radius:0 0 5px 5px;white-space:nowrap;
  max-width:160px;overflow:hidden;text-overflow:ellipsis;
}
.lb-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
}
.lb-arrow:hover{background:rgba(255,255,255,.18);}
.lb-arrow.left{left:16px;}
.lb-arrow.right{right:16px;}
.lb-info{
  width:296px;flex:0 0 auto;background:#0c0c0c;border-left:1px solid #232323;overflow-y:auto;padding:18px 18px 28px;
}
.lb-info h3{font-size:14.5px;margin:0 0 2px;font-weight:700;}
.lb-info .lb-sub{font-size:12px;color:#8f8f92;margin-bottom:18px;}
.lb-info-section{margin-bottom:18px;}
.lb-info-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7a7a7d;margin-bottom:8px;}
.lb-exif-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;font-size:12.5px;}
.lb-exif-item .k{color:#8f8f92;font-size:10.5px;margin-bottom:1px;}
.lb-exif-item .v{color:#f0f0f0;font-weight:600;}
.lb-map{
  height:100px;border-radius:8px;background:var(--map-bg);position:relative;overflow:hidden;margin-bottom:8px;cursor:pointer;
}
.lb-map-pin{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 3px rgba(242,129,46,.25);}
.lb-place{font-size:12.5px;color:#e2e2e2;}
.lb-place .coords{color:#8f8f92;font-size:11px;}
.lb-place-empty{font-size:12.5px;color:#7a7a7d;font-style:italic;margin-bottom:2px;}
.lb-raw-toggle{display:flex;gap:6px;margin-bottom:14px;}
.lb-raw-chip{font-size:11px;padding:4px 9px;border-radius:6px;background:#1a1a1a;color:#9a9a9e;cursor:pointer;border:1px solid #232323;}
.lb-raw-chip.active{background:var(--accent-tint);color:var(--accent);border-color:var(--accent);}
.lb-album-chips{display:flex;flex-wrap:wrap;gap:6px;}
.lb-album-chip{font-size:11.5px;background:#161616;border:1px solid #232323;color:#d8d8d8;padding:4px 9px;border-radius:14px;}
.lb-actions{display:flex;flex-wrap:wrap;gap:8px;}
.lb-action-btn{
  font-size:12px;color:#e2e2e2;background:#161616;border:1px solid #262626;border-radius:8px;padding:7px 10px;
  cursor:pointer;display:flex;align-items:center;gap:6px;
}
.lb-action-btn:hover{background:#1f1f1f;}
.lb-action-btn.danger{color:var(--danger);}
/* il pannello info del lightbox è sempre scuro, indipendentemente dal tema dell'app
   (come nella maggior parte dei visualizzatori foto) — .field input normalmente segue
   il tema (var(--chip-bg)), quindi qui va sovrascritto con la stessa palette scura fissa
   già usata dal resto del pannello (.lb-action-btn, .lb-album-chip), altrimenti in tema
   chiaro il campo Titolo apparirebbe come un riquadro chiaro fuori posto. */
.lb-info .field input{background:#161616;border-color:#262626;color:#f0f0f0;}
.lb-info .field input::placeholder{color:#7a7a7d;}
.lb-filmstrip{flex:0 0 auto;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-top:1px solid #1c1c1c;}
.lb-filmstrip .fthumb{width:52px;height:52px;border-radius:5px;flex:0 0 auto;cursor:pointer;border:2px solid transparent;opacity:.6;}
.lb-filmstrip .fthumb.current{border-color:var(--accent);opacity:1;}
.lb-filmstrip .fthumb:hover{opacity:1;}

/* ===== cerca ===== */
.cerca-hero{margin-bottom:22px;}
.cerca-input{
  width:100%;font-size:15px;padding:13px 16px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--chip-bg);color:var(--text);margin-bottom:12px;
}
.cerca-input::placeholder{color:var(--text-tertiary);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.folder-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px;}
.folder-card{
  border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;background:var(--card-bg);
}
.folder-card-cover{height:88px;position:relative;}
.folder-card-body{padding:10px 12px;}
.folder-card-title{font-size:13.5px;font-weight:700;}
.folder-card-sub{font-size:11.5px;color:var(--text-tertiary);}
.results-count{font-size:12.5px;color:var(--text-tertiary);margin:2px 0 12px;}

/* ===== mappa ===== */
.mappa-wrap{position:relative;height:100%;background:var(--map-bg);overflow:hidden;}
.map-grid-lines{position:absolute;inset:0;background-image:
  linear-gradient(var(--border) 1px,transparent 1px),
  linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:64px 64px;opacity:.5;}
.map-pin{
  position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--accent);color:var(--accent-text);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid var(--bg);
}
.map-pin:hover{filter:brightness(1.08);}
.map-pin.small{background:var(--card-bg);color:var(--text);border:1px solid var(--border-strong);}
.map-controls{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px;}
.map-ctl-btn{
  width:30px;height:30px;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:7px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);color:var(--text);
}
.map-scale{position:absolute;bottom:14px;left:14px;font-size:11px;color:var(--text-secondary);background:var(--card-bg);
  border:1px solid var(--border-strong);padding:3px 8px;border-radius:5px;}
.map-popover{
  position:absolute;width:190px;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;z-index:6;
}
.map-popover-cover{height:76px;}
.map-popover-body{padding:10px 11px;}
.map-popover-title{font-size:13px;font-weight:700;margin-bottom:1px;}
.map-popover-sub{font-size:11px;color:var(--text-tertiary);margin-bottom:9px;}

/* ===== condivisioni ===== */
.share-section{margin-bottom:26px;}
.share-row{
  display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);
}
.share-row:last-child{border-bottom:none;}
.share-person{display:flex;align-items:center;gap:10px;}
.share-person-name{font-size:13.5px;font-weight:600;}
.share-person-email{font-size:11.5px;color:var(--text-tertiary);}
.role-badge{font-size:11px;color:var(--text-secondary);background:var(--chip-bg);padding:4px 10px;border-radius:14px;}
.link-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);gap:10px;}
.link-row:last-child{border-bottom:none;}
.link-icon{width:30px;height:30px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.link-title{font-size:13px;font-weight:600;}

/* ===== album grid / cestino ===== */
.album-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
.album-card{border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;background:var(--card-bg);}
.album-cover{height:120px;position:relative;}
.album-card-body{padding:11px 12px 13px;}
.album-title{font-size:13.5px;font-weight:700;margin-bottom:1px;}
.album-sub{font-size:11.5px;color:var(--text-tertiary);}
.album-shared-badge{
  position:absolute;top:8px;right:8px;background:rgba(10,10,10,.55);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px;
}
.album-dynamic-badge{
  position:absolute;top:8px;left:8px;background:rgba(10,10,10,.55);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px;
}
.album-dynamic-inline-badge{
  display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-tint);padding:2px 8px;border-radius:10px;vertical-align:middle;margin-left:4px;
}

/* ===== Persone (Gruppo B) ===== */
.person-review-banner{
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-tint);color:var(--accent);
