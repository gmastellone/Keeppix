/* Il toast ha tre nature. Il successo resta neutro e sparisce da solo: è il caso
   normale e non merita né colore né attenzione. L'errore e la riuscita parziale
   portano un filetto colorato, restano a schermo più a lungo (leggere "cosa non ha
   funzionato" richiede più tempo che leggere "fatto") e possono avere un'azione —
   quasi sempre "Riprova". Un toast con azione non sparisce mentre ci si sta
   ragionando sopra: passandoci il mouse il timer si ferma. */
function showToast(msg, opts){
  opts = opts || {};
  const kind = opts.kind || 'ok';          // ok | error | partial
  const appEl = document.getElementById('app');
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='error' ? ' toast-error' : kind==='partial' ? ' toast-partial' : '');
  if(kind!=='ok') t.setAttribute('role','alert');
  const label = document.createElement('span');
  label.textContent = msg;
  t.appendChild(label);
  if(opts.action && opts.action.label){
    const a = document.createElement('span');
    a.className = 'toast-action';
    a.textContent = opts.action.label;
    a.setAttribute('role','button');
    a.tabIndex = 0;
    const run = ()=>{ close(); opts.action.fn && opts.action.fn(); };
    a.onclick = run;
    a.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); run(); } };
    t.appendChild(a);
  }
  appEl.appendChild(t);
  setTimeout(()=>{ t.classList.add('show'); },10);
  let timer = null;
  const close = ()=>{ clearTimeout(timer); t.classList.remove('show'); setTimeout(()=>t.remove(),250); };
  const life = opts.action ? 6500 : (kind==='ok' ? 2400 : 4200);
  const arm = ()=>{ timer = setTimeout(close, life); };
  arm();
  if(opts.action){
    t.onmouseenter = ()=> clearTimeout(timer);
    t.onmouseleave = arm;
  }
  return close;
}
function showErrorToast(msg, retryFn){
  return showToast(msg, {kind:'error', action: retryFn ? {label:'Riprova', fn:retryFn} : null});
}
/* Riuscita parziale: il caso più probabile su un'operazione di massa, e il meno
   rappresentato di solito. Non è un successo (qualcosa non è passato) e non è un
   errore (la maggior parte è passata): dice esattamente quante ne sono rimaste
   indietro e offre di ritentare SOLO quelle. */
function showPartialToast(okCount, failed, retryFn){
  const n = failed.length;
  return showToast(
    `${okCount} su ${okCount+n} completate — ${n} non ${n===1?'è riuscita':'sono riuscite'}.`,
    {kind:'partial', action: retryFn ? {label:`Riprova le ${n} rimaste`, fn:()=>retryFn(failed)} : null}
  );
}

/* Pulsante occupato: mantiene la sua larghezza, si spegne ai click e mostra uno
   spinner accanto all'etichetta. Serve a due cose insieme — dire "sto lavorando" e
   impedire il doppio invio, che su un'azione di massa è il modo più facile per
   duplicare un'operazione. */
function setBtnBusy(btn, on){
  if(!btn) return;
  if(on){
    btn.classList.add('is-busy');
    btn.setAttribute('aria-busy','true');
    if(!btn.querySelector('.spinner')){
      const s = document.createElement('span');
      s.className = 'spinner sm';
      btn.insertBefore(s, btn.firstChild);
    }
  } else {
    btn.classList.remove('is-busy');
    btn.removeAttribute('aria-busy');
    const s = btn.querySelector('.spinner');
    if(s) s.remove();
  }
}

/* Azione su più foto con esito esplicito.
   Su un'operazione di massa il caso più probabile non è "tutto bene" né "tutto male":
   è che una parte passi e una no — un file bloccato, un permesso mancante, un disco
   che non risponde per qualche scatto. Quel caso qui è di prima classe: l'app applica
   ciò che è riuscito, dice quante sono rimaste indietro e offre di ritentare solo
   quelle, invece di far ripartire tutto da capo o di dichiarare un successo che non c'è
   stato. Il secondo tentativo riesce sempre — un errore che si ripete identico
   all'infinito sarebbe un vicolo cieco, non uno stato. */
function runBulkAction(opts){
  const {btn, photos, apply, okMsg, isRetry} = opts;
  setBtnBusy(btn, true);
  const finish = ()=>{
    const wantPartial = state.demo.partial && !isRetry && photos.length > 1;
    if(wantPartial){
      const failCount = Math.max(1, Math.round(photos.length*0.2));
      const ok = photos.slice(0, photos.length-failCount);
      const failed = photos.slice(photos.length-failCount);
      apply(ok);
      renderAll();
      showPartialToast(ok.length, failed, (retryList)=>
        runBulkAction({btn:null, photos:retryList, apply, okMsg, isRetry:true}));
    } else {
      apply(photos);
      renderAll();
      showToast(okMsg(photos.length));
    }
  };
  // con gli interruttori spenti l'azione è immediata, come prima
  if(state.demo.partial || state.demo.slow) setTimeout(finish, 700);
  else finish();
}

/* =========================================================
   CARICAMENTO DI NUOVE FOTO — classificazione e coda

   Cosa entra e cosa no. Le immagini "normali" e i video entrano; i RAW no, mai, e non
   per una limitazione tecnica ma per una decisione di prodotto: i RAW entrano in Keeppix
   dal Culling, dove si scelgono PRIMA di importarli. Rifiutarli qui senza dirlo sarebbe
   inutile — il messaggio indirizza al Culling invece di limitarsi a negare.

   Un fotografo che trascina una cartella ci butta dentro RAW e JPEG insieme: rifiutare
   l'intero rilascio sarebbe ostile. Quindi il gruppo si divide — quello che può entrare
   parte, il resto viene elencato a parte con la sua ragione.
========================================================= */
const UPLOAD_IMAGE_EXT = ['jpg','jpeg','jpe','png','tif','tiff','webp','heic','heif'];
const UPLOAD_VIDEO_EXT = ['mp4','mov','m4v'];
// Estensioni RAW dei principali costruttori, più DNG (che è un contenitore RAW a tutti
// gli effetti e va trattato come tale, non come immagine normale).
const UPLOAD_RAW_EXT = ['arw','sr2','srf','cr2','cr3','crw','nef','nrw','raf','orf','rw2','raw',
  'dng','pef','srw','x3f','3fr','iiq','mos','mef','erf','kdc','dcr','mrw','rwl','fff'];

function uploadExtOf(name){
  const i = String(name||'').lastIndexOf('.');
  return i<0 ? '' : name.slice(i+1).toLowerCase();
}
function uploadKindOf(name){
  const e = uploadExtOf(name);
  if(UPLOAD_RAW_EXT.includes(e)) return 'raw';
  if(UPLOAD_IMAGE_EXT.includes(e)) return 'image';
  if(UPLOAD_VIDEO_EXT.includes(e)) return 'video';
  return 'other';
}
function uploadSizeLabel(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes >= 1024*1024*1024) return (bytes/(1024*1024*1024)).toFixed(1).replace('.',',')+' GB';
  if(bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(1).replace('.',',')+' MB';
  return Math.max(1, Math.round(bytes/1024))+' KB';
}
let _uploadSeq = 0;

/* Punto d'ingresso unico: ci arrivano sia il trascinamento sia il selettore di file.
   La destinazione NON viene chiesta qui: si eredita dal contesto se c'è (sei dentro una
   cartella), altrimenti resta vuota e sarà il pannello a reclamarla. */
function uploadAddFiles(fileList, destHint){
  const files = Array.from(fileList||[]);
  if(!files.length) return;

  const accepted = [], raws = [], others = [];
  files.forEach(f=>{
    const kind = uploadKindOf(f.name);
    if(kind==='raw') raws.push(f.name);
    else if(kind==='other') others.push(f.name);
    else accepted.push({
      id:'up'+(++_uploadSeq),
      name:f.name,
      bytes:f.size||0,
      kind,
      status:'queued',   // queued | uploading | paused | done | skipped | error
      progress:0,
      preparing:false,   // solo video: caricato ma non ancora riproducibile
      reason:''
    });
  });

  state.upload.rejected = (raws.length || others.length) ? {raw:raws, other:others} : null;

  /* Da dove viene la destinazione, in ordine di precedenza:
     1. il contesto esplicito del comando premuto (sei dentro una cartella);
     2. se la coda precedente è finita, il contesto attuale — la destinazione NON resta
        appiccicata a quella di un caricamento concluso mezz'ora fa: sarebbe il modo più
        silenzioso di mandare delle foto nel posto sbagliato;
     3. se una coda è ancora in corso, la sua destinazione resta (è un lotto solo, non si
        ridirigono file già partiti). */
  const queueActive = state.upload.items.some(it=>
    it.status==='queued' || it.status==='uploading' || it.status==='paused');
  if(destHint !== undefined && destHint !== null && destHint !== '') state.upload.dest = destHint;
  else if(!queueActive) state.upload.dest = state.currentFolder || null;

  state.upload.items = state.upload.items.concat(accepted);

  state.upload.open = true;
  state.upload.paused = false;
  renderAll();
  uploadEnsureTicker();

  if(raws.length && !accepted.length){
    showToast(`${raws.length===1?'1 file RAW non caricato':`${raws.length} file RAW non caricati`} — i RAW entrano dal Culling.`, {kind:'error'});
  }
}

/* Avanzamento simulato. Nel prodotto vero questo ritmo lo detta la rete; qui serve solo
   a rendere osservabili i sei stati. Duplicati ed errori sono deterministici (ogni 7ª e
   ogni 11ª voce) invece che casuali: così una revisione ripetuta vede sempre la stessa
   cosa, e il controllo automatico può affermare qualcosa di stabile. */
let _uploadTicker = null;
function uploadEnsureTicker(){
  if(_uploadTicker) return;
  _uploadTicker = setInterval(uploadTick, 90);
}
function uploadStopTicker(){
  if(_uploadTicker){ clearInterval(_uploadTicker); _uploadTicker = null; }
}
function uploadTick(){
  const u = state.upload;
  // Il vincolo vero, reso visibile: senza cartella di destinazione NIENTE parte. Nel
  // codice reale questo è un blocco silenzioso e permanente su "queued"; qui la coda si
  // ferma allo stesso modo, ma il pannello dice perché e come sbloccarla.
  if(!u.dest || u.paused){ return; }

  let cur = u.items.find(it=>it.status==='uploading');
  if(!cur){
    cur = u.items.find(it=>it.status==='queued' || it.status==='paused');
    if(!cur){ uploadStopTicker(); return; }
    cur.status = 'uploading';
  }
  // ~3 passi per file: la barra si vede muovere senza che rivedere la coda diventi
  // un'attesa. Con "Rete lenta" acceso il ritmo rallenta, come per il resto dell'app.
  const step = state.demo.slow ? 7 : 34;
  cur.progress = Math.min(100, cur.progress + step);
  if(cur.progress >= 100){
    const idx = u.items.indexOf(cur);
    if((idx+1) % 7 === 0){
      // stesso hash del contenuto già in libreria: saltato, non fallito
      cur.status = 'skipped';
      cur.reason = 'già in libreria';
    } else if((idx+1) % 11 === 0){
      cur.status = 'error';
      cur.reason = 'il server non ha risposto';
    } else {
      cur.status = 'done';
      // Un video caricato non è ancora guardabile: la resa gira in background o di notte.
      // Lo stato "in preparazione" appartiene alla foto, non alla coda, e resta visibile.
      cur.preparing = (cur.kind === 'video');
    }
  }
  renderUploadDock();
  renderUploadPanel();
}

function uploadCounts(){
  const it = state.upload.items;
  return {
    total: it.length,
    done: it.filter(x=>x.status==='done').length,
    skipped: it.filter(x=>x.status==='skipped').length,
    error: it.filter(x=>x.status==='error').length,
    pending: it.filter(x=>x.status==='queued'||x.status==='uploading'||x.status==='paused').length,
    finished: it.filter(x=>x.status==='done'||x.status==='skipped'||x.status==='error').length
  };
}
function uploadSetDest(folderId){
  state.upload.dest = folderId;
  state.upload.destMenuOpen = false;
  renderAll();
  uploadEnsureTicker();   // scegliere la cartella è ciò che fa partire la coda ferma
}
function uploadTogglePause(){
  state.upload.paused = !state.upload.paused;
  const cur = state.upload.items.find(it=>it.status==='uploading');
  if(state.upload.paused && cur) cur.status = 'paused';
  renderAll();
  if(!state.upload.paused) uploadEnsureTicker();
}
function uploadRetry(id){
  const it = state.upload.items.find(x=>x.id===id);
  if(!it) return;
  it.status='queued'; it.progress=0; it.reason=''; it.retried=true;
  renderAll();
  uploadEnsureTicker();
}
function uploadClearFinished(){
  state.upload.items = state.upload.items.filter(it=>
    it.status!=='done' && it.status!=='skipped' && it.status!=='error');
  state.upload.rejected = null;
  if(!state.upload.items.length) state.upload.open = false;
  renderAll();
}
function uploadCancelAll(){
  uploadStopTicker();
  state.upload.items = [];
  state.upload.rejected = null;
  state.upload.open = false;
  state.upload.paused = false;
  state.upload.dest = null;   // il prossimo caricamento riparte dal contesto, non da qui
  renderAll();
}

  const inp = document.getElementById('uploadInput');

/* Striscia compatta nel piede della sidebar, sopra "Spazio libero": accanto
   all'informazione sulla risorsa che il caricamento consuma. Non compare mai se non c'è
   niente in coda — a riposo il costo in pixel è zero. */
function renderUploadDock(){
  // due ancoraggi possibili: il piede della sidebar da desktop, la fascia sopra la tab bar
  // da mobile. Si riempie solo quello attivo e si svuota sempre l'altro, così cambiando
  // form factor non restano due strisce.
  const deskHost = document.getElementById('uploadDockHost');
  const mobHost = document.getElementById('uploadDockMobileHost');
  const host = state.device==='mobile' ? mobHost : deskHost;
  const other = state.device==='mobile' ? deskHost : mobHost;
  if(other) other.innerHTML = '';
  if(!host) return;
  const u = state.upload;
  if(!u.items.length){ host.innerHTML = ''; return; }
  const c = uploadCounts();
  const needsDest = !u.dest && c.pending>0;
  const pct = c.total ? Math.round((c.finished/c.total)*100) : 0;
  const label = needsDest ? 'Scegli dove'
    : u.paused ? 'In pausa'
    : c.pending ? 'Caricamento'
    : 'Caricate';
  host.innerHTML = `
    <div class="upload-dock ${needsDest?'needs-dest':''}" id="uploadDockBtn" role="button" tabindex="0"
         aria-expanded="${u.open}" aria-label="${label}, ${c.finished} di ${c.total}. Apri il pannello dei caricamenti">
      <div class="upload-dock-top">
        ${needsDest ? ico('alert',13) : u.paused ? ico('pause',13) : c.pending ? '<span class="spinner sm"></span>' : ico('check',13)}
        <span class="upload-dock-label">${label}</span>
        <span class="upload-dock-count">${c.finished}/${c.total}</span>
      </div>
      <div class="upload-dock-bar"><div class="upload-dock-fill" style="width:${pct}%"></div></div>
    </div>`;
  bindActivatable(document.getElementById('uploadDockBtn'), (e)=>{
    if(e && e.stopPropagation) e.stopPropagation();
    state.upload.open = !state.upload.open;
    renderUploadPanel();
    renderUploadDock();
  });
}

function uploadRowHTML(it){
  const kindIco = it.kind==='video' ? 'video' : 'photo';
  let right = '', meta = uploadSizeLabel(it.bytes);
  if(it.status==='uploading'){
    meta += ` · ${it.progress}%`;
  } else if(it.status==='queued'){
    meta += ' · in coda';
  } else if(it.status==='paused'){
    meta += ' · in pausa';
  } else if(it.status==='done'){
    right = it.preparing
      ? `<span class="upload-badge preparing" title="Il video è caricato ma la resa non è ancora pronta">In preparazione</span>`
      : `<span class="upload-badge done">Completato</span>`;
  } else if(it.status==='skipped'){
    // Un duplicato non è un errore: è un esito legittimo, e va visto. Sparire in silenzio
    // è il modo più rapido per far credere all'utente di aver perso delle foto.
    right = `<span class="upload-badge skipped">Saltato</span>`;
  } else if(it.status==='error'){
    right = `<span class="upload-badge error">Errore</span>`;
  }
  const sub = (it.status==='skipped' || it.status==='error') ? `<div class="upload-meta">${it.reason}${
      it.status==='skipped' ? ` · <span class="upload-link" data-upseeexisting="${it.id}" role="button" tabindex="0">Vedi quella presente</span>`
                            : ` · <span class="upload-link" data-upretry="${it.id}" role="button" tabindex="0">Riprova</span>`
    }</div>` : '';
  return `<div class="upload-row" data-uprow="${it.id}">
    <div class="upload-thumb">${icon(kindIco,15)}</div>
    <div class="upload-info">
      <div class="upload-name" title="${it.name}">${it.name}</div>
      <div class="upload-meta">${meta}</div>
      ${it.status==='uploading' ? `<div class="upload-bar"><div class="upload-bar-fill" style="width:${it.progress}%"></div></div>` : ''}
      ${sub}
    </div>
    <div class="upload-row-act">${right}</div>
  </div>`;
}

/* =========================================================
   CARICAMENTO ED ERRORE — macchina a stati
   Nel prototipo i dati sono già tutti in memoria, quindi senza una simulazione questi
   stati non esisterebbero mai e non si potrebbero rivedere. Il pannello "Anteprima
   stati" in fondo a Impostazioni li accende a comando.

   Quando gli interruttori sono spenti (impostazione predefinita) loadStateFor()
   risponde sempre "pronto" e l'app si comporta esattamente come prima: la simulazione
   non lascia residui sul percorso normale.

   Nel prodotto vero questa macchina resta identica — cambia solo chi la fa avanzare:
   la risposta del server invece di un timer.
========================================================= */
const DEMO_LATENCY_MS = 1100;
const _loadState = {};   // chiave dataset -> 'loading' | 'ready' | 'error'
const _loadTimers = {};

function demoLoadingOn(){ return !!(state.demo && (state.demo.slow || state.demo.loadError)); }

/* Ogni vista dichiara la chiave del "dataset" che le serve (es. foto:urbino). È la
   chiave a essere caricata, non la schermata: tornando su una cartella già letta non
   si rivede lo scheletro, esattamente come farebbe una cache vera. */
function loadStateFor(key){
  if(!demoLoadingOn()) return 'ready';
  if(_loadState[key]) return _loadState[key];
  _loadState[key] = 'loading';
  _loadTimers[key] = setTimeout(()=>{
    _loadState[key] = state.demo.loadError ? 'error' : 'ready';
    delete _loadTimers[key];
    renderAll();
  }, DEMO_LATENCY_MS);
  return 'loading';
}
function retryLoad(key){
  clearTimeout(_loadTimers[key]);
  delete _loadTimers[key];
  delete _loadState[key];
  renderAll();
}
function resetLoadStates(){
  Object.keys(_loadTimers).forEach(k=> clearTimeout(_loadTimers[k]));
  Object.keys(_loadTimers).forEach(k=> delete _loadTimers[k]);
  Object.keys(_loadState).forEach(k=> delete _loadState[k]);
}

/* Stato di errore a piena vista. Ha sempre tre parti: cosa non è riuscito, la
   rassicurazione su cosa NON è successo (i file sono intatti) e un'azione per
   riprovare. Mai un vicolo cieco, mai "qualcosa è andato storto". */
function errorStateHTML(title, sub, retryKey, detail){
  return `<div class="error-state" role="alert">
    ${ico('alert',34,'ico')}
    <div class="err-title">${title}</div>
    <div class="err-sub">${sub}</div>
    <div class="err-actions">
      <div class="btn btn-sm" data-retry="${retryKey}" role="button" tabindex="0">${icon('refresh',14)} Riprova</div>
    </div>
    ${detail ? `<div class="err-detail">${detail}</div>` : ''}
  </div>`;
}
/* Errore parziale, in riga: il resto della pagina si è caricato, manca un pezzo. Non
   prende tutta la vista — sarebbe sproporzionato — ma non si lascia nemmeno passare
   sotto silenzio. */
function errorInlineHTML(msg, retryKey){
  return `<div class="error-inline" role="alert">
    ${ico('alert',17,'ico')}
    <div class="err-grow">${msg}</div>
    <div class="btn btn-sm btn-ghost" data-retry="${retryKey}" role="button" tabindex="0">Riprova</div>
  </div>`;
}
function wireErrorRetry(root){
  (root||document).querySelectorAll('[data-retry]').forEach(el=>{
    bindActivatable(el, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); retryLoad(el.dataset.retry); });
  });
}

/* Scheletro di una griglia fotografica: non un rettangolo grigio qualunque, ma la
   stessa impaginazione giustificata del contenuto vero — righe ad altezza comune,
   larghezze diverse. Quando le foto arrivano prendono il posto dello scheletro senza
   che nulla si sposti, ed è per questo che l'attesa non "salta". */
const SKEL_ASPECTS = [1.5,0.67,1.5,1.33,1.5,0.75,1.78,1.5,0.67,1.5,1.33,1.5,1.5,0.75,1.5,1.78,1.33,0.67,1.5,1.5,1.33,1.5,0.75,1.5];
function skelGridHTML(count, rowH){
  rowH = rowH || 150;
  let out = '';
  for(let i=0;i<count;i++){
    const ar = SKEL_ASPECTS[i % SKEL_ASPECTS.length];
    out += `<div class="skel skel-tile" style="height:${rowH}px;flex:${ar} 1 ${Math.round(ar*rowH)}px"></div>`;
  }
  return `<div class="photo-grid" style="display:flex;flex-wrap:wrap;gap:6px" aria-hidden="true">${out}</div>`;
}
/* Scheletro della timeline: due mesi, con l'intestazione anch'essa in scheletro. Due e
   non uno perché il ritmo "titolo, griglia, titolo, griglia" è parte di ciò che si sta
   annunciando. */
function streamSkeletonPlaceholderHTML(approxCount){
  const perMonth = Math.max(8, Math.min(16, Math.round(approxCount/2) || 12));
  const month = ()=>`<div class="month-block">
    <div class="skel-head">
      <div class="skel skel-line" style="width:118px;height:15px"></div>
      <div class="skel skel-line" style="width:56px;height:10px"></div>
    </div>
    ${skelGridHTML(perMonth)}
  </div>`;
  return `<div class="stream-skeleton" role="status" aria-label="Caricamento delle foto in corso">${month()}${month()}</div>`;
}

   DIALOG GENERICO: input di testo (nome gruppo, rinomina...) — stessa struttura di
   openConfirmDialog ma con un campo invece di sì/no.
========================================================= */
function openTextInputDialog(title, sub, placeholder, initialValue, confirmLabel, onConfirm){
  const host = document.getElementById('lightboxRoot').parentElement;
  const trigger = document.activeElement;
  const el = document.createElement('div');
  el.className = 'modal-scrim';
  el.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="textInputTitle">
    <div class="modal-title" id="textInputTitle">${title}</div>
    ${sub?`<div class="modal-sub">${sub}</div>`:''}
    <div class="field" style="margin-bottom:10px">
      <label for="textInputField" class="sr-only">${title}</label>
      <input type="text" id="textInputField" placeholder="${escAttr(placeholder||'')}" value="${escAttr(initialValue||'')}" autocomplete="off">
    </div>
    <div style="display:flex;gap:8px">
      <div class="btn btn-primary" id="textInputOk" role="button" tabindex="0">${confirmLabel}</div>
      <div class="btn btn-ghost" id="textInputCancel" role="button" tabindex="0">Annulla</div>
    </div>
  </div>`;
  host.appendChild(el);
  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
  };
  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };
  document.addEventListener('keydown', escHandler);
  const input = document.getElementById('textInputField');
  function confirmVal(){ const val = input.value.trim(); closeDialog(); onConfirm(val); }
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmVal(); } };
  bindActivatable(document.getElementById('textInputOk'), confirmVal);
  bindActivatable(document.getElementById('textInputCancel'), closeDialog);
  input.focus();
  input.select();
}

/* Griglia foto "justified" (Google Photos/Immich/Flickr DESKTOP): ogni riga ha
   un'ALTEZZA COMUNE, ed è la LARGHEZZA di ogni tile a seguire il suo rapporto reale
   (p.aspect) — non il contrario. Si accumulano tile in una riga finché, all'altezza
   target, non riempiono la larghezza del contenitore; a quel punto la riga viene
   "giustificata" (piccolo scale per farla combaciare esattamente) e si passa alla riga
   successiva. Il risultato resta organico anche con verticali/orizzontali/panoramiche
   mescolate, a differenza di un mosaico a colonne (larghezza fissa) dove le verticali
   diventano enormi. L'altezza target deriva dalla densità scelta in Impostazioni.

   Da mobile NON usiamo questo algoritmo: con solo 2-3 tile a riga la stima dell'altezza
   target ha pochissimi elementi su cui fare la media, quindi basta una foto molto larga
   o molto stretta per far "sforare" la riga e scattare una compressione aggressiva (fino
   al floor di 0.7×) — è il motivo per cui le foto risultavano più piccole del previsto
   proprio da mobile. Non è un caso isolato: è anche per questo che Google Photos, Apple
   Foto e la app mobile di Immich non usano la griglia giustificata sul telefono, a
   differenza delle loro versioni desktop — usano una griglia a colonne di larghezza
   fissa con tile quadrate (leggero crop), semplice e dimensionalmente prevedibile. */
function layoutJustifiedGrids(root){
  const gap = 6;
  const isMobile = state.device==='mobile';
  const cols = (state.gridDensity && state.gridDensity[state.device]) || (isMobile?3:4);

  // Le griglie del flusso virtualizzato (.stream-grid) hanno una geometria già calcolata
  // in anticipo dal piano e posizionano le righe in assoluto: questa funzione non deve
  // toccarle, o disferebbe il lavoro appena fatto.
  const grids = (sel)=> Array.from(root.querySelectorAll(sel)).filter(g=>!g.classList.contains('stream-grid'));

  if(isMobile){
    grids('.photo-grid').forEach(grid=>{
      grid.style.display = 'grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.querySelectorAll('.tile').forEach(t=>{ t.style.width=''; t.style.height=''; t.style.flex=''; });
    });
    return;
  }

  grids('.photo-grid').forEach(grid=>{
    grid.style.display = 'flex';
    grid.style.gridTemplateColumns = '';
    const tiles = Array.from(grid.querySelectorAll('.tile[data-ar]'));
    if(!tiles.length) return;
    const containerWidth = grid.clientWidth;
    if(!containerWidth) return;
    const targetH = Math.max(64, (containerWidth - (cols-1)*gap) / cols / 1.3);
    let row = [], sumAspect = 0;
    const commitRow = (stretch)=>{
      if(!row.length) return;
      const totalGap = (row.length-1)*gap;
      const naturalWidth = sumAspect*targetH;
      let scale = stretch ? (containerWidth-totalGap)/naturalWidth : 1;
      scale = Math.min(Math.max(scale, 0.7), 1.6); // non stiracchiare/rimpicciolire troppo una riga con pochi elementi
      const h = Math.round(targetH*scale);
      row.forEach(t=>{
        const ar = parseFloat(t.dataset.ar)||1;
        t.style.width = Math.round(ar*h)+'px';
        t.style.height = h+'px';
        t.style.flex = '0 0 auto';
      });
      row = []; sumAspect = 0;
    };
    tiles.forEach(t=>{
      const ar = parseFloat(t.dataset.ar)||1;
      row.push(t); sumAspect += ar;
      const widthAtTarget = sumAspect*targetH + (row.length-1)*gap;
      if(widthAtTarget >= containerWidth) commitRow(true);
    });
    commitRow(false); // ultima riga incompleta: altezza target naturale, senza forzarla a riempire
  });
}

  for(let i=1;i<=5;i++){

function attachStarHandlers(root, lookupFn){

    <div class="modal-option danger" data-opt="disk" role="button" tabindex="0"><b>Elimina dal disco adesso</b><span>Azione irreversibile: il file viene cancellato definitivamente.</span></div>
    <div class="btn btn-ghost btn-sm" id="modalCancel" role="button" tabindex="0" style="margin-top:6px">Annulla</div>
  </div>`;
  host.appendChild(el);
  const closeDialog = (result)=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
    onResolve(result);
  };

  document.addEventListener('keydown', escHandler);
  el.querySelectorAll('[data-opt]').forEach(o=>{ bindActivatable(o, ()=>closeDialog(o.dataset.opt)); });
  bindActivatable(document.getElementById('modalCancel'), ()=>closeDialog(null));

/* ===== apertura foto + checkbox di selezione, con hover (desktop), tap prolungato
   (mobile) e tastiera (Invio/Spazio) come punti di ingresso equivalenti ===== */
function wireTileOpen(openEl, id){
  const activate = ()=>{
    if(state.selectionMode){ toggleSelect(id); return; }
    openLightbox(id);
  };
  openEl.onclick = ()=>{
    if(openEl._suppressClick){ openEl._suppressClick = false; return; }
    activate();
  };
  openEl.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); activate(); } };
  if(state.device==='mobile'){
    let timer = null;
    const startPress = ()=>{
      timer = setTimeout(()=>{
        timer = null;
        openEl._suppressClick = true; // il click sintetico dopo il rilascio non deve anche aprire il lightbox
        if(navigator.vibrate) navigator.vibrate(15);
        toggleSelect(id);
      }, 500);
    };
    const cancelPress = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
    openEl.addEventListener('pointerdown', startPress);
    openEl.addEventListener('pointerup', cancelPress);
    openEl.addEventListener('pointerleave', cancelPress);
    openEl.addEventListener('pointercancel', cancelPress);
    openEl.addEventListener('contextmenu', e=>e.preventDefault());
  }
}
function attachTileHandlers(root, photosList){
  root.querySelectorAll('[data-tile]').forEach(tileEl=>{
    const openEl = tileEl.querySelector('.tile-open');
    if(openEl) wireTileOpen(openEl, tileEl.dataset.tile);
  });
  root.querySelectorAll('[data-select]').forEach(chk=>{
    bindActivatable(chk, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); toggleSelect(chk.dataset.select); });
  });
  root.querySelectorAll('[data-fav]').forEach(el=>{
    bindActivatable(el, (e)=>{
      if(e && e.stopPropagation) e.stopPropagation();
      const p = allPhotos().find(x=>x.id===el.dataset.fav);
      p.isFav = !p.isFav;
      renderAll();
    });
  });
}

/* =========================================================
   SELEZIONE MULTIPLA + AZIONI DI MASSA
   Come richiesto: selezione di più foto in Timeline/Preferiti/Cerca/Album,
   con una barra azioni (preferiti, aggiungi ad album, elimina) e una
   pagina dedicata di modifica in blocco, sul modello "bulk edit" di WordPress.
========================================================= */
if(!state.selectionMode) state.selectionMode = false;
if(!state.selectedIds) state.selectedIds = new Set();
function selectedPhotos(){ return allPhotos().filter(p=>state.selectedIds.has(p.id)); }
function announceSelection(){
  const el = document.getElementById('selectionLiveRegion');
  if(!el) return;
  const n = state.selectedIds.size;
  el.textContent = n>0 ? `${n} foto selezionat${n===1?'a':'e'}` : 'Selezione annullata';
}
// entrare/uscire dalla modalità selezione è implicito: si entra selezionando la prima
// foto (hover+click sul checkbox, tap prolungato, o Invio/Spazio da tastiera), si esce
// deselezionando l'ultima o premendo "Annulla" nella barra.
function toggleSelect(id){
  if(state.selectedIds.has(id)){
    state.selectedIds.delete(id);
    if(state.selectedIds.size===0) state.selectionMode = false;
  } else {
    state.selectedIds.add(id);
    state.selectionMode = true;
  }
  renderAll();
  announceSelection();
}
function clearSelection(){ state.selectedIds.clear(); state.selectionMode=false; renderAll(); announceSelection(); }
function selectionBarHTML(){
  const n = state.selectedIds.size;
  return `<div class="selection-bar" role="toolbar" aria-label="Azioni sulla selezione">
    <div class="selection-bar-left">
      <div class="mobile-back" id="selCancelBtn" role="button" tabindex="0" aria-label="Annulla selezione">${icon('close',16)}</div>
      <b>${n} selezionat${n===1?'a':'e'}</b>
      <span class="selection-bar-link" id="selAllBtn" role="button" tabindex="0">Seleziona tutte</span>
    </div>
    <div class="selection-bar-actions">
      <div class="btn btn-sm btn-ghost" id="selFavBtn" role="button" tabindex="0" aria-label="Aggiungi o rimuovi dai preferiti" data-tip="Preferiti">${icon('heart',15)}</div>
      <div class="btn btn-sm btn-ghost" id="selAlbumBtn" role="button" tabindex="0" aria-label="Aggiungi ad album" data-tip="Album">${icon('album',15)}</div>
      <div class="btn btn-sm btn-ghost" id="selShareBtn" role="button" tabindex="0" aria-label="Condividi selezione" data-tip="Condividi">${icon('share',15)}</div>
      <div class="btn btn-sm" id="selEditBtn" role="button" tabindex="0" aria-label="Modifica in blocco" data-tip="Modifica">${icon('edit',14)}</div>
      <div class="btn btn-sm btn-danger" id="selDeleteBtn" role="button" tabindex="0" aria-label="Elimina selezione" data-tip="Elimina">${icon('trash',15)}</div>
    </div>
  </div>`;
}
function attachSelectionBar(list){
  bindActivatable(document.getElementById('selCancelBtn'), ()=> clearSelection());
  bindActivatable(document.getElementById('selAllBtn'), ()=>{
    const allSelected = list.length>0 && list.every(p=>state.selectedIds.has(p.id));
    if(allSelected) list.forEach(p=>state.selectedIds.delete(p.id));
    else list.forEach(p=>state.selectedIds.add(p.id));
    state.selectionMode = state.selectedIds.size>0;
    renderAll();
    announceSelection();
  });
  bindActivatable(document.getElementById('selFavBtn'), ()=>{
    const sel = selectedPhotos();
    if(sel.length===0) return;
    const allFav = sel.every(p=>p.isFav);
    runBulkAction({
      btn: document.getElementById('selFavBtn'),
      photos: sel,
      apply: (list)=> list.forEach(p=>p.isFav = !allFav),
      okMsg: ()=> allFav ? 'Rimossi dai preferiti.' : 'Aggiunti ai preferiti.'
    });
  });
  bindActivatable(document.getElementById('selAlbumBtn'), ()=>{
    const sel = selectedPhotos();
    if(sel.length) openAlbumPickerDialog(sel.map(p=>p.id));
  });
  bindActivatable(document.getElementById('selShareBtn'), ()=>{
    const sel = selectedPhotos();
    if(sel.length) openShareSelectionDialog(sel.map(p=>p.id));
  });
  bindActivatable(document.getElementById('selEditBtn'), ()=>{
    if(state.selectedIds.size===0) return;
    state.bulkEditDraft = {rating:0, pick:'', fav:'', folder:'', title:''};
    state.view='bulkEdit'; renderAll();
  });
  bindActivatable(document.getElementById('selDeleteBtn'), ()=> openBulkDeleteDialog());
}
function openBulkDeleteDialog(){
  const sel = selectedPhotos();
  if(sel.length===0) return;
  openDeleteDialogGeneric(`Eliminare ${sel.length} foto?`, (choice)=>{
    if(choice){
      sel.forEach(p=>{ p.pick='reject'; p.trashChoice=choice; });
      showToast(`${sel.length} foto eliminate.`);
    }
    clearSelection();
  });
}
/* ===== aggiungi/rimuovi da uno o più album (usato da selezione multipla e dal dettaglio foto) ===== */
function openAlbumPickerDialog(photoIds){
  const host = document.getElementById('lightboxRoot').parentElement; // #app
  const trigger = document.activeElement;
  const el = document.createElement('div');
  el.className = 'modal-scrim';
  const manualAlbums = ALBUMS.filter(a=>!a.dynamic);
  const dynamicCount = ALBUMS.length - manualAlbums.length;
  el.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="albumPickerTitle">
    <div class="modal-title" id="albumPickerTitle">Aggiungi ad album</div>
    <div class="modal-sub">${photoIds.length} element${photoIds.length===1?'o':'i'} selezionat${photoIds.length===1?'o':'i'} — attiva/disattiva un album per aggiungere o rimuovere tutti gli elementi</div>
    <div class="album-picker-list">
      ${manualAlbums.map(a=>{
        const allIn = photoIds.every(id=>a.memberIds.has(id));
        return `<div class="album-picker-row" data-pickalbum="${a.id}" role="switch" aria-checked="${allIn}" aria-label="${a.name}" tabindex="0">
          <div class="album-picker-cover" style="background:${a.mono?'linear-gradient(135deg,#a8a8a8,#3a3a3a)':`linear-gradient(135deg,hsl(${a.hue},40%,55%),hsl(${a.hue+18},35%,32%))`}" aria-hidden="true"></div>
          <div class="album-picker-name">${a.name}</div>
          <div class="mini-switch ${allIn?'on':''}" data-albumcheck="${a.id}" aria-hidden="true"><div class="knob"></div></div>
        </div>`;
      }).join('')}
    </div>
    ${dynamicCount>0?`<div class="modal-sub" style="margin-top:8px">${dynamicCount} album dinamic${dynamicCount===1?'o':'i'} non mostrat${dynamicCount===1?'o':'i'} qui: la loro appartenenza è calcolata automaticamente dal filtro, non modificabile a mano.</div>`:''}
    <div class="btn btn-ghost btn-sm" id="albumPickerClose" role="button" tabindex="0" style="margin-top:10px">Fatto</div>
  </div>`;
  host.appendChild(el);
  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();
    renderAll();
  };
  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };
  document.addEventListener('keydown', escHandler);
  el.querySelectorAll('[data-pickalbum]').forEach(row=>{
    bindActivatable(row, ()=>{
      const a = ALBUMS.find(x=>x.id===row.dataset.pickalbum);
      const allIn = photoIds.every(id=>a.memberIds.has(id));
      if(allIn) photoIds.forEach(id=>a.memberIds.delete(id));
      else photoIds.forEach(id=>a.memberIds.add(id));
      a.count = a.memberIds.size;
      const sw = row.querySelector('[data-albumcheck]');
      sw.classList.toggle('on', !allIn);
      row.setAttribute('aria-checked', String(!allIn));
    });
  });
  bindActivatable(document.getElementById('albumPickerClose'), closeDialog);
  const firstRow = el.querySelector('[data-pickalbum]');
  if(firstRow) firstRow.focus();
}
/* ===== condividi una selezione di foto: con persone esistenti, o via nuovo link pubblico

  </div>`;

  const closeDialog = ()=>{
    host.removeChild(el);
    document.removeEventListener('keydown', escHandler);
    if(trigger && trigger.focus) trigger.focus();

  const escHandler = (e)=>{ if(e.key==='Escape') closeDialog(); };

  el.querySelectorAll('[data-pickperson]').forEach(row=>{

      const sw = row.querySelector('[data-personcheck]');
      sw.classList.toggle('on', !isOn);
      row.setAttribute('aria-checked', String(!isOn));
      const u = SHARED_PEOPLE.find(p=>p.email===email);
      showToast(isOn ? `Accesso rimosso a ${u.name}.` : `Condiviso con ${u.name}.`);

    SHARE_LINKS.unshift({title:`${photoIds.length} foto selezionate`, sub:`Selezione manuale · nessuna scadenza · download originale off · ${photoIds.length} elementi`, hue:(hash('sel'+photoIds.join(','))%360)});
    showToast('Link creato e copiato negli appunti.');

    renderAll();
  });
  bindActivatable(document.getElementById('shareSelClose'), closeDialog);
  const firstRow = el.querySelector('[data-pickperson]') || document.getElementById('shareSelCreateLink');

/* =========================================================

========================================================= */
function renderBulkEdit(root){
  const sel = selectedPhotos();
  if(!state.bulkEditDraft) state.bulkEditDraft = {rating:0, pick:'', fav:'', folder:'', title:''};
  if(sel.length===0){
    root.innerHTML = emptyStateHTML('check','Nessuna foto selezionata','Torna alla Timeline, seleziona una o più foto, poi premi "Modifica".');
    return;
  }
  const shown = sel.slice(0,30);
  root.innerHTML = `
    <div class="back-link" id="bulkEditBack">${icon('chevronLeft',15)} Annulla</div>
    <div class="section-title">Modifica multipla</div>
    <div class="section-sub">${sel.length} foto selezionate — ogni campo si applica a tutte, lasciane uno "invariato" per non toccarlo</div>
    <div class="bulk-strip">${shown.map(p=>`<div class="bulk-thumb" style="${tileStyle(p)}"></div>`).join('')}${sel.length>shown.length?`<div class="bulk-thumb-more">+${sel.length-shown.length}</div>`:''}</div>

    <div class="settings-section">
      <div class="settings-section-title" id="bulkRatingLabel">Valutazione</div>
      <div class="settings-section-sub">Imposta lo stesso rating per tutte — 0 stelle = non modificare</div>
      <div class="rating-inline" id="bulkRatingRow" role="radiogroup" aria-labelledby="bulkRatingLabel">${starRowHTML({rating:state.bulkEditDraft.rating}, 20, '__bulk')}</div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title" id="bulkPickLabel">Pick / Scarta</div>
      <div class="settings-section-sub">Segna soltanto — per eliminare davvero le foto usa "Elimina" nella barra di selezione</div>
      <div class="seg-control" id="bulkPickSeg" role="radiogroup" aria-labelledby="bulkPickLabel">
        <div class="seg-option active" data-bulkpick="" role="radio" aria-checked="true" tabindex="0">Non modificare</div>
        <div class="seg-option" data-bulkpick="pick" role="radio" aria-checked="false" tabindex="-1">Pick</div>
        <div class="seg-option" data-bulkpick="reject" role="radio" aria-checked="false" tabindex="-1">Scarta</div>
        <div class="seg-option" data-bulkpick="none" role="radio" aria-checked="false" tabindex="-1">Nessuno</div>

    </div>

    <div class="settings-section">
      <div class="settings-section-title" id="bulkFavLabel">Preferiti</div>
      <div class="seg-control" id="bulkFavSeg" role="radiogroup" aria-labelledby="bulkFavLabel">
        <div class="seg-option active" data-bulkfav="" role="radio" aria-checked="true" tabindex="0">Non modificare</div>
        <div class="seg-option" data-bulkfav="add" role="radio" aria-checked="false" tabindex="-1">Aggiungi</div>
        <div class="seg-option" data-bulkfav="remove" role="radio" aria-checked="false" tabindex="-1">Rimuovi</div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Album</div>
      <div class="settings-section-sub">Aggiungi o rimuovi tutte le foto selezionate da uno o più album</div>
      <div class="btn btn-sm" id="bulkAlbumBtn" role="button" tabindex="0">${icon('album',13)} Scegli album…</div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Tag</div>
      <div class="settings-section-sub">Aggiungi o rimuovi tag da tutte le foto selezionate — un'aggiunta manuale è già una conferma, non passa dalla coda di revisione</div>
      <div class="btn btn-sm" id="bulkTagBtn" role="button" tabindex="0">${icon('tag',13)} Aggiungi tag…</div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Titolo</div>
      <div class="settings-section-sub">Imposta lo stesso titolo per tutte — lascia vuoto per non modificarlo</div>
      <div class="field" style="max-width:320px"><input type="text" id="bulkTitleInput" placeholder="Non modificare" value="${escAttr(state.bulkEditDraft.title)}"></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Rinomina file</div>
      <div class="settings-section-sub">Rinomina tutte le foto selezionate con una formula — data, fotocamera, titolo, numero progressivo…</div>
      <div class="btn btn-sm" id="bulkRenameBtn" role="button" tabindex="0">${icon('edit',13)} Rinomina con formula…</div>

        </select>

  const back = ()=>{ state.view='foto'; renderAll(); };
  bindActivatable(document.getElementById('bulkEditBack'), back);

      state.bulkEditDraft.rating = (state.bulkEditDraft.rating===n) ? 0 : n;
      root.querySelectorAll('#bulkRatingRow [data-star]').forEach(s=>{
        const sn = Number(s.dataset.star);
        // riempimento progressivo (1..n colorate) è solo visuale — per aria-checked,
        // coerente con la semantica di un radiogroup, deve valere solo il valore esatto scelto.
        s.style.color = sn<=state.bulkEditDraft.rating ? 'var(--accent)' : 'var(--text-tertiary)';
        s.setAttribute('aria-checked', String(sn===state.bulkEditDraft.rating));
      });
    };
    star.setAttribute('role','radio');
    star.setAttribute('tabindex','0');
    star.setAttribute('aria-label', `${star.dataset.star} stelle`);
    star.setAttribute('aria-checked', String(Number(star.dataset.star)===state.bulkEditDraft.rating));
    bindActivatable(star, setRating);
  });
  function wireSegGroup(containerId, dataAttr, draftKey){
    root.querySelectorAll(`#${containerId} .seg-option`).forEach(el=>{
      bindActivatable(el, ()=>{
        state.bulkEditDraft[draftKey] = el.dataset[dataAttr];
        root.querySelectorAll(`#${containerId} .seg-option`).forEach(o=>{
          const active = o===el;
          o.classList.toggle('active', active);
          o.setAttribute('aria-checked', String(active));
          o.setAttribute('tabindex', active ? '0' : '-1');
        });
      });
    });
  }
  wireSegGroup('bulkPickSeg', 'bulkpick', 'pick');
  wireSegGroup('bulkFavSeg', 'bulkfav', 'fav');
  document.getElementById('bulkFolderSelect').onchange = (e)=>{ state.bulkEditDraft.folder = e.target.value; };
  bindActivatable(document.getElementById('bulkAlbumBtn'), ()=> openAlbumPickerDialog(sel.map(p=>p.id)));
  bindActivatable(document.getElementById('bulkTagBtn'), ()=> openTagPickerDialog(sel.map(p=>p.id)));
  document.getElementById('bulkTitleInput').oninput = (e)=>{ state.bulkEditDraft.title = e.target.value; };
  bindActivatable(document.getElementById('bulkRenameBtn'), ()=> openRenameDialog({kind:'selection', photos: sel, hasSubfolders:false}));
  bindActivatable(document.getElementById('bulkApplyBtn'), ()=>{
    const d = state.bulkEditDraft;
    const applyTo = (list)=> list.forEach(p=>{
      if(d.rating>0) p.rating = d.rating;
      if(d.pick) p.pick = d.pick;
      if(d.fav==='add') p.isFav = true;
      if(d.fav==='remove') p.isFav = false;
      if(d.folder) p.folderId = d.folder;
      if(d.title.trim()) p.title = d.title.trim();
    });
    runBulkAction({
      btn: document.getElementById('bulkApplyBtn'),
      photos: sel,
      apply: (list)=>{
        applyTo(list);
        // Si esce comunque dalla modifica in blocco, anche con un esito parziale: il
        // "Riprova le N rimaste" del messaggio lavora sulle foto stesse, non sulla
        // selezione, quindi non serve tenerla in vita per poterlo usare.
        clearSelection();
        state.view = 'foto';
      },
      okMsg: (n)=> `Modifiche applicate a ${n} foto.`
    });
  });
}
/* =========================================================
   FLUSSO FOTO VIRTUALIZZATO
   Prima c'era un tetto fisso: ogni mese mostrava al massimo 24 foto, mentre
   l'intestazione dichiarava il totale vero ("375 scatti"). Le altre 351 non
   esistevano — nessun "carica altre", nessuno scorrimento infinito.

   Toglierlo e basta significherebbe però mettere nel DOM tutte le tessere della
   libreria in una volta. Con centinaia di migliaia di scatti non regge, e non regge
   nemmeno il modello mentale: la barra di scorrimento salterebbe a ogni caricamento.

   La soluzione qui è quella dei visualizzatori seri (Google Photos, Immich): la
   GEOMETRIA è calcolata in anticipo per l'intera libreria, il DOM no.

   1. Dai soli rapporti d'aspetto — senza toccare il DOM, senza misurare nulla —
      si calcola dove finirà ogni singola tessera: quali foto stanno su quale riga,
      quanto è alta ogni riga, quanto è alto ogni mese, quanto è alto il tutto.
      È lo stesso algoritmo giustificato di prima, solo eseguito sui dati.
   2. La pagina prende SUBITO la sua altezza definitiva. La barra di scorrimento è
      corretta dal primo istante, lo scrubber dei mesi sa esattamente dove saltare, e
      niente si sposta sotto il dito mentre le foto arrivano.
   3. Solo le righe che ricadono nella finestra visibile (più un margine di sicurezza
      sopra e sotto) esistono davvero come nodi. Scorrendo, le righe che escono vengono
      smontate e quelle che entrano montate.

   Il risultato: il numero di nodi nel DOM dipende dall'altezza della finestra, non da
   quante foto ci sono in libreria. Una libreria da 200.000 scatti costa quanto una da
   200. È questo che rende il tetto di 24 non più necessario invece che semplicemente
   rimosso.
========================================================= */
const GRID_GAP = 6;
const STREAM_OVERSCAN = 1.25; // quanti schermi di margine tenere montati sopra e sotto
const MONTH_HEAD_H = 19 + 10; // .month-head (riga a 16px) + margin-bottom
const MONTH_GAP = 26;         // .month-block margin-bottom

function gridColsFor(){
  return (state.gridDensity && state.gridDensity[state.device]) || (state.device==='mobile' ? 3 : 4);
}

/* Distanza verticale di un elemento dall'inizio del contenuto scorribile: si risale la
   catena degli offsetParent fino al contenitore di scorrimento. Serve perché il flusso
   non è sempre figlio diretto dello scroller (da mobile la toolbar sticky sta in mezzo). */
function offsetWithin(el, scroller){
  let y = 0, n = el, guard = 0;
  while(n && n !== scroller && guard++ < 20){ y += n.offsetTop; n = n.offsetParent; }
  return y;
}

/* Impagina una lista di foto in righe, restituendo per ognuna la posizione verticale e
   la larghezza esatta di ogni tessera. Nessun accesso al DOM: è pura aritmetica sui
   rapporti d'aspetto, quindi si può eseguire su tutta la libreria in un colpo solo. */
function planPhotoRows(list, width){
  const cols = gridColsFor();
  const rows = [];
  if(!list.length || !width) return {rows, height:0};

  if(state.device==='mobile'){
    // Da mobile la griglia è a colonne fisse con tessere quadrate (vedi il commento su
    // layoutJustifiedGrids): la geometria è banale e non dipende dai rapporti d'aspetto.
    const tileW = (width - (cols-1)*GRID_GAP) / cols;
    for(let i=0; i<list.length; i+=cols){
      rows.push({
        top: (rows.length)*(tileW+GRID_GAP),
        h: tileW,
        items: list.slice(i,i+cols).map(p=>({p, w:tileW, h:tileW}))
      });
    }
    return {rows, height: rows.length ? rows[rows.length-1].top + tileW : 0};
  }

  const targetH = Math.max(64, (width - (cols-1)*GRID_GAP) / cols / 1.3);
  let cur = [], sumAspect = 0, top = 0;
  const commit = (stretch)=>{
    if(!cur.length) return;
    const totalGap = (cur.length-1)*GRID_GAP;
    let scale = stretch ? (width-totalGap)/(sumAspect*targetH) : 1;
    scale = Math.min(Math.max(scale, 0.7), 1.6);
    const h = Math.round(targetH*scale);
    rows.push({ top, h, items: cur.map(p=>({p, w: Math.round((parseFloat(p.aspect)||1)*h), h})) });
    top += h + GRID_GAP;
    cur = []; sumAspect = 0;
  };
  list.forEach(p=>{
    const ar = parseFloat(p.aspect)||1;
    cur.push(p); sumAspect += ar;
    if(sumAspect*targetH + (cur.length-1)*GRID_GAP >= width) commit(true);
  });
  commit(false); // ultima riga: altezza naturale, non stirata a riempire
  return {rows, height: top ? top - GRID_GAP : 0};
}

/* Impagina più sezioni (i mesi della timeline, o una sezione sola per le griglie
   piatte) e restituisce il piano completo con l'altezza totale. */
function planStream(sections, width){
  let top = 0;
  const planned = sections.map(sec=>{
    const headH = sec.title ? MONTH_HEAD_H : 0;
    const body = planPhotoRows(sec.photos, width);
    const entry = {...sec, top, headH, rows: body.rows, bodyH: body.height, height: headH + body.height};
    top += entry.height + MONTH_GAP;
    return entry;
  });
  return {sections: planned, height: Math.max(0, top - MONTH_GAP)};
}

/* Monta lo scheletro del flusso: un contenitore per sezione con l'altezza già
   definitiva, e dentro un'area vuota che verrà riempita riga per riga. */
function streamSkeletonHTML(plan){
  return plan.sections.map((sec,i)=>`
    <div class="month-block" data-stream-sec="${i}"${sec.monthIdx!==undefined?` data-month-idx="${sec.monthIdx}"`:''}>
      ${sec.title ? `<div class="month-head"><div class="month-title">${sec.title}</div><div class="month-count">${sec.count} scatti</div></div>` : ''}
      <div class="photo-grid stream-grid" data-stream-body="${i}" style="position:relative;display:block;height:${sec.bodyH}px"></div>
    </div>`).join('');
}

/* Riempie la finestra visibile: monta le righe entrate, smonta quelle uscite.
   Le righe già montate non vengono ricreate — scorrere non ricostruisce nulla. */
function syncStreamWindow(host, plan, scroller, ctx){
  if(!host || !scroller) return;
  const viewTop = scroller.scrollTop;
  const viewH = scroller.clientHeight || 600;
  const margin = viewH * STREAM_OVERSCAN;
  const from = viewTop - margin, to = viewTop + viewH + margin;
  // offset del flusso dentro il contenitore di scorrimento (la toolbar sta sopra).
  // Va risalita la catena degli offsetParent invece di leggere host.offsetTop e basta:
  // da desktop il flusso è figlio diretto del contenitore di scorrimento, da mobile no.
  const hostTop = offsetWithin(host, scroller);

  plan.sections.forEach((sec,si)=>{
    const body = host.querySelector(`[data-stream-body="${si}"]`);
    if(!body) return;
    const secTop = hostTop + sec.top + sec.headH;
    // salta in blocco i mesi interamente fuori finestra: non si scorre riga per riga
    // su un anno di foto per scoprire che non serve nulla
    if(secTop + sec.bodyH < from || secTop > to){
      if(body.childElementCount) body.innerHTML = '';
      return;
    }
    const wanted = new Set();
    sec.rows.forEach((row,ri)=>{
      const rowTop = secTop + row.top;
      if(rowTop + row.h < from || rowTop > to) return;
      wanted.add(ri);
      if(body.querySelector(`[data-stream-row="${ri}"]`)) return;
      const el = document.createElement('div');
      el.className = 'stream-row tile-in';
      el.dataset.streamRow = ri;
      el.style.cssText = `position:absolute;left:0;top:${row.top}px;height:${row.h}px;display:flex;gap:${GRID_GAP}px;`;
      el.innerHTML = row.items.map(it=>tileHTML(it.p)).join('');
      row.items.forEach((it,k)=>{
        const t = el.children[k];
        if(!t) return;
        t.style.width = it.w+'px'; t.style.height = it.h+'px'; t.style.flex = '0 0 auto';
      });
      body.appendChild(el);
      // i gestori vanno agganciati solo alle tessere appena create, non a tutte
      attachTileHandlers(el, ctx.list);
    });
    Array.from(body.children).forEach(el=>{
      if(!wanted.has(Number(el.dataset.streamRow))) el.remove();
    });
  });
}

/* Aggancia il flusso al suo contenitore di scorrimento. Ricalcola il piano quando
   cambia la larghezza (finestra ridimensionata, densità, sidebar) e rimonta la
   finestra visibile a ogni scorrimento, ma passando da requestAnimationFrame: lo
   scorrimento resta fluido perché si lavora al massimo una volta per fotogramma. */
function mountPhotoStream(root, hostSel, scrollerSel, sections, list){
  const host = root.querySelector(hostSel);
  const scroller = document.querySelector(scrollerSel) || root.querySelector(scrollerSel);
  if(!host) return null;
  const width = host.clientWidth || host.getBoundingClientRect().width;
  if(!width) return null;

  let plan = planStream(sections, width);
  host.innerHTML = streamSkeletonHTML(plan);
  const ctx = {list};
  syncStreamWindow(host, plan, scroller, ctx);

  let ticking = false;
  const onScroll = ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{ ticking = false; syncStreamWindow(host, plan, scroller, ctx); });
  };
  // assegnazione diretta invece di addEventListener: ogni render sostituisce il
  // gestore precedente invece di accumularne uno nuovo a ogni passaggio sulla vista
  scroller.addEventListener('scroll', onScroll, {passive:true});
  _streamCleanups.push(()=> scroller.removeEventListener('scroll', onScroll));

  const replan = ()=>{
    const w = host.clientWidth;
    if(!w || w===width) return;
    plan = planStream(sections, w);
    host.innerHTML = streamSkeletonHTML(plan);
    syncStreamWindow(host, plan, scroller, ctx);
  };
  return {host, scroller, getPlan:()=>plan, replan, sync:()=> syncStreamWindow(host, plan, scroller, ctx)};
}

// I gestori di scorrimento dei flussi montati vanno rimossi prima del render successivo,
// altrimenti restano appesi a contenitori non più in pagina.
let _streamCleanups = [];
function teardownStreams(){
  _streamCleanups.forEach(fn=>{ try{ fn(); }catch(e){} });
  _streamCleanups = [];
}

/* monthBlocksHTML() è stata rimossa: era la vecchia impaginazione dei mesi, quella col
   tetto di 24 foto. Da quando la timeline è virtualizzata le sezioni le costruisce
   renderFoto() e le impagina planStream(); la funzione restava orfana con dentro proprio
   il difetto appena tolto, ed era una trappola per chi legge il file. */

/* =========================================================
   VIEW: FOTO (timeline)
========================================================= */
function fotoToolbarExtrasHTML(){
  // fuori dalla selezione multipla, un modo per rinominare l'intera cartella con una
  // formula — stesso pannello degli altri due punti d'ingresso, vedi openRenameDialog.
  return `<div class="btn btn-sm btn-ghost" id="renameFolderBtn" role="button" tabindex="0">${icon('edit',13)} Rinomina cartella…</div>`;
}
// null = "tutte le foto" (nessuna cartella selezionata): combina tutte le cartelle,
// esattamente come allPhotos(); altrimenti resta scoped alla singola cartella.
function currentFotoPhotos(){
  return state.currentFolder ? photosFor(state.currentFolder) : allPhotos();
}
function renderFoto(root){
  const allList = currentFotoPhotos();
  const photosList = applyBrowseFilters(allList);
  const isMobile = state.device==='mobile';
  const toolbarInner = state.selectionMode ? selectionBarHTML()
    : `<div class="grid-toolbar-row">${state.currentFolder ? fotoToolbarExtrasHTML() : '<span></span>'}${gridQuickActionsHTML(allList, photosList)}</div>`;
  // Stato di caricamento / errore: la timeline è la vista più pesante da servire, ed è
  // quella in cui l'attesa si nota di più. Vedi loadStateFor() e i tre stati possibili.
  const load = loadStateFor('foto:'+(state.currentFolder||'tutte'));
  const gridBody = load==='loading' ? streamSkeletonPlaceholderHTML(photosList.length || 24)
    : load==='error' ? errorStateHTML(
        'Non è stato possibile caricare la libreria',
        state.currentFolder
          ? `La cartella "${FOLDERS.find(f=>f.id===state.currentFolder).name}" non ha risposto. Le foto sono al sicuro: è la lettura ad essere fallita, non i file.`
          : 'Il server non ha risposto alla richiesta delle foto. Le foto sono al sicuro: è la lettura ad essere fallita, non i file.',
        'foto:'+(state.currentFolder||'tutte'))
    : photosList.length ? '<div id="fotoStream"></div>'
    : `<div style="padding:6px 2px">${emptyStateHTML('funnel','Nessuna foto corrisponde ai filtri','Prova ad allargare i filtri, o cancellali dal pannello qui sopra.')}</div>`;
  const showScrubber = load==='ready' && photosList.length;
  root.innerHTML = isMobile
    ? `<div class="grid-toolbar">${toolbarInner}</div>
       <div id="fotoScroll" style="position:relative;">
         ${gridBody}
       </div>`
    : `<div id="fotoScroll" class="foto-scroll hide-native-scrollbar">
         <div class="grid-toolbar">${toolbarInner}</div>
         ${gridBody}
       </div>
       ${showScrubber ? '<div class="scrubber" id="scrubber"></div>' : ''}`;
  attachSelectionBar(photosList);
  wireGridQuickActions(root, allList, photosList);
  wireErrorRetry(root);
  const renameFolderBtn = document.getElementById('renameFolderBtn');
  if(renameFolderBtn) bindActivatable(renameFolderBtn, ()=> openRenameDialog({kind:'folder', photos: photosList, label: FOLDERS.find(f=>f.id===state.currentFolder).name, hasSubfolders:false}));
  if(load!=='ready' || !photosList.length) return;

  // Una sezione per mese di calendario, in ordine cronologico. monthIdx (non monthOffset)
  // perché la timeline "Tutte le foto" combina più cartelle e monthOffset è relativo
  // alla singola cartella, quindi non confrontabile.
  const byMonth = {};
  photosList.forEach(p=>{ (byMonth[p.monthIdx] = byMonth[p.monthIdx]||[]).push(p); });
  const sections = Object.keys(byMonth).map(Number)
    .sort((a,b)=>monthDistance(a)-monthDistance(b))
    .map(mi=>({ key:'m'+mi, monthIdx:mi, title:`${MONTHS_FULL[mi]} 2026`, count:byMonth[mi].length, photos:byMonth[mi] }));

  const scrollerSel = isMobile ? '#viewRoot' : '#fotoScroll';
  const stream = mountPhotoStream(root, '#fotoStream', scrollerSel, sections, photosList);
  if(!isMobile && stream) setupScrubber(root, sections);
}
function setupScrubber(root, sections){
  const photosList = sections; // ogni voce ha .monthIdx: l'elenco dei mesi presenti, in ordine
  // #fotoScroll è ora il vero contenitore di scroll (overflow-y:auto) — #viewRoot resta
  // fermo apposta, così .scrubber (ancorato a #viewRoot) non scivola più insieme al
  // contenuto mentre si scrolla. Vedi il commento CSS su .view-root.has-scrubber.
  const scrollEl = document.getElementById('fotoScroll');
  const scroller = scrollEl;
  const rail = document.getElementById('scrubber');
  const offsets = photosList.map(s=>s.monthIdx);
  const labels = offsets.map(mi=>MONTHS[mi]);
  rail.innerHTML = `
    <div class="scrubber-rail"></div>
    ${labels.map(l=>`<div class="scrubber-tick">${l}</div>`).join('')}
    <div class="scrubber-tooltip" id="scrubTooltip"></div>
    <div class="scrubber-thumb" id="scrubThumb" style="top:8px;"></div>`;
  const thumb = document.getElementById('scrubThumb');
  const tooltip = document.getElementById('scrubTooltip');
  let dragging=false;
  function setThumbByRatio(ratio){
    const rect = rail.getBoundingClientRect();
    thumb.style.top = (8 + ratio*(rect.height-16-26)) + 'px';
  }
  function scrollToOffset(mi){
    const block = root.querySelector(`[data-month-idx="${mi}"]`);
    // Con il flusso virtualizzato l'altezza di ogni mese è nota fin dal primo istante,
    // quindi il salto atterra esattamente sul mese giusto anche su un mese ancora da
    // montare — prima, con le foto tagliate a 24, l'offset era quello di un blocco
    // molto più corto del reale e lo scrubber "mentiva".
    if(block){ scroller.scrollTop = offsetWithin(block, scroller) - 4; }
  }
  function handleDrag(clientY){
    const rect = rail.getBoundingClientRect();
    let ratio = (clientY - rect.top - 8) / (rect.height-16);
    ratio = Math.max(0, Math.min(1, ratio));
    const idx = Math.round(ratio*(offsets.length-1));
    setThumbByRatio(ratio);
    tooltip.style.top = (ratio*(rect.height-30)) + 'px';
    tooltip.textContent = MONTHS_FULL[offsets[idx]] + ' 2026';
    tooltip.classList.add('show');
    scrollToOffset(offsets[idx]);
  }
  // tiene il thumb sincronizzato anche quando si scrolla con rotellina/trackpad/tastiera
  // e non solo trascinando lo scrubber — prima restava fermo in alto, sembrava rotto.
  function syncThumbToScroll(){
    if(dragging) return;
    const maxScroll = scroller.scrollHeight - scroller.clientHeight;
    const ratio = maxScroll>0 ? Math.max(0, Math.min(1, scroller.scrollTop/maxScroll)) : 0;
    setThumbByRatio(ratio);
  }
  // assegnazione diretta (non addEventListener) così ogni nuovo render sostituisce i
  // listener precedenti invece di accumularli — evita un leak che rendeva il drag
  // via via meno reattivo dopo diverse interazioni sulla vista Foto.
  rail.onmousedown = e=>{ dragging=true; handleDrag(e.clientY); e.preventDefault(); };
  window.onmousemove = e=>{ if(dragging) handleDrag(e.clientY); };
  window.onmouseup = ()=>{ if(dragging){ dragging=false; tooltip.classList.remove('show'); } };
  scroller.onscroll = syncThumbToScroll;
  syncThumbToScroll();
}

/* =========================================================
   VIEW: PREFERITI
========================================================= */
function renderPreferiti(root){
  const favs = allPhotos().filter(p=>p.isFav);
  if(favs.length===0){
    root.innerHTML = emptyStateHTML('heart','Nessun preferito ancora','Premi il cuore su una foto per ritrovarla qui.');
    return;
  }
  const shown = applyBrowseFilters(favs);
  const toolbarInner = state.selectionMode ? selectionBarHTML()
    : `<div class="grid-toolbar-row"><span></span>${gridQuickActionsHTML(favs, shown)}</div>`;
  root.innerHTML = `<div class="section-title">Preferiti</div><div class="section-sub">${favs.length} foto, da tutte le cartelle</div>
    <div class="grid-toolbar">${toolbarInner}</div>
    ${gridLoadBodyHTML('preferiti', 'i preferiti', shown.length,
        emptyStateHTML('funnel','Nessuna foto corrisponde ai filtri','Prova ad allargare i filtri, o cancellali dal pannello qui sopra.'))}`;
  attachSelectionBar(shown);
  wireGridQuickActions(root, favs, shown);
  wireErrorRetry(root);
  mountFlatStream(root, shown);
}

/* Involucro comune a tutte le viste a griglia piatta: decide fra scheletro, errore e
   contenuto, così la stessa tripletta non va riscritta in ogni vista. Restituisce
   l'ospite vuoto del flusso quando c'è da mostrare contenuto: a riempirlo sarà
   mountFlatStream(), dopo che il markup è in pagina e la larghezza è misurabile. */
function gridLoadBodyHTML(key, label, shownCount, emptyHTML){
  const load = loadStateFor(key);
  if(load==='loading'){
    return `<div role="status" aria-label="Caricamento in corso">${skelGridHTML(Math.max(8, Math.min(18, shownCount||12)))}</div>`;
  }
  if(load==='error'){
    return errorStateHTML(
      `Non è stato possibile caricare ${label}`,
      'Il server non ha risposto. Nessuna foto è andata persa: è la lettura ad essere fallita, non i file sul disco.',
      key);
  }
  return shownCount ? '<div id="fotoStream"></div>' : emptyHTML;
}
/* Griglia piatta: stessa impalcatura virtualizzata della timeline, ma con una sezione
   sola e senza intestazioni di mese. Il contenitore di scorrimento qui è sempre la
   vista stessa, non un contenitore interno come su Foto. */
function mountFlatStream(root, list){
  if(!list || !list.length) return null;
  if(!root.querySelector('#fotoStream')) return null;
  return mountPhotoStream(root, '#fotoStream', '#viewRoot',
    [{key:'all', title:null, count:list.length, photos:list}], list);
}
function emptyStateHTML(ic,title,sub){
  return `<div class="empty-state">${ico(ic,34,'ico')}<div class="msg"><b>${title}</b><br>${sub}</div></div>`;
}

/* =========================================================
   VIEW: CULLING — a lotti (Gruppo C)
   Pagina d'ingresso: griglia dei lotti (batch), non più una coda generica legata
   alla cartella di libreria aperta al momento. Aprendo un lotto si passa allo
   "stage" (identico nello spirito alla vecchia vista a foto singola: stelle,
   filmstrip, tasti freccia), ma "Scelta"/"Scarta" ora spostano fisicamente la
   foto tra le sotto-aree del lotto (root/_presi/_scartati) invece di limitarsi a
   un flag — vedi il commento esteso più sopra, vicino ai dati CULLING_BATCHES.
========================================================= */
function cullingQueue(){
  if(!state.cullingBatchId) return [];
  const all = cullingPhotosFor(state.cullingBatchId);
  if(state.cullingFilter==='todo') return all.filter(p=>p.cullState==='root');
  if(state.cullingFilter==='taken') return all.filter(p=>p.cullState==='taken');
  if(state.cullingFilter==='skipped') return all.filter(p=>p.cullState==='skipped');
  return all;
}
// selezione multipla nel filmino del lotto aperto — un pool a parte (cullingSelectedIds),
// non lo stesso state.selectedIds usato dalla libreria organizzata: sono due contesti
// diversi con azioni diverse (qui Scelta/Scarta/Rinomina, non Preferiti/Album/Condividi).
function cullingClearSelection(){ state.cullingSelectedIds.clear(); state.cullingSelectAnchor=null; }
function cullingSelectedPhotos(){
  if(!state.cullingBatchId) return [];
  return cullingPhotosFor(state.cullingBatchId).filter(p=>state.cullingSelectedIds.has(p.id));
}
function cullingToggleSelect(id){
  if(state.cullingSelectedIds.has(id)) state.cullingSelectedIds.delete(id);
  else state.cullingSelectedIds.add(id);
}
// shift+click / shift+freccia selezionano sempre l'intero intervallo [ancora..indice
// corrente] — non si sommano a una selezione precedente, si sostituiscono ad essa, come
// il comportamento standard di un file manager: muovendo il secondo estremo la selezione
// si allarga o si restringe di conseguenza (serve azzerare e ricalcolare ad ogni mossa,
// altrimenti restringendo resterebbero "appiccicate" le foto già incluse in un giro precedente).
function cullingSelectRange(queue, fromIdx, toIdx){
  state.cullingSelectedIds.clear();
  const a = Math.max(0, Math.min(fromIdx, toIdx));
  const b = Math.min(queue.length-1, Math.max(fromIdx, toIdx));
  for(let i=a;i<=b;i++){ state.cullingSelectedIds.add(queue[i].id); }
}
function cullingSelectionBarHTML(){
  // stessa struttura/dimensioni della barra di selezione della libreria (icone in
  // quadrati 32×32, etichetta al passaggio del mouse via data-tip) — non pulsanti con
  // testo esteso, che in questa barra compatta si sovrapporrebbero (vedi .selection-bar-actions .btn).
  const n = state.cullingSelectedIds.size;
  return `<div class="selection-bar" role="toolbar" aria-label="Azioni sulla selezione del lotto">
    <div class="selection-bar-left">
      <div class="mobile-back" id="cullSelCancelBtn" role="button" tabindex="0" aria-label="Annulla selezione">${icon('close',16)}</div>
      <b>${n} selezionat${n===1?'a':'e'}</b>
      <span class="selection-bar-link" id="cullSelAllBtn" role="button" tabindex="0">Seleziona tutte</span>
    </div>

function renderCullingStage(root, batch){
  const all = cullingPhotosFor(batch.id);
  const counts = cullingBatchCounts(batch.id);
  const queue = cullingQueue();
  const filters = [{id:'all',label:'Tutte'},{id:'todo',label:'Da vedere'},{id:'taken',label:'Presi'},{id:'skipped',label:'Scartati'}];
  const filterChipsHTML = `<div class="culling-filterchips">
    ${filters.map(f=>`<div class="chip ${state.cullingFilter===f.id?'active':''}" data-cullfilter="${f.id}">${f.label}</div>`).join('')}
    <div class="culling-filterchips-right">
      ${state.cullingFilter==='skipped' && counts.skipped>0 ? `<div class="btn btn-sm btn-ghost btn-danger" id="cullEmptySkipped">${icon('trash',12)} Svuota scartati (${counts.skipped})</div>` : ''}

    root.innerHTML = `
      <div class="culling-top" style="flex-direction:column;gap:8px;padding-top:14px">
        ${cullingStageHeaderHTML(batch, counts)}
        ${filterChipsHTML}
      </div>
      <div style="padding:50px 20px">${emptyStateHTML('funnel','Niente da mostrare con questo filtro','Cambia filtro qui sopra, oppure torna a "Tutte".')}</div>`;
    wireCullingHeader();
    const emptyBtn0 = document.getElementById('cullEmptySkipped');
    if(emptyBtn0) wireCullEmptySkipped(emptyBtn0, batch, counts);
    root.querySelectorAll('[data-cullfilter]').forEach(el=>{ el.onclick=()=>{ state.cullingFilter=el.dataset.cullfilter; state.cullingIdx=0; renderAll(); }; });

  const cur = queue[state.cullingIdx];
  root.innerHTML = `
    <div class="culling-wrap">
      <div class="culling-top" style="flex-direction:column;gap:8px;padding-top:14px">
        ${cullingStageHeaderHTML(batch, counts)}
        ${state.cullingSelectedIds.size>0 ? cullingSelectionBarHTML() : filterChipsHTML}

        <div class="culling-nav-btn" id="cullPrev" style="${state.cullingIdx===0?'opacity:.35;pointer-events:none':''}">${icon('chevronLeft',17)}</div>
        <div class="culling-image" style="${tileStyle(cur)}">
          ${cur.isRaw?`<div class="tile-badge">${rawBadgeLabel(cur)}</div>`:''}
          <div class="culling-info-btn" id="cullInfoBtn" role="button" tabindex="0" aria-label="Dettagli foto — EXIF, posizione, rinomina">${icon('info',15)}</div>
          <div class="culling-keyhint">← → naviga · shift+← → seleziona intervallo · 1-5 rating · P scegli · X scarta</div>
        </div>
        <div class="culling-nav-btn" id="cullNext" style="${state.cullingIdx===queue.length-1?'opacity:.35;pointer-events:none':''}">${icon('chevronRight',17)}</div>
      </div>
      <div class="culling-filmstrip">
        ${queue.map((p,i)=>{
          const sel = state.cullingSelectedIds.has(p.id);
          return `<div class="culling-thumb ${i===state.cullingIdx?'current':''} ${sel?'selected':''}" style="${tileStyle(p)}" data-cull-thumb="${i}">
            ${p.isRaw?`<div class="mini-tag">${rawBadgeLabel(p)}</div>`:''}
            <div class="culling-thumb-check ${sel?'checked':''}" data-cull-check="${i}" role="checkbox" tabindex="0" aria-checked="${sel}" aria-label="Seleziona foto ${i+1}">${sel?icon('check',10):''}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="culling-bottom">
        <div class="culling-meta">
          <b>${cur.filename}</b>
          <span class="culling-breadcrumb"><span class="crumb-part" data-crumbback="1">${batch.name}</span> ${icon('chevronRight',10)} <span class="crumb-part crumb-current">${cullStateLabel(cur.cullState)}</span></span>
          <div class="rating-inline">${starRowHTML(cur,15)}</div>

  document.getElementById('cullPrev').onclick = ()=>{ state.cullingIdx=Math.max(0,state.cullingIdx-1); renderAll(); };
  document.getElementById('cullNext').onclick = ()=>{ state.cullingIdx=Math.min(queue.length-1,state.cullingIdx+1); renderAll(); };
  // click su una miniatura: naviga a quella foto; shift+click estende la selezione
  // multipla dall'ancora corrente (o dalla foto aperta, se non c'è ancora un'ancora) —

  root.querySelectorAll('[data-cull-thumb]').forEach(el=>{

        cullingSelectRange(queue, anchor, i);
        state.cullingSelectAnchor = anchor;

      state.cullingIdx = i;
      renderAll();
    };
  });
  root.querySelectorAll('[data-cull-check]').forEach(el=>{
    bindActivatable(el, (e)=>{
      if(e && e.stopPropagation) e.stopPropagation();
      const i = Number(el.dataset.cullCheck);
      if(e && e.shiftKey && state.cullingSelectAnchor!==null){
        cullingSelectRange(queue, state.cullingSelectAnchor, i);
      } else {
        cullingToggleSelect(queue[i].id);
        state.cullingSelectAnchor = i;
      }
      renderAll();
    });
  });
  root.querySelectorAll('[data-cullfilter]').forEach(el=>{ el.onclick=()=>{ state.cullingFilter=el.dataset.cullfilter; state.cullingIdx=0; renderAll(); }; });
  const cullSelectAllBtn = document.getElementById('cullSelectAllBtn');
  // seleziona tutto ciò che è nella coda ATTUALE (queue) — se c'è un filtro attivo

  if(cullSelectAllBtn) bindActivatable(cullSelectAllBtn, (e)=>{
    if(e && e.stopPropagation) e.stopPropagation();

    renderAll();

  document.getElementById('btnPick').onclick = ()=>decideCulling('taken');
  document.getElementById('btnScarta').onclick = ()=>decideCulling('skipped');
  const renameBtn = document.getElementById('btnRenameBatch');
  if(renameBtn) renameBtn.onclick = ()=> openRenameDialog({kind:'folder', photos: cullingPhotosFor(batch.id), label: batch.name, hasSubfolders:true});
  const emptyBtn = document.getElementById('cullEmptySkipped');
  if(emptyBtn) wireCullEmptySkipped(emptyBtn, batch, counts);
  const infoBtn = document.getElementById('cullInfoBtn');
  if(infoBtn) bindActivatable(infoBtn, (e)=>{
    if(e && e.stopPropagation) e.stopPropagation();
    state.lightbox = cur; state.lbInfoOpen = true; state.lbRawMode = cur.isRaw?'raw':'jpg';
    renderAll();
  });
  if(state.cullingSelectedIds.size>0) wireCullingSelectionBar(batch, queue);
  const backCrumb = root.querySelector('[data-crumbback]');
  if(backCrumb) bindActivatable(backCrumb, ()=>{ state.cullingBatchId=null; cullingClearSelection(); renderAll(); });
  attachStarHandlers(root, id=>all.find(p=>p.id===id));
  wireCullingHeader();
}
function wireCullEmptySkipped(btn, batch, counts){
  btn.onclick = ()=>{
    openConfirmDialog(`Svuotare gli scartati di "${batch.name}"?`,
      `${counts.skipped} fot${counts.skipped===1?'a':'e'} verranno eliminate definitivamente da questo lotto. Le foto già prese non sono toccate — è pensato apposta come passaggio prima di sincronizzare il lotto in studio.`,
      'Svuota scartati', ()=>{
        CULLING_PHOTO_CACHE[batch.id] = cullingPhotosFor(batch.id).filter(p=>p.cullState!=='skipped');
        showToast('Foto scartate eliminate dal lotto.');
        state.cullingIdx=0;
        renderAll();
      });
  };
}
function decideCulling(decision){
  const queue = cullingQueue();
  const cur = queue[state.cullingIdx];
  if(!cur) return;
  // click semplice, identico a un'etichetta: ricliccare la stessa decisione la annulla
  // (torna in 'root'), esattamente come già succede oggi con le stelle — mai un dialog.
  cur.cullState = (cur.cullState===decision) ? 'root' : decision;
  renderAll();
}

function openLightbox(id){
  const p = allPhotos().find(x=>x.id===id);
  if(!p) return;
  state.lightbox = p; state.lbInfoOpen = true; state.lbRawMode = p.isRaw?'raw':'jpg';
  renderAll();
}
function closeLightbox(){ state.lightbox=null; renderAll(); }
// dentro un lotto di culling il "filmino vicini" del lightbox è la coda di culling corrente
// (rispetta il filtro attivo), non un mese di una cartella di libreria — la foto potrebbe
// non avere nemmeno un folderId/monthOffset.
function lbNeighborList(){
  if(state.lightbox.batchId) return cullingQueue();
  return photosFor(state.lightbox.folderId).filter(p=>p.monthOffset===state.lightbox.monthOffset);
}
function lbLookup(id){
  const cur = state.lightbox;
  if(cur && cur.batchId) return cullingPhotosFor(cur.batchId).find(x=>x.id===id);
  return allPhotos().find(x=>x.id===id);
}
function lbNav(dir){
  const list = lbNeighborList();
  const idx = list.findIndex(p=>p.id===state.lightbox.id);
  const next = list[idx+dir];
  if(next){ state.lightbox = next; state.lbRawMode = next.isRaw?'raw':'jpg'; renderAll(); }
}
/* ===== hover tra il chip "Persone" del pannello info e il riquadro sulla foto: il riquadro
   resta invisibile finché non si passa sul nome (o lo si mette a fuoco da tastiera), con un
   piccolo margine di tolleranza per poter spostare il puntatore dal chip al riquadro senza
   che sparisca a metà strada. ===== */
function wireLbFaceHover(root, chipEl, faceId){
  const boxEl = root.querySelector(`[data-facebox="${faceId}"]`);
  if(!boxEl) return;
  let hideTimer = null;
  const show = ()=>{ if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; } boxEl.classList.add('face-hint-visible'); };
  const scheduleHide = ()=>{ if(hideTimer) clearTimeout(hideTimer); hideTimer = setTimeout(()=>{ boxEl.classList.remove('face-hint-visible'); hideTimer=null; }, 200); };
  chipEl.addEventListener('mouseenter', show);
  chipEl.addEventListener('mouseleave', scheduleHide);
  chipEl.addEventListener('focus', show);
  chipEl.addEventListener('blur', scheduleHide);
  boxEl.addEventListener('mouseenter', show);
  boxEl.addEventListener('mouseleave', scheduleHide);
}

  if(renameBtn) renameBtn.onclick = ()=> openRenameDialog({kind:'single', photos:[p], hasSubfolders:false});
  const downloadBtn = document.getElementById('lbDownloadBtn');
  if(downloadBtn) downloadBtn.onclick = ()=> lbDownloadOriginal();
  const rotateBtn = document.getElementById('lbRotateBtn');
  if(rotateBtn) rotateBtn.onclick = ()=> lbRotatePhoto();

  root.querySelectorAll('[data-facebox]').forEach(el=>{
