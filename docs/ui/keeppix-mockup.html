.person-group-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;}
.person-group-name{font-size:13.5px;font-weight:700;}
.person-group-count{font-size:11.5px;color:var(--text-tertiary);font-weight:400;margin-left:6px;}
.person-group-actions{display:flex;gap:2px;}
.person-group-empty{font-size:12.5px;color:var(--text-tertiary);padding:14px 2px;}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px;}
.person-card{cursor:pointer;position:relative;text-align:center;}
.person-avatar{
  width:100%;aspect-ratio:1/1;border-radius:50%;position:relative;
  box-shadow:0 0 0 1px var(--border) inset;
}
.person-check{
  position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .12s ease,background .12s ease;
}
.person-check.on{background:var(--accent);border-color:#fff;color:var(--accent-text);}
.person-card:hover .person-check,.person-check.on,.person-check:focus-visible{opacity:1;pointer-events:auto;}
.person-card.selected .person-avatar{box-shadow:0 0 0 3px var(--accent);}
.person-card-body{padding-top:8px;}
.person-name{font-size:12.5px;font-weight:700;}
.person-sub{font-size:11px;color:var(--text-tertiary);margin-top:1px;}
.person-unnamed-hint{color:var(--accent);font-weight:600;}
.person-detail-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.person-detail-avatar{width:78px;height:78px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px var(--border) inset;}
.person-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.cover-pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:280px;overflow-y:auto;margin:4px 0 2px;}
.cover-pick-thumb{aspect-ratio:1/1;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.cover-pick-thumb:hover{border-color:var(--border-strong);}
.cover-pick-thumb.current{border-color:var(--accent);}
/* ===== dialog Separazione (il punto più delicato: dividere un cluster misto) ===== */
.split-card{width:640px;}
#app.device-mobile .split-card{width:94%;}
.split-hint-banner{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);background:var(--accent-tint);
  border-radius:8px;padding:8px 11px;margin-bottom:12px;line-height:1.4;
}
.split-face-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:280px;overflow-y:auto;margin-bottom:10px;}
#app.device-mobile .split-face-grid{grid-template-columns:repeat(4,1fr);}
.split-face-thumb{aspect-ratio:1/1;border-radius:8px;cursor:pointer;position:relative;border:2px solid transparent;}
.split-face-thumb.hinted{box-shadow:0 0 0 2px var(--accent-tint), 0 0 0 3px var(--accent);}
.split-face-thumb.selected{border-color:var(--accent);}
.split-face-check{
  position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:5px;
  background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;color:#fff;
}
.split-face-check.on{background:var(--accent);border-color:var(--accent);}
.split-count-row{font-size:12.5px;color:var(--text-secondary);margin-bottom:4px;}
.split-count-row b{color:var(--text);}
/* proposte volti nella coda di Revisione: 3 azioni invece delle 2 dei tag (conferma /
   non è questa persona / non è un volto), servono miniature un filo più larghe perché
   i tre pulsanti circolari nell'overlay hover non si sovrappongano. */
.suggestion-thumb.triple{width:86px;}
.suggestion-thumb.triple .suggestion-thumb-img{width:86px;height:86px;}
.suggestion-thumb.triple .suggestion-hover{gap:3px;}
.suggestion-thumb.triple .suggestion-hover .mini-btn{width:24px;height:24px;}
.suggestion-hover .mini-btn.notface{background:var(--danger);color:#fff;}

/* ===== creazione album: filtro dinamico (regole in stile "smart album") ===== */
.filter-row{display:flex;align-items:flex-start;gap:8px;padding:10px;background:var(--chip-bg);border-radius:9px;margin-bottom:8px;}
.filter-field-select{font-size:12.5px;padding:7px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--card-bg);color:var(--text);flex:0 0 auto;min-width:150px;}
.filter-editor{flex:1;min-width:0;}
.filter-select{font-size:12.5px;padding:7px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--card-bg);color:var(--text);width:100%;max-width:260px;}
.filter-daterange{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.filter-daterange input{font-size:12.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--border-strong);background:var(--card-bg);color:var(--text);}
/* picklist a tendina (es. Cartella): un campo compatto che apre un pannello con le righe
   selezionabili, invece di un muro di checkbox in linea sempre visibili. */
.picklist{position:relative;max-width:260px;}
.picklist-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;
  padding:7px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--card-bg);
  color:var(--text);cursor:pointer;width:100%;
}
.picklist-trigger .ico{transition:transform .12s ease;flex:0 0 auto;opacity:.7;}
.picklist.open .picklist-trigger .ico{transform:rotate(180deg);}
.picklist-panel{
  position:absolute;top:calc(100% + 4px);left:0;min-width:100%;z-index:6;
  background:var(--card-bg);border:1px solid var(--border-strong);border-radius:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.18);overflow:hidden;
}
.picklist-row{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
.picklist-row:hover{background:var(--chip-bg);}
.picklist-check{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
.picklist-check.on{background:var(--accent);border-color:var(--accent);}
.filter-row-remove{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);flex:0 0 auto;}
.filter-row-remove:hover{background:var(--chip-bg-hover);color:var(--danger);}
.filter-preview{background:var(--accent-tint);color:var(--accent);border-radius:8px;padding:9px 12px;font-size:12.5px;width:fit-content;}
.filter-preview b{font-weight:700;}
/* ===== filtro rapido nelle viste a griglia — un'icona come le altre della toolbar
   (stesso .tag-icon-btn), un pannello a tendina con sezioni a chip. Stesso principio
   visivo del picklist qui sopra: trigger + pannello assoluto ancorato al wrapper. ===== */
.browse-filter{position:relative;flex:0 0 auto;}
.browse-filter-btn{position:relative;}
.browse-filter-btn.active{background:var(--accent-tint);color:var(--accent);}
.browse-filter-count{
  position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-text);
  font-size:9.5px;font-weight:700;border-radius:8px;min-width:14px;height:14px;line-height:14px;
  text-align:center;padding:0 3px;
}
.browse-filter-panel{
  position:absolute;top:calc(100% + 6px);right:0;width:280px;max-width:calc(100vw - 40px);z-index:8;
  background:var(--card-bg);border:1px solid var(--border-strong);border-radius:11px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);overflow:hidden;
}
.browse-filter-head{
  display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
  font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border);
}
.browse-filter-clear{font-size:11.5px;font-weight:600;color:var(--accent);cursor:pointer;}
.browse-filter-clear:hover{text-decoration:underline;}
.browse-filter-body{padding:12px 13px;max-height:min(50vh,420px);overflow-y:auto;}
.browse-filter-section{margin-bottom:14px;}
.browse-filter-section:last-child{margin-bottom:0;}
.browse-filter-section-label{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:7px;}
.browse-filter-section .chip-row{gap:6px;}
.browse-filter-section .chip{padding:5px 10px;font-size:12px;}
/* Tag e Persone sono le uniche due dimensioni che possono davvero crescere tanto (centinaia
   di tag, decine/centinaia di persone) — sopra una soglia (BROWSE_FILTER_SEARCH_THRESHOLD)
   compare una ricerca testuale, e la lista diventa una mini-lista scrollabile invece di
   allungare tutto il pannello all'infinito. Le altre dimensioni restano un semplice elenco. */
.browse-filter-search{
  width:100%;font-size:12px;padding:6px 9px;border-radius:7px;border:1px solid var(--border-strong);
  background:var(--bg);color:var(--text);margin-bottom:7px;
}
.browse-filter-search:focus{outline:none;border-color:var(--accent);}
.browse-filter-section.searchable .chip-row{max-height:132px;overflow-y:auto;padding-right:2px;}
.browse-filter-noresults{font-size:12px;color:var(--text-tertiary);padding:4px 2px;}
.browse-filter-hint{font-size:11.5px;color:var(--text-tertiary);line-height:1.4;}
.browse-filter-foot{padding:9px 13px;font-size:11.5px;color:var(--text-secondary);border-top:1px solid var(--border);background:var(--chip-bg);}
#app.device-mobile .browse-filter-panel{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-width:none;border-radius:14px 14px 0 0;}
/* Scrim dietro il bottom-sheet dei filtri da mobile: senza, il pannello sembrava un
   riquadro "appoggiato" sopra la griglia invece di un vero foglio modale — un tap fuori
   lo chiude già (listener globale su document), lo scrim rende quel comportamento ovvio. */
.browse-filter-scrim{display:none;}
#app.device-mobile .browse-filter-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:7;}
.trash-tile{position:relative;aspect-ratio:1/1;border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.trash-badge{
  position:absolute;bottom:5px;left:5px;right:5px;font-size:9.5px;font-weight:700;text-align:center;
  background:rgba(10,10,10,.6);color:#fff;padding:2px 4px;border-radius:4px;
}
.trash-hover{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:6px;opacity:0;}
.trash-tile:hover .trash-hover{opacity:1;}
.trash-hover .mini-btn{width:26px;height:26px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;}

.back-link{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:14px;}
.back-link:hover{color:var(--text);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;color:var(--text-tertiary);text-align:center;}
.empty-state .ico{margin-bottom:12px;opacity:.5;}
.empty-state .msg{font-size:13.5px;}
svg{display:block;}

/* =========================================================
   STATI DI CARICAMENTO ED ERRORE
   Tre principi, validi in tutta l'app:
   1. Il caricamento non è mai uno spinner al centro del vuoto: è uno scheletro che ha
      già la FORMA del contenuto che sta arrivando. Così il layout non salta quando i
      dati atterrano, e l'occhio sa già dove guardare.
   2. L'errore non è mai un vicolo cieco: ha sempre un'azione per riprovare, e dice cosa
      è fallito, non "qualcosa è andato storto".
   3. Il fallimento parziale (riuscito su 40 foto su 50) è un caso di prima classe, non
      un errore né un successo: ha un suo colore, un suo messaggio e un suo "riprova
      solo quelle non riuscite".
========================================================= */
@keyframes kpxShimmer{0%{background-position:-260px 0;}100%{background-position:260px 0;}}
@keyframes kpxSpin{to{transform:rotate(360deg);}}
@keyframes kpxFadeIn{from{opacity:0;}to{opacity:1;}}

/* Lo scheletro: un blocco neutro con un riflesso che scorre. Non usa --accent apposta —
   il caricamento non deve sembrare un elemento attivo o selezionato. */
.skel{
  background:var(--chip-bg);
  background-image:linear-gradient(90deg, transparent 0%, var(--skel-sheen) 50%, transparent 100%);
  background-size:260px 100%;background-repeat:no-repeat;
  animation:kpxShimmer 1.15s linear infinite;border-radius:6px;
}
.skel-line{height:11px;border-radius:5px;}
.skel-tile{border-radius:var(--tile-radius, 6px);}
/* Le tessere scheletro riusano la stessa geometria giustificata delle tessere vere
   (larghezza dal rapporto d'aspetto, altezza di riga comune): quando le foto arrivano,
   prendono esattamente il posto che lo scheletro occupava, senza scarti di layout. */
.skel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}

/* Comparsa delle tessere che entrano nel viewport durante lo scorrimento. Volutamente
   brevissima: deve smussare il "pop", non farsi notare come animazione. */
.tile-in{animation:kpxFadeIn .18s ease both;}

.spinner{
  width:14px;height:14px;flex:0 0 auto;border-radius:50%;
  border:2px solid var(--border-strong);border-top-color:var(--text-secondary);
  animation:kpxSpin .7s linear infinite;
}
.spinner.sm{width:12px;height:12px;border-width:2px;}

/* Pulsante occupato: resta della sua dimensione (niente salti), perde il testo a favore
   dello spinner solo se è a sola icona, altrimenti affianca. Non cliccabile due volte. */
.btn.is-busy{pointer-events:none;opacity:.75;}
.btn.is-busy .spinner{border-top-color:currentColor;}

/* Barra di avanzamento sottile in cima all'area contenuto, per i caricamenti che
   avvengono mentre qualcosa è già a schermo (cambio filtro, pagina successiva):
   segnala "sto lavorando" senza sostituire ciò che l'utente sta già guardando. */
.load-bar{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;z-index:60;pointer-events:none;}
.load-bar::after{
  content:'';position:absolute;top:0;height:100%;width:40%;background:var(--accent);
  border-radius:2px;animation:kpxIndeterminate 1.1s ease-in-out infinite;
}
@keyframes kpxIndeterminate{0%{left:-40%;}100%{left:100%;}}

/* Stato di errore: stessa impaginazione dello stato vuoto (.empty-state), così i due si
   leggono come parenti, ma con l'icona in colore di pericolo e un'azione obbligatoria. */
.error-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;text-align:center;gap:4px;}
.error-state .ico{color:var(--danger);opacity:.9;margin-bottom:10px;}
.error-state .err-title{font-size:14px;font-weight:700;color:var(--text);}
.error-state .err-sub{font-size:12.5px;color:var(--text-tertiary);max-width:380px;line-height:1.55;margin-bottom:6px;}
.error-state .err-detail{font-size:11.5px;color:var(--text-tertiary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:8px;opacity:.8;}
.error-state .err-actions{display:flex;gap:8px;margin-top:10px;}

/* Errore "in riga": una porzione della pagina non si è caricata ma il resto sì.
   Non prende tutta la vista — segnala solo il pezzo mancante e offre di ritentarlo. */
.error-inline{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--danger-border);background:var(--danger-tint);
  font-size:12.5px;color:var(--text-secondary);margin:8px 0;
}
.error-inline .ico{color:var(--danger);flex:0 0 auto;}
.error-inline .err-grow{flex:1;min-width:0;}

/* Toast: tre nature distinte. Il successo resta neutro (è il caso normale, non merita
   colore); errore e riuscita-parziale hanno un filetto colorato a sinistra e possono
   portare un'azione — è l'unico caso in cui un toast è cliccabile. */
.toast{display:flex;align-items:center;gap:10px;}
.toast.toast-error{border-left:3px solid var(--toast-danger);}
.toast.toast-partial{border-left:3px solid var(--toast-warn);}
.toast-action{
  font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap;
  color:inherit;padding:2px 0;
}
.toast-action:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

/* Piede dello scorrimento infinito: sostituisce il "carica altre" manuale. Ha tre
   configurazioni — sto caricando / non è riuscito, riprova / sei arrivato in fondo. */
.stream-foot{display:flex;align-items:center;justify-content:center;gap:9px;padding:22px 0 30px;font-size:12.5px;color:var(--text-tertiary);}

/* Il pannello di anteprima degli stati è scaffolding del prototipo, non prodotto: si
   distingue visivamente da tutto il resto delle Impostazioni con un bordo tratteggiato
   e un'icona da laboratorio, così non lo si scambia mai per una vera preferenza.
   Nel prodotto finito sparisce con questa regola e il blocco che la usa. */
.demo-section{
  border:1px dashed var(--border-strong);border-radius:12px;
  padding:16px 16px 6px;margin-top:34px;background:var(--chip-bg);
}
.demo-section .settings-section-title{display:flex;align-items:center;gap:7px;}
.demo-section .demo-flag{color:var(--text-tertiary);}
.demo-section .settings-row:last-child{border-bottom:none;}

/* =========================================================
   CARICAMENTO DI NUOVE FOTO
   Principio: Keeppix non chiede mai "dove?" quando la risposta è già sullo schermo.
   Sei dentro una cartella → le foto vanno lì. Sei su "Tutte le foto" → solo allora la
   domanda è legittima, e solo allora viene fatta.

   Nessun pulsante flottante sopra la griglia: in basso a destra passano già lo scrubber
   dei mesi e i toast, e ogni pixel occupato da un comando è una foto che non si vede. Le
   porte d'ingresso sono tre, in ordine di sforzo crescente: trascinare (costo a riposo
   zero), il comando "Carica" nella topbar, il "+" nell'header da mobile.

   La coda vive nel piede della sidebar, sopra "Spazio libero" — cioè accanto
   all'informazione sulla risorsa che un caricamento consuma — e si espande verso l'alto
   senza mai coprire la griglia sulla destra. Da mobile diventa il bottom sheet già usato
   dai filtri.
========================================================= */

/* --- velo di rilascio: compare solo mentre si trascina, dichiara la destinazione --- */
.drop-overlay{
  position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:var(--accent-tint);border:2px dashed var(--accent);border-radius:12px;
  pointer-events:none;animation:kpxFadeIn .12s ease both;
}
.drop-overlay-inner{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px;}
.drop-overlay-inner .ico{color:var(--accent);}
.drop-title{font-size:16px;font-weight:700;color:var(--text);}
.drop-sub{font-size:12.5px;color:var(--text-secondary);max-width:340px;line-height:1.5;}

/* --- striscia compatta nel piede della sidebar --- */
.upload-dock{
  background:var(--chip-bg);border-radius:10px;padding:10px 12px;margin:6px 2px 8px;
  cursor:pointer;position:relative;
}
.upload-dock:hover{background:var(--chip-bg-hover);}
.upload-dock:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.upload-dock-top{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.upload-dock-label{font-size:11.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-dock-count{font-size:11px;color:var(--text-tertiary);}
/* la barra riusa la geometria di .storage-bar: le due stanno una sopra l'altra e devono
   leggersi come la stessa famiglia, non come due indicatori diversi */
.upload-dock-bar{height:5px;border-radius:3px;background:var(--border-strong);overflow:hidden;}
.upload-dock-fill{height:100%;background:var(--accent);width:0;transition:width .25s ease;}
.upload-dock.needs-dest{box-shadow:inset 0 0 0 1.5px var(--accent);}

/* --- pannello espanso: ancorato in basso a sinistra, mai sopra lo scrubber --- */
.upload-panel{
  position:absolute;left:12px;bottom:12px;width:344px;max-height:min(460px, calc(100% - 24px));
  background:var(--card-bg);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:0 18px 44px rgba(0,0,0,.28);z-index:75;display:flex;flex-direction:column;overflow:hidden;
}
.upload-panel-head{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border);flex:0 0 auto;
}
.upload-panel-title{font-size:13px;font-weight:700;flex:1;min-width:0;}
.upload-panel-body{overflow-y:auto;padding:8px 12px 12px;flex:1 1 auto;}
.upload-panel-foot{
  padding:9px 12px;border-top:1px solid var(--border);background:var(--chip-bg);
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-secondary);flex:0 0 auto;
}

/* --- chip della destinazione: precompilato dal contesto, sempre modificabile --- */
.upload-dest{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;
  background:var(--chip-bg);font-size:12px;margin-bottom:10px;cursor:pointer;position:relative;
}
.upload-dest:hover{background:var(--chip-bg-hover);}
.upload-dest:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.upload-dest-label{color:var(--text-tertiary);flex:0 0 auto;}
.upload-dest-value{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* destinazione mancante: è l'unico stato che blocca davvero la coda, e si vede */
.upload-dest.empty{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent);}
.upload-dest.empty .upload-dest-value{color:var(--accent-strong, var(--text));font-style:italic;font-weight:600;}
/* Il chip sta in una fascia che NON scorre, e il menu si apre verso il basso: aprendolo
   verso l'alto finiva fuori dal pannello (che ha overflow:hidden per gli angoli tondi) e
   i click atterravano sulla griglia sotto. */
.upload-panel-dest{padding:10px 12px 0;flex:0 0 auto;position:relative;z-index:5;}
.upload-dest-menu{
  position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card-bg);
  border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.3);
  padding:6px;z-index:20;max-height:230px;overflow-y:auto;
}

/* --- righe della coda --- */
.upload-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);}
.upload-row:last-child{border-bottom:none;}
.upload-thumb{
  width:30px;height:30px;border-radius:6px;background:var(--chip-bg);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);
}
.upload-info{flex:1;min-width:0;}
.upload-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-meta{font-size:11px;color:var(--text-tertiary);margin-top:1px;display:flex;align-items:center;gap:5px;}
.upload-bar{height:3px;border-radius:2px;background:var(--border-strong);overflow:hidden;margin-top:4px;}
.upload-bar-fill{height:100%;background:var(--accent);width:0;transition:width .2s linear;}
.upload-row-act{flex:0 0 auto;display:flex;align-items:center;gap:4px;}

/* Gli esiti hanno tre nature distinte e tre colori, come altrove nell'app: completato è
   neutro (è la norma), saltato è ambra (non è un errore: il file c'era già), errore è
   rosso. Il duplicato NON viene nascosto — sparire in silenzio è il modo più veloce per
   far credere all'utente di aver perso delle foto. */
.upload-badge{
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;flex:0 0 auto;
  text-transform:uppercase;letter-spacing:.02em;
}
.upload-badge.done{background:var(--chip-bg);color:var(--text-secondary);}
.upload-badge.skipped{background:var(--warn-tint);color:var(--warn);}
.upload-badge.error{background:var(--danger-tint);color:var(--danger);}
.upload-badge.preparing{background:var(--accent-tint);color:var(--text-secondary);}
.upload-link{font-size:11px;font-weight:600;text-decoration:underline;cursor:pointer;color:var(--text-secondary);}
.upload-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

/* --- gruppo dei file rifiutati: informa e insegna, non si limita a dire di no --- */
.upload-rejected{
  border:1px solid var(--warn-border);background:var(--warn-tint);border-radius:10px;
  padding:10px 11px;margin-bottom:10px;font-size:11.5px;color:var(--text-secondary);line-height:1.5;
}
.upload-rejected-title{font-weight:700;color:var(--text);font-size:12px;margin-bottom:3px;}
.upload-rejected-files{font-size:11px;color:var(--text-tertiary);margin-top:5px;word-break:break-all;}
.upload-rejected-act{margin-top:8px;}

/* Da mobile il pannello diventa il bottom sheet già usato dai filtri. position:absolute e
   non fixed: #app è il contenitore posizionato del guscio mobile, mentre fixed sfuggirebbe
   alla finestra del telefono e si stenderebbe su tutta la pagina. */
#app.device-mobile .upload-panel{
  position:absolute;left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;max-height:72%;
}
.upload-scrim{display:none;}
#app.device-mobile .upload-scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:74;}

/* Senza sidebar la striscia non ha dove stare: da mobile si appoggia sopra la tab bar,
   che è il bordo persistente equivalente. Stessa informazione, stesso comportamento al
   tocco, solo un altro ancoraggio. */
.upload-dock-mobile{display:none;}
#app.device-mobile .upload-dock-mobile{
  display:block;flex:0 0 auto;padding:0 12px 8px;background:var(--bg);
  border-top:1px solid var(--border);padding-top:8px;
}
#app.device-mobile .upload-dock-mobile .upload-dock{margin:0;}

@media (prefers-reduced-motion: reduce){
  .drop-overlay{animation:none;}
  .upload-dock-fill,.upload-bar-fill{transition:none;}
  .skel{animation:none;}
  .tile-in{animation:none;}
  .load-bar::after{animation:none;width:100%;opacity:.5;}
  .spinner{animation-duration:2.4s;}
}

/* ===== modal (delete dialog) ===== */
.modal-scrim{position:absolute;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:center;justify-content:center;}
.modal-card{width:360px;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.modal-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text-tertiary);margin-bottom:14px;line-height:1.5;}
.modal-option{border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:12.5px;color:var(--text-secondary);}
.modal-option b{display:block;font-size:13px;color:var(--text);margin-bottom:2px;}
.modal-option:hover{background:var(--chip-bg);}
.modal-option.danger b{color:var(--danger);}
.modal-option.danger:hover{background:var(--danger-tint);}

/* ===== culling extras ===== */
.culling-counters{display:flex;gap:14px;font-size:12.5px;color:var(--text-secondary);align-items:center;}
.culling-counters b{color:var(--text);}
.culling-selector{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;padding:5px 10px;border-radius:8px;background:var(--chip-bg);}
.culling-filterchips{display:flex;align-items:center;gap:6px;margin-top:8px;}
.culling-filterchips-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.rating-inline{display:flex;align-items:center;gap:10px;margin-top:6px;}

/* ===== accessibilità: solo per screen reader / stati di focus ===== */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.tile-open:focus-visible,
[role="checkbox"]:focus-visible,
[role="button"]:focus-visible,
.chip:focus-visible,
.nav-item:focus-visible,
.folder-item:focus-visible,
.mobile-tab:focus-visible,
.mini-switch:focus-visible,
.seg-option:focus-visible,
.modal-option:focus-visible,
.album-picker-row:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2.5px solid var(--accent);outline-offset:2px;
}

/* ===== selezione multipla + azioni di massa =====
   Attivazione: hover + click sul checkbox in alto a sx su desktop (niente pulsante
   dedicato, come Google Photos/Immich), tap prolungato su mobile, focus da tastiera
   + Invio/Spazio su entrambi — il checkbox diventa visibile anche solo mettendoci
   il focus, così chi naviga da tastiera può scoprirlo e usarlo. */
.grid-toolbar:empty{margin-bottom:0;}
.grid-toolbar{margin-bottom:14px;}
.grid-toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.grid-toolbar-right{display:flex;align-items:center;gap:6px;}
.selection-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--chip-bg);border-radius:10px;padding:8px 12px;
}
.selection-bar-left{display:flex;align-items:center;gap:12px;font-size:13px;}
.selection-bar-left b{font-size:13.5px;}
.selection-bar-link{color:var(--accent);cursor:pointer;font-weight:600;font-size:12.5px;}
.selection-bar-actions{display:flex;gap:6px;flex-wrap:wrap;}
/* pulsanti icon-only (niente più label testuale accanto): quadrati e compatti,
   il significato lo porta il tooltip (desktop, vedi [data-tip]) + aria-label (sempre) */
.selection-bar-actions .btn{width:32px;height:32px;padding:0;justify-content:center;gap:0;}
.tile-open{position:absolute;inset:0;z-index:1;cursor:pointer;}
.tile-check{
  position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
  color:#fff;z-index:2;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .12s ease,background .12s ease,border-color .12s ease;
}
/* selezionato: pallino pieno colore accento con segno di spunta, invece del cerchio
   traslucido generico — deve leggersi a colpo d'occhio anche in una griglia fitta */
.tile-check.on{background:var(--accent);border-color:#fff;color:var(--accent-text);}
/* pointer-events:auto solo quando è visibile, così l'angolo in alto a sx non "ruba"
   click al resto della foto quando il checkbox non è mostrato (fuori hover/focus/selezione) */
.tile-check.on,
.tile:hover .tile-check,
.tile-check:focus-visible,
#app.selection-active .tile-check{opacity:1;pointer-events:auto;}
.tile.selected{outline:2.5px solid var(--accent);outline-offset:-2.5px;}
.bulk-strip{display:flex;gap:5px;overflow-x:auto;padding:2px 0 16px;}
.bulk-thumb{width:52px;height:52px;border-radius:6px;flex:0 0 auto;}
.bulk-thumb-more{width:52px;height:52px;border-radius:6px;flex:0 0 auto;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-secondary);}
/* ===== pagina Duplicati: dentro ogni gruppo, quale copia tenere ===== */
.dup-thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;cursor:pointer;width:70px;}
.dup-thumb-wrap .bulk-thumb{position:relative;width:70px;height:70px;opacity:.55;outline:2px solid transparent;transition:opacity .12s ease,outline-color .12s ease;}
.dup-thumb-wrap:hover .bulk-thumb{opacity:.8;}
.dup-thumb-wrap.keep .bulk-thumb{opacity:1;outline-color:var(--accent);}
.dup-thumb-wrap:focus-visible .bulk-thumb{outline-color:var(--accent);}
.dup-keep-badge{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;}
.dup-thumb-label{font-size:10px;line-height:1.3;text-align:center;color:var(--text-tertiary);word-break:break-all;}
.dup-thumb-wrap.keep .dup-thumb-label{color:var(--accent);font-weight:600;}
.album-picker-list{max-height:260px;overflow-y:auto;margin:4px 0 2px;}
.album-picker-row{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;border-radius:8px;}
.album-picker-row:hover{background:var(--chip-bg);}
.album-picker-cover{width:36px;height:36px;border-radius:7px;flex:0 0 auto;}
.album-picker-name{flex:1;font-size:13px;font-weight:600;}
/* ===== ricerca regioni mappa (al posto delle chip — ingestibili su scala mondiale) ===== */
.region-search-box{margin-top:10px;}
.region-search-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.region-search-box input{
  flex:1;min-width:0;font-size:13px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--chip-bg);color:var(--text);
}
.region-search-results{border:1px solid var(--border);border-radius:9px;overflow:hidden;max-height:220px;overflow-y:auto;}
.region-search-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
.region-search-row:last-child{border-bottom:none;}
.region-search-row:hover{background:var(--chip-bg);}
.region-search-size{color:var(--text-tertiary);font-size:12px;}
.region-search-empty{padding:12px;font-size:12.5px;color:var(--text-tertiary);}

/* ===== tag / categorie ===== */
.tag-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.tag-cat-block{margin-bottom:22px;}
.tag-cat-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px;}
.tag-cat-name{font-size:13.5px;font-weight:700;}
.tag-cat-count{font-size:11.5px;color:var(--text-tertiary);font-weight:400;margin-left:6px;}
.tag-cat-actions{display:flex;gap:2px;}
.tag-icon-btn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);flex:0 0 auto;}
.tag-icon-btn:hover{background:var(--chip-bg);color:var(--text);}
.tag-icon-btn.danger:hover{background:var(--danger-tint);color:var(--danger);}
.tag-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.tag-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--border);cursor:pointer;}
.tag-row:last-child{border-bottom:none;}
.tag-row:hover{background:var(--chip-bg);}
.tag-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.tag-row-main{flex:1;min-width:0;}
.tag-row-name{font-size:13.5px;font-weight:600;}
.tag-row-prompt{font-size:11.5px;color:var(--text-tertiary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tag-row-meta{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.tag-row-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.tag-threshold-badge{font-size:10.5px;font-weight:700;color:var(--text-secondary);background:var(--chip-bg);padding:2px 7px;border-radius:9px;white-space:nowrap;}
.tag-row-actions{display:flex;gap:2px;flex:0 0 auto;}
.tag-empty-cat{padding:12px 13px;font-size:12px;color:var(--text-tertiary);}
.tag-swatches{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px;}
.tag-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;}
.tag-swatch.active{border-color:var(--text);}
.tag-field-hint{font-size:11.5px;color:var(--text-tertiary);line-height:1.5;margin:-8px 0 12px;}
.tag-threshold-row{margin-bottom:6px;}
.tag-threshold-value{font-size:12.5px;font-weight:700;color:var(--accent);}
.tag-threshold-note{font-size:11.5px;color:var(--text-tertiary);line-height:1.5;margin-top:6px;}

/* ===== coda di revisione ===== */
.review-group{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px;}
.review-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.review-group-title{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;}
.review-group-sub{font-size:12px;color:var(--text-tertiary);font-weight:400;margin-left:2px;}
.review-group-actions{display:flex;gap:6px;}
.suggestion-strip{display:flex;flex-wrap:wrap;gap:8px;}
.suggestion-thumb{position:relative;width:74px;flex:0 0 auto;}
.suggestion-thumb-img{width:74px;height:74px;border-radius:8px;border:1.5px dashed var(--accent);opacity:.92;}
.suggestion-ai-badge{position:absolute;top:4px;left:4px;font-size:8.5px;font-weight:700;letter-spacing:.02em;background:var(--accent-tint-strong);color:var(--accent);padding:1px 5px;border-radius:4px;}
.suggestion-hover{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .12s ease;}
.suggestion-thumb:hover .suggestion-hover,.suggestion-thumb:focus-within .suggestion-hover{opacity:1;}
.suggestion-hover .mini-btn{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#111;}
.suggestion-hover .mini-btn.reject{color:var(--danger);}

/* ===== barra di ricerca composta (tag + filtri strutturati + testo libero) =====
   Un solo campo che si legge come una frase: pillole rimovibili per ciò che è già
   stato reso "strutturato" (tag/anno/fotocamera/cartella/ISO/GPS), più testo libero
   per il resto — invece di un pannello con tanti filtri separati stile database. */
.search-composer{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid var(--border-strong);background:var(--chip-bg);border-radius:10px;padding:9px 10px;margin-bottom:10px;}
.search-composer-icon{display:flex;color:var(--text-tertiary);flex:0 0 auto;}
.search-pills{display:contents;}
.search-pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-tint);color:var(--accent);border-radius:14px;padding:5px 6px 5px 10px;font-size:12px;font-weight:600;white-space:nowrap;}
.search-pill-x{display:flex;opacity:.65;cursor:pointer;border-radius:50%;padding:2px;}
.search-pill-x:hover{opacity:1;background:rgba(0,0,0,.08);}
.search-composer-input{border:none;background:transparent;outline:none;font-size:14px;color:var(--text);flex:1;min-width:160px;padding:5px 2px;}
.search-composer-input::placeholder{color:var(--text-tertiary);}
.search-composer-clear{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:var(--text-tertiary);cursor:pointer;flex:0 0 auto;}
.search-composer-clear:hover{background:var(--chip-bg-hover);color:var(--text);}
.search-suggest-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.18);z-index:15;max-height:320px;overflow-y:auto;padding:6px;}
.search-suggest-group{padding:4px 4px 2px;}
.search-suggest-group-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);padding:5px 6px 3px;}
.search-suggest-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;}
.search-suggest-row:hover{background:var(--chip-bg);}
.search-suggest-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.search-suggest-free{padding:9px 8px 6px;font-size:12px;color:var(--text-tertiary);border-top:1px solid var(--border);margin-top:4px;}
.search-suggest-free b{color:var(--text-secondary);font-weight:600;}
.search-suggest-empty{padding:14px 8px;font-size:12.5px;color:var(--text-tertiary);text-align:center;}

/* ===== analisi libreria ===== */
.analysis-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.analysis-status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.analysis-status-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;}
.analysis-status-badge.running{background:var(--accent-tint);color:var(--accent);}
.analysis-status-badge.paused{background:var(--chip-bg);color:var(--text-secondary);}
.analysis-status-note{font-size:12px;color:var(--text-tertiary);}
.analysis-pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:analysisPulse 1.4s ease-in-out infinite;}
@keyframes analysisPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.analysis-progress-bar{height:8px;border-radius:5px;background:var(--border-strong);overflow:hidden;}
.analysis-progress-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .3s ease;}
.analysis-progress-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-secondary);margin-top:8px;flex-wrap:wrap;}
.analysis-progress-meta b{color:var(--text);}

/* ===== tag nel dettaglio foto (lightbox) ===== */
.lb-tag-cat-group{margin-bottom:10px;}
.lb-tag-cat-group:last-of-type{margin-bottom:0;}
.lb-tag-cat-name{font-size:10px;color:#6b6b6e;margin-bottom:6px;}
.lb-tag-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:#161616;border:1px solid #232323;color:#d8d8d8;padding:4px 9px 4px 7px;border-radius:14px;}
.lb-tag-chip.ai-applied{opacity:.72;}
.lb-tag-chip .lb-tag-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.lb-tag-chip .lb-tag-ai-mark{font-size:9px;font-weight:700;opacity:.8;}
.lb-tag-chip .lb-tag-x{display:flex;opacity:.6;cursor:pointer;}
.lb-tag-chip .lb-tag-x:hover{opacity:1;}
.lb-suggested-tag-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:#161616;border:1px dashed #3a3a3a;color:#b8b8bc;padding:4px 6px 4px 9px;border-radius:14px;}
.lb-suggested-tag-actions{display:flex;gap:3px;}
.lb-suggested-tag-actions span{display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#232323;cursor:pointer;}
.lb-suggested-tag-actions span:hover{background:#2c2c2c;}
.lb-suggested-tag-actions span.reject{color:#ff8a80;}
.lb-suggested-tag-actions span.confirm{color:#6fd08a;}

/* ===== impostazioni: intelligenza artificiale ===== */
.ai-tier-note{font-size:12.5px;color:var(--text-secondary);background:var(--chip-bg);border-radius:9px;padding:10px 12px;margin:10px 0 4px;line-height:1.5;}

/* =========================================================
   MOBILE (WAP-style responsive shell)
   Nota: la simulazione qui è un "form-factor switch" dentro il mockup
   (frame che cambia dimensione), non un vero @media query — coerente
   col resto di questo mockup, che è una demo a finestra fissa.
========================================================= */
.device-switch-bar{display:flex;justify-content:center;margin:0 0 14px;}

.mobile-header{display:none;}
.mobile-tabbar{display:none;}

.frame-outer.device-mobile{
  width:390px;margin:0 auto;border-radius:36px;border:7px solid #1c1c1c;
  box-shadow:0 1px 3px rgba(0,0,0,.1), 0 24px 48px rgba(0,0,0,.24);
}
.frame-outer.device-mobile .frame-bar{display:none;}
.frame-outer.device-mobile #app{height:812px;}

#app.device-mobile{overflow:hidden;}
#app.device-mobile .sidebar{display:none;}
#app.device-mobile .main{width:100%;}
#app.device-mobile .topbar{display:none;}
#app.device-mobile .mobile-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:52px;flex:0 0 auto;padding:0 14px;border-bottom:1px solid var(--border);
}
.mobile-header-left{display:flex;align-items:center;gap:8px;min-width:0;}
.mobile-header-title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mobile-back{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);flex:0 0 auto;}
.mobile-back:hover{background:var(--chip-bg);}
.mobile-header-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;position:relative;}
.mobile-icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);position:relative;}
.mobile-icon-btn:hover{background:var(--chip-bg);}
.mobile-account-btn{cursor:pointer;display:flex;}
.user-menu.mobile-account-menu{position:absolute;top:calc(100% + 8px);bottom:auto;left:auto;right:0;}

#app.device-mobile .view-root{padding:14px 12px 18px;}
/* Il trigger dei filtri (dentro .grid-toolbar) deve restare raggiungibile mentre si
   scrolla una timeline lunga da mobile — niente più bisogno di risalire in cima.
   Sticky invece di spostarlo nell'header: resta nel flusso di ogni vista (Foto,
   Preferiti, Album, Persona), senza dover duplicare lì lo stato/i dati di scoping. */
#app.device-mobile .grid-toolbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -12px 10px;padding:10px 12px 8px;}
/* da mobile la griglia è a colonne fisse (vedi layoutJustifiedGrids), non "justified":
   ogni tile è un quadrato che riempie la sua colonna, niente calcolo di riga */
#app.device-mobile .photo-grid{gap:4px;}
#app.device-mobile .photo-grid .tile{width:auto !important;aspect-ratio:1/1;}
#app.device-mobile .folder-cards{grid-template-columns:repeat(2,1fr);}
#app.device-mobile .album-grid{grid-template-columns:repeat(2,1fr);}
#app.device-mobile .culling-batch-grid{grid-template-columns:repeat(2,1fr);}
#app.device-mobile .rename-card{width:100%;}
#app.device-mobile .settings-section{max-width:100%;}
#app.device-mobile .lb-body{flex-direction:column;}
#app.device-mobile .lb-stage{padding:8px 14px;}
#app.device-mobile .lb-arrow{display:none;}
#app.device-mobile .lb-info{
  width:100%;flex:0 0 auto;max-height:58%;border-left:none;border-top:1px solid #232323;
  border-radius:16px 16px 0 0;
}
#app.device-mobile .culling-top{padding:12px 0 4px;}
#app.device-mobile .culling-stage{padding:8px 14px;gap:8px;}
#app.device-mobile .culling-filmstrip{padding:10px 14px;}
#app.device-mobile .culling-bottom{padding:12px 14px;flex-wrap:wrap;gap:10px;}
#app.device-mobile .modal-card{width:86%;}

#app.device-mobile .mobile-tabbar{
  display:flex;flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-elevated);
  padding:6px 4px 8px;
}
.mobile-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;
  color:var(--text-tertiary);font-size:10.5px;font-weight:600;border-radius:10px;user-select:none;
}
.mobile-tab .ico{width:21px;height:21px;}
.mobile-tab.active{color:var(--accent);}

/* Libreria (menu mobile) — tab "Altro": raggruppato in sezioni etichettate che rispecchiano
   1:1 i gruppi del sidebar desktop (Libreria/Manutenzione/IA), niente accordion da aprire:
   da mobile la pagina scorre normalmente, quindi un elenco piatto e ben etichettato è più
   rapido da scandire di voci che si espandono una alla volta. */
.libreria-section-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);margin:18px 2px 8px;}
.libreria-section-label:first-child{margin-top:2px;}
.libreria-list{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;}
.libreria-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.libreria-row:last-child{border-bottom:none;}
.libreria-row:hover{background:var(--chip-bg);}
.libreria-row-ico{width:30px;height:30px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--text-secondary);}
.libreria-row-label{flex:1;font-size:13.5px;font-weight:600;}
.libreria-row-sub{font-size:11.5px;color:var(--text-tertiary);}
.libreria-row-chev{color:var(--text-tertiary);display:flex;}
.libreria-row.danger .libreria-row-label{color:var(--danger);}
.libreria-row-toggle .libreria-row-chev .ico{transition:transform .15s ease;}
.libreria-row-toggle.open .libreria-row-chev .ico{transform:rotate(180deg);}
.libreria-subrow{padding-left:30px;}
.libreria-subrow .libreria-row-ico{width:26px;height:26px;}
.libreria-subrow .libreria-row-label{font-weight:500;font-size:13px;}
</style>
</head>

<script>

function ico(name,size,cls){ return `<span class="${cls||''}" style="display:inline-flex">${icon(name,size)}</span>`; }

/* =========================================================
   DATA
========================================================= */
const FOLDERS = [
  {id:'urbino', name:'Urbino', total:556},
  {id:'braies', name:'Lago di Braies', total:110},
  {id:'chioggia', name:'Chioggia e Venezia', total:246},
];
const MONTHS = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MONTHS_FULL = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
// "distanza" in mesi rispetto al mese corrente della demo (luglio, indice 6) — usata per
// ordinare/raggruppare foto cronologicamente in modo coerente anche mescolando più cartelle
// nella stessa timeline (Foto = tutte le foto di default): monthOffset è relativo alla
// singola cartella in cui è stato generato il catalogo demo, quindi due cartelle diverse
// possono avere lo stesso monthOffset per mesi reali diversi — non è confrontabile tra loro.
// monthIdx (mese di calendario, 0=Gennaio..11=Dicembre) invece lo è sempre.
function monthDistance(monthIdx){ return (6 - monthIdx + 12) % 12; }
const HUES = [28,32,18,150,168,195,205,215,40];
// rapporti reali più comuni in fotografia: 3:2 orizzontale domina, poi verticale,
// con quadrate/4:3/panoramiche più rare — non tutte le foto sono quadrate.
const ASPECTS = [3/2,3/2,3/2,3/2,3/2, 2/3,2/3,2/3, 4/3, 3/4, 1, 16/9];
const CAMERAS = [
  {camera:'Sony A7 IV', lens:'FE 24-70mm f/2.8 GM'},
  {camera:'Fujifilm X-T5', lens:'XF 16-55mm f/2.8'},
  {camera:'Canon EOS R6 II', lens:'RF 24-105mm f/4'},
];
const PLACES = {urbino:{lat:43.7255,lng:12.6362,label:'Urbino, Marche'}, braies:{lat:46.6950,lng:12.0872,label:'Lago di Braies, Trentino-AA'}, chioggia:{lat:45.2189,lng:12.2793,label:'Chioggia, Veneto'}};
// vedi la nota sopra "scene" in genPhotos(): sostituto del vettore-embedding reale, solo per
// dare risultati non casuali alla ricerca per descrizione libera nel mockup.
const SCENES = ['tramonto','montagna','mare','citta','ritratto','natura','architettura','notturna','neve','strada'];

function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function escAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }

function genPhotos(folderId, total){
  const weights = [0.5,0.17,0.09,0.055,0.12,0.065]; // Jul..prev pattern-ish, folder-shifted
  const seedShift = hash(folderId)%5;
  const photos=[]; let counter=0;
  const monthCount = 6;
  for(let m=0; m<monthCount; m++){
    const w = weights[(m+seedShift)%weights.length];
    const n = Math.max(1, Math.round(total*w));
    const monthIdx = (6 - m + 12) % 12; // Luglio(6)=index6 in MONTHS(0=Gen) -> July index=6
    for(let i=0;i<n;i++){
      const id = folderId+'-'+m+'-'+i;
      const hh = hash(id);
      const hue = HUES[hh%HUES.length] + (hh%13)-6;
      const cam = CAMERAS[hh%CAMERAS.length];
      const isRaw = (hh%5)!==0;
      const stackType = !isRaw ? null : ((hh%3)===0 ? 'raw_only' : 'raw_jpeg');
      const aspect = ASPECTS[hh % ASPECTS.length];
      const MP = 32733696; // ~33MP, stessa risoluzione sensore per tutte, cambia solo l'inquadratura
      let ph = Math.round(Math.sqrt(MP/aspect)); ph -= ph%2;
      let pw = Math.round(ph*aspect); pw -= pw%2;
      photos.push({
        id, folderId, monthOffset:m, monthIdx,
        colorA:`hsl(${hue},38%,${48+(hh%10)}%)`, colorB:`hsl(${hue+16},34%,${28+(hh%12)}%)`,
        // "scena" nascosta: sta al posto del vettore-embedding reale (un numero calcolato una
        // volta per foto, mai visibile all'utente) che la ricerca semantica confronterebbe con
        // la descrizione libera — qui è solo una scorciatoia per far sì che "tramonto con casa"
        // filtri davvero qualcosa nel mockup, vedi sceneKeywordMatch().
        scene: SCENES[hh % SCENES.length],
        isRaw, stackType, aspect,
        isFav: (hh%13)===0,
        rating: [0,0,0,2,3,4,5][hh%7],
        pick: (hh%13)===0 ? 'pick' : ( (hh%29)===0 ? 'reject' : 'none' ),
        filename:`DSC0${8000+ (hh%999)}.${isRaw?'ARW':'JPG'}`,
        title:'', // titolo facoltativo, vuoto finché l'utente non lo imposta — vedi dettaglio foto / modifica multipla
        camera:cam.camera, lens:cam.lens,
        aperture:'f/'+(2+ (hh%6)/2).toFixed(1), iso: [100,200,400,800,1600][hh%5], shutter:'1/'+[125,250,500,1000,60][hh%5],
        w:pw, h:ph, sizeRaw:(55+(hh%30))+',0','sizeJpg':(6+(hh%6))+',0',
        day: 1+(hh%27), time: `${8+(hh%12)}:${(hh%6)*10 < 10 ? '0'+ (hh%6)*10 : (hh%6)*10}`,
      });
      counter++;
    }
  }
  return photos;
}
const PHOTO_CACHE = {};
function photosFor(folderId){
  if(!PHOTO_CACHE[folderId]){
    const f = FOLDERS.find(x=>x.id===folderId);
    PHOTO_CACHE[folderId] = genPhotos(folderId, f.total);
  }
  return PHOTO_CACHE[folderId];
}
function allPhotos(){
  return FOLDERS.flatMap(f=>photosFor(f.id));
}

const ALBUMS = [
  {id:'al1', name:'Migliori scatti 2026', range:'Gen 2026 – Lug 2026', shared:true, hue:24, seedMod:11},

function condFieldDef(key){ return ALBUM_FILTER_FIELDS.find(f=>f.key===key) || ALBUM_FILTER_FIELDS[0]; }
function freshCondition(field){
  const def = condFieldDef(field);
  if(def.kind==='multiselect') return {field, value:[]};
  if(def.kind==='daterange') return {field, from:'', to:''};
  return {field, value:''};
}
function photoDateISO(p){ return `2026-${String(p.monthIdx+1).padStart(2,'0')}-${String(p.day).padStart(2,'0')}`; }
function condMatches(p, cond){
  switch(cond.field){
    case 'folder': return !cond.value.length || cond.value.includes(p.folderId);
    case 'dateRange': {
      const iso = photoDateISO(p);
      if(cond.from && iso < cond.from) return false;
      if(cond.to && iso > cond.to) return false;
      return true;
    }
    case 'country': return true; // nel mockup tutte le cartelle sono in Italia
    case 'camera': return !cond.value || p.camera===cond.value;
    case 'lens': return !cond.value || p.lens===cond.value;
    case 'filetype':
      if(!cond.value) return true;
      if(cond.value==='raw_jpeg') return p.stackType==='raw_jpeg';
      if(cond.value==='raw_only') return p.stackType==='raw_only';
      return !p.isRaw; // 'jpeg'
    case 'fav': return !cond.value || (cond.value==='yes' ? p.isFav : !p.isFav);
    case 'rating': return !cond.value || p.rating >= Number(cond.value);
    case 'pick': return !cond.value || p.pick===cond.value;
    default: return true;
  }

function albumMembers(a){
  const all = allPhotos();
  if(!a.dynamic) return all.filter(p=>a.memberIds.has(p.id));
  if(!a.conditions || !a.conditions.length) return [];
  return all.filter(p => a.matchAll ? a.conditions.every(c=>condMatches(p,c)) : a.conditions.some(c=>condMatches(p,c)));
}
function computeRangeFromItems(items){
  if(!items.length) return 'nessuna foto';
  // per monthIdx (mese di calendario), non monthOffset: gli album spaziano già su più
  // cartelle (vedi albumMembers sopra, usa allPhotos()), e monthOffset non è confrontabile
  // tra cartelle diverse — vedi il commento su monthDistance().
  const dists = items.map(p=>monthDistance(p.monthIdx));
  const newest = items.find(p=>monthDistance(p.monthIdx)===Math.min(...dists));
  const oldest = items.find(p=>monthDistance(p.monthIdx)===Math.max(...dists));
  return newest===oldest ? `${MONTHS_FULL[newest.monthIdx]} 2026` : `${MONTHS_FULL[oldest.monthIdx]} 2026 – ${MONTHS_FULL[newest.monthIdx]} 2026`;
}
function albumRangeLabel(a, items){
  if(!a.dynamic) return a.range;
  if(!items.length) return 'nessuna foto corrisponde';
  return computeRangeFromItems(items);
}

function reanalyzeLibrary(){
  let newlyAssigned=0, newlySuggested=0;
  TAGS.forEach(t=>{
    const map = TAG_ASSIGNMENTS[t.id];
    allPhotos().forEach(p=>{
      if(map.has(p.id)) return; // già deciso (auto, umano o rifiutato) — permanente, mai ricalcolato
      const r = hash(p.id+'::'+t.id+'::seed') % 100;
      if(r < t.autoRate){ map.set(p.id, {status:'confirmed', origin:'ai'}); newlyAssigned++; }
      else if(r < t.autoRate + t.suggestRate){ map.set(p.id, {status:'suggested', origin:'ai'}); newlySuggested++; }
    });
  });
  return {newlyAssigned, newlySuggested};

/* =========================================================
   CULLING A LOTTI (Gruppo C)
   Un lotto (batch) è un import in corso, non ancora "in libreria": vive dentro la
   cartella radice di culling scelta dall'utente (state.cullingRootFolder), una
   sottocartella per lotto. Dentro un lotto, "Scelta"/"Scarta" non sono solo
   un'etichetta: spostano fisicamente la foto in _presi/_scartati dentro quella
   sottocartella — apposta per poterla poi sincronizzare (es. via WebDAV) da un
   altro computer senza passare dal browser. L'interazione resta un click identico
   a un'etichetta (esattamente come le stelle): lo spostamento è un effetto
   invisibile del click, mai un'azione a parte da spiegare o confermare.
   Le foto di un lotto vivono in un pool separato da allPhotos()/FOLDERS: sono
   ancora "in lavorazione", non foto organizzate della libreria — tenerle fuori da
   Preferiti/Album/Tag/Duplicati evita che compaiano lì prima ancora di essere
   scelte. Una volta scelte, postprodotte e ricaricate, l'utente le fa rientrare in
   libreria con l'import normale: non è questo mockup a farcele passare da solo.
   Una foto valutata FUORI da un lotto (nella libreria già organizzata, es. da
   Modifica multipla) continua a funzionare come oggi: solo il flag p.pick, nessuno
   spostamento — stesso concetto di "scelta/scarto", comportamento diverso, lo
   decide solo la posizione della foto, senza alcuno switch di modalità visibile.
========================================================= */
const CULLING_BATCHES = [
  {id:'lotto-dolomiti', name:'Dolomiti', dateLabel:'14 ago 2026', total:184, monthIdx:7},
  {id:'lotto-toscana', name:'Toscana — Val d\'Orcia', dateLabel:'2 lug 2026', total:96, monthIdx:6},

];
function cullingBatchById(id){ return CULLING_BATCHES.find(b=>b.id===id); }
function genCullingPhotos(batchId, total, monthIdx){
  const photos=[];
  for(let i=0;i<total;i++){
    const id = batchId+'-'+i;
    const hh = hash(id);
    const hue = HUES[hh%HUES.length] + (hh%13)-6;
    const cam = CAMERAS[hh%CAMERAS.length];
    const isRaw = (hh%5)!==0;
    const stackType = !isRaw ? null : ((hh%3)===0 ? 'raw_only' : 'raw_jpeg');
    const aspect = ASPECTS[hh % ASPECTS.length];
    const MP = 32733696;
    let ph = Math.round(Math.sqrt(MP/aspect)); ph -= ph%2;
    let pw = Math.round(ph*aspect); pw -= pw%2;
    photos.push({
      id, batchId, idx:i,
      colorA:`hsl(${hue},38%,${48+(hh%10)}%)`, colorB:`hsl(${hue+16},34%,${28+(hh%12)}%)`,
      aspect, isRaw, stackType,
      rating: [0,0,0,2,3,4,5][hh%7],
      // stato "fisico" dentro il lotto: root (ancora da valutare, nella radice del lotto) /
      // taken (spostata in _presi, cioè "Scelta") / skipped (spostata in _scartati, cioè
      // "Scarta") — vedi commento sopra sul perché è un vero spostamento e non solo un flag.
      cullState: 'root',
      filename:`DSC0${9000+(hh%999)}.${isRaw?'ARW':'JPG'}`,
      title:'',
      camera:cam.camera, lens:cam.lens,
      aperture:'f/'+(2+(hh%6)/2).toFixed(1), iso:[100,200,400,800,1600][hh%5], shutter:'1/'+[125,250,500,1000,60][hh%5],
      w:pw, h:ph, sizeRaw:(55+(hh%30))+',0', sizeJpg:(6+(hh%6))+',0',
      day: 1+(hh%27), monthIdx, time:`${8+(hh%12)}:${(hh%6)*10<10?'0'+(hh%6)*10:(hh%6)*10}`,
    });
  }
  return photos;
}
const CULLING_PHOTO_CACHE = {};
function cullingPhotosFor(batchId){
  if(!CULLING_PHOTO_CACHE[batchId]){

    fotocamera: renameSlug(photo.camera),
    obiettivo: renameSlug(photo.lens),
    luogo: renameSlug(placeLabelFor(photo)),
    // se il titolo non è stato impostato, il pezzo semplicemente non compare — non è un errore.
    titolo: renameSlug(photo.title),
  };
  let out = String(schema||'').replace(/\{(data|fotocamera|obiettivo|luogo|titolo)\}/g, (m,k)=> values[k]);
  out = out.replace(/\{n(?::(\d+))?\}/g, (m,pad)=> String(index+1).padStart(pad?Number(pad):1,'0'));
  out = out.replace(/[\/\\:]/g,'-').replace(/\s+/g,' ').trim();
  if(!out) out = photo.filename.replace(/\.[^.]+$/,''); // schema vuoto: non rinomina davvero, resta il nome attuale
  return out + '.' + ext;
}

/* =========================================================
   GRUPPO B — VOLTI
   Rileva i volti, li raggruppa per somiglianza, l'utente dà i nomi. Nessun database
   esterno di identità: Keeppix non sa CHI è una persona, sa solo che questi volti si
   somigliano. Le correzioni manuali (rinomina, unione, separazione, "non è un volto")
   sono permanenti e sopravvivono a ogni rianalisi — per questo PEOPLE/FACES sono dati
   "vivi" modificati in-place dall'utente, non rigenerati come le foto.
   Ambito: solo le foto di libreria organizzata (come i Tag) — le foto di culling non
   sono ancora organizzate, quindi non hanno volti riconosciuti.
========================================================= */
// gruppi creati dall'utente per raccogliere PERSONE fotografate ("Famiglia", "Amici") —
// concetto distinto dai gruppi di UTENTI dell'app usati per i permessi di condivisione,
// che sono un'altra cosa e vivono altrove.
const PERSON_GROUPS = [
  {id:'grp-famiglia', name:'Famiglia'},
  {id:'grp-amici', name:'Amici'},
];
// roster fisso della libreria demo, con copertura volutamente varia: nominate/senza nome,
// con/senza gruppo, una nascosta (uno sconosciuto sullo sfondo — non un errore, non
// interessa), e "Chiara" costruita apposta con i volti di DUE persone diverse mischiati
// sotto lo stesso cluster (vedi subA/subB in FACE_ROSTER più sotto), per poter dimostrare
// la Separazione su un caso reale invece che su dati inventati al volo nel dialog.
const PEOPLE = [
  {id:'p1', name:'Marta', groupId:'grp-famiglia', hidden:false, coverFaceId:null},
  {id:'p2', name:'Elena', groupId:'grp-famiglia', hidden:false, coverFaceId:null},
  {id:'p3', name:'Paolo', groupId:'grp-famiglia', hidden:false, coverFaceId:null},
  {id:'p4', name:'Luca', groupId:'grp-amici', hidden:false, coverFaceId:null},
  {id:'p5', name:'Sara', groupId:'grp-amici', hidden:false, coverFaceId:null},
  {id:'p6', name:'Chiara', groupId:'grp-amici', hidden:false, coverFaceId:null},
  {id:'p7', name:'Davide', groupId:null, hidden:false, coverFaceId:null},
  {id:'p8', name:'', groupId:null, hidden:false, coverFaceId:null, autoNum:12},
  {id:'p9', name:'', groupId:null, hidden:false, coverFaceId:null, autoNum:5},
  {id:'p10', name:'', groupId:null, hidden:false, coverFaceId:null, autoNum:21},
  {id:'p11', name:'', groupId:null, hidden:false, coverFaceId:null, autoNum:9},
  {id:'p12', name:'', groupId:null, hidden:true, coverFaceId:null, autoNum:30},
];
let _personAutoSeq = 30; // numerazione "Persona N" per cluster generati dopo l'avvio (separazione, rifiuto proposta)
let _personIdSeq = PEOPLE.length;
function newPersonId(){ return 'p-gen-'+(++_personIdSeq); }
function nextPersonAutoNum(){ return ++_personAutoSeq; }
function personById(id){ return PEOPLE.find(p=>p.id===id); }
function personGroupById(id){ return PERSON_GROUPS.find(g=>g.id===id); }
function personDisplayName(person){
  if(!person) return '';
  return person.name || `Persona ${person.autoNum}`;
}
// posizioni % plausibili di un volto in un'inquadratura, per dare varietà ai riquadri
// nel dettaglio foto senza dover calcolare una vera bounding box da un'immagine finta.
const FACE_BOX_PRESETS = [
  {x:38,y:16,w:20,h:25},{x:20,y:24,w:17,h:22},{x:56,y:19,w:18,h:23},
  {x:30,y:33,w:16,h:20},{x:43,y:12,w:22,h:27},{x:14,y:39,w:15,h:19},
  {x:62,y:38,w:16,h:20},{x:34,y:46,w:15,h:19},
];
// count = volti confermati; subA/subB (solo per Chiara/p6) simulano un cluster misto:
// subB sono in realtà un'altra persona che l'IA ha unito per errore sotto lo stesso nome.
const FACE_ROSTER = [
  {personId:'p1', count:52},
  {personId:'p2', count:38},
  {personId:'p3', count:34},
  {personId:'p4', count:29},
  {personId:'p5', count:24},
  {personId:'p6', count:31, subB:9},
  {personId:'p7', count:19},
  {personId:'p8', count:37},
  {personId:'p9', count:11},
  {personId:'p10', count:9},
  {personId:'p11', count:6},
  {personId:'p12', count:5},
];
// coda di revisione: volti rilevati che l'IA sospetta siano di una persona già nominata,
// ma a confidenza non abbastanza alta da assegnarli da sola — stesso pattern dei tag
// suggeriti (vedi TAG_ASSIGNMENTS/status 'suggested'), qui applicato ai volti.
const FACE_PENDING_ROSTER = [
  {personId:'p1', count:14},
  {personId:'p4', count:9},
];
function genFaces(){
  const pool = [...photosFor('urbino'), ...photosFor('braies'), ...photosFor('chioggia')];
  const faces = [];
  let counter = 0, poolIdx = 0;
  FACE_ROSTER.forEach((r,ri)=>{
    const subB = r.subB||0;
    for(let i=0;i<r.count;i++){
      const photo = pool[(poolIdx + ri*37) % pool.length];
      poolIdx++;
      const hh = hash(r.personId+'-'+i);
      faces.push({
        id:'face-'+(counter++), photoId: photo.id, personId: r.personId,
        status:'confirmed', suggestedPersonId:null,
        subCluster: i < (r.count-subB) ? 0 : 1,
        box: FACE_BOX_PRESETS[hh % FACE_BOX_PRESETS.length],
      });
    }
  });
  FACE_PENDING_ROSTER.forEach((r,ri)=>{
    for(let i=0;i<r.count;i++){
      const photo = pool[(poolIdx + ri*53 + 5000) % pool.length];
      poolIdx++;
      const hh = hash('pending-'+r.personId+'-'+i);
      faces.push({
        id:'face-'+(counter++), photoId: photo.id, personId: null,
        status:'pending', suggestedPersonId: r.personId, subCluster:0,
        box: FACE_BOX_PRESETS[hh % FACE_BOX_PRESETS.length],
      });
    }
  });
  return faces;
}
const FACES = genFaces();
let _faceIdSeq = FACES.length;
function newFaceId(){ return 'face-gen-'+(++_faceIdSeq); }
// assegnazione manuale di una persona a una foto dal pannello info (nessun rilevamento
// automatico dietro: niente box, la foto non nasce da un'analisi ma da una scelta umana).
function addManualFaceToPhoto(photoId, personId){
  const f = {id:newFaceId(), photoId, personId, status:'confirmed', suggestedPersonId:null, subCluster:0, box:null};
  FACES.push(f);
  return f;
}
function facesForPhoto(photoId){ return FACES.filter(f=>f.photoId===photoId && f.status==='confirmed'); }
function facesForPerson(personId){ return FACES.filter(f=>f.personId===personId && f.status==='confirmed'); }
function personPhotoIds(personId){ return [...new Set(facesForPerson(personId).map(f=>f.photoId))]; }
function personPhotoCount(personId){ return personPhotoIds(personId).length; }
function photosForPerson(personId){ return personPhotoIds(personId).map(id=>allPhotos().find(p=>p.id===id)).filter(Boolean); }
function personCoverPhoto(person){
  const faces = facesForPerson(person.id);
  if(!faces.length) return null;
  const coverFace = person.coverFaceId ? faces.find(f=>f.id===person.coverFaceId) : null;
  const face = coverFace || faces[0];
  return allPhotos().find(p=>p.id===face.photoId) || null;
}
function personsForPhoto(photoId){
  const ids = [...new Set(facesForPhoto(photoId).map(f=>f.personId))];
  return ids.map(personById).filter(Boolean);
}
function visiblePeople(){ return PEOPLE.filter(p=>!p.hidden && personPhotoCount(p.id)>0); }
function hiddenPeople(){ return PEOPLE.filter(p=>p.hidden); }
function peopleInGroup(groupId){ return visiblePeople().filter(p=>p.groupId===groupId); }
function peopleWithoutGroup(){ return visiblePeople().filter(p=>!p.groupId); }
function pendingFaceGroups(){
  const bySuggested = {};
  FACES.filter(f=>f.status==='pending').forEach(f=>{ (bySuggested[f.suggestedPersonId] = bySuggested[f.suggestedPersonId]||[]).push(f); });
  return Object.keys(bySuggested).map(pid=>({person: personById(pid), faces: bySuggested[pid]})).filter(g=>g.person && g.faces.length);
}
function pendingFaceCount(){ return FACES.filter(f=>f.status==='pending').length; }
function confirmFaceMatch(faceId){
  const f = FACES.find(x=>x.id===faceId);
  if(f){ f.personId = f.suggestedPersonId; f.status='confirmed'; }
}
// "non è {persona}": il volto resta un volto vero, solo non di chi l'IA pensava — diventa
// un cluster nuovo senza nome, tra le "persone senza nome" (l'utente potrà poi unirlo a
// quella giusta con Unione, se lo riconosce). Diverso da "non è un volto" (vedi sotto),
// che invece lo elimina per sempre.
function rejectFaceMatch(faceId){
  const f = FACES.find(x=>x.id===faceId);
  if(!f) return;
  const newId = newPersonId();
  PEOPLE.push({id:newId, name:'', groupId:null, hidden:false, coverFaceId:null, autoNum: nextPersonAutoNum()});
  f.personId = newId; f.status='confirmed'; f.suggestedPersonId=null;
}
// falso positivo (un disegno, un volto su un poster): immediato e permanente, non viene
// mai più riproposto in nessuna coda — a differenza di rejectFaceMatch qui non nasce
// nessuna persona nuova, il rilevamento sparisce e basta.
function rejectFaceAsNotAFace(faceId){
  const f = FACES.find(x=>x.id===faceId);
  if(f){ f.status='not_face'; f.personId=null; f.suggestedPersonId=null; }
}
function mergePeopleInto(personIds, survivorId){
  personIds.forEach(pid=>{
    if(pid===survivorId) return;
    FACES.forEach(f=>{ if(f.personId===pid) f.personId=survivorId; });
    const idx = PEOPLE.findIndex(p=>p.id===pid);
    if(idx>=0) PEOPLE.splice(idx,1);
  });
}
// separazione: sposta i volti scelti (faceIds) fuori dalla persona originale in una
// persona nuova — l'originale mantiene il nome e i volti restanti, la nuova nasce senza
// nome (l'utente la nominerà dal suo dettaglio, se vuole) salvo newName esplicito.
function splitPersonFaces(personId, faceIds, newName){
  const newId = newPersonId();
  const newPerson = {id:newId, name:newName||'', groupId:null, hidden:false, coverFaceId:null, autoNum: nextPersonAutoNum()};
  PEOPLE.push(newPerson);
  faceIds.forEach(fid=>{
    const f = FACES.find(x=>x.id===fid);
    if(f && f.personId===personId) f.personId = newId;
  });
  return newPerson;
}
function wipeAllFaceData(){
  FACES.length = 0;
  PEOPLE.length = 0;
  PERSON_GROUPS.length = 0;
}

/* =========================================================
   FILTRO RAPIDO NELLE VISTE A GRIGLIA (Foto, Preferiti, Album, dettaglio Persona)
   Diverso dalle condizioni degli album dinamici (ALBUM_FILTER_FIELDS/condMatches, sopra):
   qui non si costruisce una regola persistente, è un filtro "sul momento" che resta finché
   non lo si cancella o non si cambia vista. Sei dimensioni, ognuna un OR di valori scelti;
   fra dimensioni diverse è un AND (es. Tipo=RAW E Persone=Marta E Luogo=Urbino).
========================================================= */
const BROWSE_FILE_TYPE_OPTIONS = [
  {value:'raw_jpeg', label:'RAW+JPEG'},
  {value:'raw_only', label:'RAW'},
  {value:'jpeg', label:'JPEG'},
];
function browseFileType(p){
  if(p.stackType==='raw_jpeg') return 'raw_jpeg';
  if(p.stackType==='raw_only') return 'raw_only';
  return 'jpeg';
}
function browseFilterActiveCount(){
  const f = state.browseFilters;
  return f.type.length + f.personIds.length + f.tagIds.length + f.categoryIds.length + f.cameras.length + f.folderIds.length;
}
function resetBrowseFilters(){
  state.browseFilters = {type:[], personIds:[], tagIds:[], categoryIds:[], cameras:[], folderIds:[]};
}
function photoMatchesBrowseFilters(p){
  const f = state.browseFilters;
  if(f.type.length && !f.type.includes(browseFileType(p))) return false;
  if(f.folderIds.length && !f.folderIds.includes(p.folderId)) return false;
  if(f.cameras.length && !f.cameras.includes(p.camera)) return false;
  if(f.personIds.length){
    if(!state.faceRecognitionEnabled) return false; // dimensione disattivata: nessuna foto può "matchare"
    const ppl = facesForPhoto(p.id).map(fc=>fc.personId);
    if(!f.personIds.some(id=>ppl.includes(id))) return false;
  }
  if(f.tagIds.length || f.categoryIds.length){
    const confirmed = confirmedTagsForPhoto(p.id);
    if(f.tagIds.length && !f.tagIds.some(id=>confirmed.some(({tag})=>tag.id===id))) return false;
    if(f.categoryIds.length && !f.categoryIds.some(cid=>confirmed.some(({tag})=>tag.categoryId===cid))) return false;
  }
  return true;
}
function applyBrowseFilters(list){
  return browseFilterActiveCount() ? list.filter(photoMatchesBrowseFilters) : list;
}
/* ===== pannello del filtro: un cerchio/quadrato icona come il resto dell'app (stesso
   linguaggio di .tag-icon-btn), un pallino con il conteggio quando qualcosa è attivo, e un
   pannello a tendina con sezioni a chip — stesso componente .chip usato altrove, niente di
   nuovo da imparare. Ogni vista che lo include passa solo il proprio elenco di foto (per il
   conteggio "N foto" nel pannello) e riceve applyBrowseFilters(list) da applicare da sé. ===== */
// ricerca testuale dentro una sezione del pannello — persiste finché il pannello resta
// aperto, si azzera quando si chiude. Solo Tag e Persone possono davvero crescere tanto da
// servirne una (vedi BROWSE_FILTER_SEARCH_THRESHOLD), le altre dimensioni restano semplici.
// (lo stato vero e proprio, state.browseFilterQuery, è inizializzato dentro STATE qui sotto)
const BROWSE_FILTER_SEARCH_THRESHOLD = 8;
function browseFilterDimensions(){
  return {
    browsetype: {options: BROWSE_FILE_TYPE_OPTIONS, arr: state.browseFilters.type},
    browseperson: {options: state.faceRecognitionEnabled ? visiblePeople().map(p=>({value:p.id, label:personDisplayName(p)})) : [], arr: state.browseFilters.personIds},
    browsetag: {options: TAGS.map(t=>({value:t.id, label:t.name, dot:`hsl(${t.color},60%,55%)`})), arr: state.browseFilters.tagIds},
    browsecat: {options: TAG_CATEGORIES.map(c=>({value:c.id, label:c.name})), arr: state.browseFilters.categoryIds},
    browsecamera: {options: [...new Set(CAMERAS.map(c=>c.camera))].map(v=>({value:v, label:v})), arr: state.browseFilters.cameras},
    browsefolder: {options: FOLDERS.map(fo=>({value:fo.id, label:fo.name})), arr: state.browseFilters.folderIds},
  };
}
function browseFilterChipHTML(o, dataAttr, activeIds){
  return `<div class="chip ${activeIds.includes(o.value)?'active':''}" data-${dataAttr}="${o.value}" role="button" tabindex="0">${o.dot?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:${o.dot}" aria-hidden="true"></span>`:''}${o.label}</div>`;
}
// le opzioni già scelte restano sempre visibili in cima, non filtrate dalla ricerca — così
// digitare per trovarne una nuova non fa sparire quelle che hai già selezionato
function browseFilterChipRowHTML(dataAttr){
  const {options, arr} = browseFilterDimensions()[dataAttr];
  const query = (state.browseFilterQuery[dataAttr] || '').trim().toLowerCase();
  const selected = options.filter(o=>arr.includes(o.value));
  const rest = options.filter(o=>!arr.includes(o.value));
  const restShown = query ? rest.filter(o=>o.label.toLowerCase().includes(query)) : rest;
  const shown = [...selected, ...restShown];
  if(!shown.length) return `<div class="browse-filter-noresults">Nessun risultato per "${escAttr(state.browseFilterQuery[dataAttr]||'')}"</div>`;
  return shown.map(o=>browseFilterChipHTML(o, dataAttr, arr)).join('');
}
function browseFilterChipSectionHTML(label, dataAttr){
  const {options} = browseFilterDimensions()[dataAttr];
  if(!options.length) return '';
  const searchable = options.length > BROWSE_FILTER_SEARCH_THRESHOLD;
  return `<div class="browse-filter-section ${searchable?'searchable':''}">
    <div class="browse-filter-section-label">${label}</div>
    ${searchable ? `<input class="browse-filter-search" type="text" placeholder="Cerca in ${options.length}…" value="${escAttr(state.browseFilterQuery[dataAttr]||'')}" data-browsefiltersearch="${dataAttr}" autocomplete="off">` : ''}
    <div class="chip-row" data-browsefilterchips="${dataAttr}">${browseFilterChipRowHTML(dataAttr)}</div>
  </div>`;
}
function browseFilterPanelHTML(scopedList){
  const matchCount = applyBrowseFilters(scopedList).length;
  return `<div class="browse-filter-panel" data-browsefilterpanel>
    <div class="browse-filter-head">
      <span>Filtri</span>
      ${browseFilterActiveCount() ? `<span class="browse-filter-clear" data-browsefilterclear role="button" tabindex="0">Cancella tutto</span>` : ''}
    </div>
    <div class="browse-filter-body">
      ${browseFilterChipSectionHTML('Tipo', 'browsetype')}
      ${browseFilterChipSectionHTML('Persone', 'browseperson')}
      ${browseFilterChipSectionHTML('Tag', 'browsetag')}
      ${browseFilterChipSectionHTML('Categorie', 'browsecat')}
      ${browseFilterChipSectionHTML('Fotocamera', 'browsecamera')}
      ${browseFilterChipSectionHTML('Luogo', 'browsefolder')}
      ${!state.faceRecognitionEnabled ? `<div class="browse-filter-hint">Persone non disponibile: riconoscimento volti disattivato in Impostazioni.</div>` : ''}
    </div>
    <div class="browse-filter-foot">${matchCount} foto ${browseFilterActiveCount() ? 'con questi filtri' : 'in totale'}</div>
  </div>`;
}
function browseFilterHTML(scopedList){
  const count = browseFilterActiveCount();
  return `<div class="browse-filter ${state.browseFilterOpen?'open':''}" data-browsefilterwrap>
    <div class="tag-icon-btn browse-filter-btn ${count?'active':''}" data-browsefiltertoggle role="button" tabindex="0" aria-haspopup="true" aria-expanded="${state.browseFilterOpen}" aria-label="Filtra">
      ${icon('funnel',14)}
      ${count?`<span class="browse-filter-count">${count}</span>`:''}
    </div>
    ${state.browseFilterOpen ? `<div class="browse-filter-scrim" data-browsefilterscrim></div>${browseFilterPanelHTML(scopedList)}` : ''}
  </div>`;
}
function wireBrowseFilter(root, scopedList){
  const wrap = root.querySelector('[data-browsefilterwrap]');
  if(!wrap) return;
  const toggle = wrap.querySelector('[data-browsefiltertoggle]');
  bindActivatable(toggle, (e)=>{
    if(e && e.stopPropagation) e.stopPropagation();
    state.browseFilterOpen = !state.browseFilterOpen;
    renderAll();
  });
  const panel = wrap.querySelector('[data-browsefilterpanel]');
  if(!panel) return;
  panel.onclick = (e)=> e.stopPropagation();
  const toggleValue = (arr, val)=>{ const i=arr.indexOf(val); if(i===-1) arr.push(val); else arr.splice(i,1); };
  // ricablata sia al primo giro sia dopo aver riscritto un singolo chip-row via ricerca
  // (senza toccare il resto del pannello, altrimenti l'input perderebbe il focus a ogni
  // lettera digitata — stesso principio del composer di Cerca, vedi renderCerca)
  const wireChipRow = (dataAttr)=>{
    const {arr} = browseFilterDimensions()[dataAttr];
    panel.querySelectorAll(`[data-${dataAttr}]`).forEach(chip=>{
      bindActivatable(chip, (e)=>{
        if(e && e.stopPropagation) e.stopPropagation();
        toggleValue(arr, chip.dataset[dataAttr]);
        renderAll();
      });
    });
  };
  ['browsetype','browseperson','browsetag','browsecat','browsecamera','browsefolder'].forEach(wireChipRow);
  panel.querySelectorAll('[data-browsefiltersearch]').forEach(input=>{
    input.oninput = (e)=>{
      const dataAttr = input.dataset.browsefiltersearch;
      state.browseFilterQuery[dataAttr] = e.target.value;
      const rowHost = panel.querySelector(`[data-browsefilterchips="${dataAttr}"]`);
      if(rowHost){ rowHost.innerHTML = browseFilterChipRowHTML(dataAttr); wireChipRow(dataAttr); }
    };
    input.onclick = (e)=> e.stopPropagation();
  });
  const clearBtn = panel.querySelector('[data-browsefilterclear]');
  if(clearBtn) bindActivatable(clearBtn, (e)=>{ if(e && e.stopPropagation) e.stopPropagation(); resetBrowseFilters(); renderAll(); });
}
document.addEventListener('click', ()=>{ if(state.browseFilterOpen){ state.browseFilterOpen=false; renderAll(); } });

// wrapper condiviso dalle 4 viste a griglia (Foto/Preferiti/Album/Persona): stessa

/* =========================================================
   STATE
========================================================= */
const state = {
  theme:'light',
  view:'foto',
  // null = "tutte le foto" (Foto in nav mostra sempre questo di default, combinando le
  // cartelle) — diventa l'id di una cartella specifica solo scegliendola da "Cartelle"
  // nella sidebar, o da un altro punto dell'app che salta a una cartella precisa.
