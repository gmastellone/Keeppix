name: Export OpenCLIP XLM-R IT/EN

# Produces the replacement ONNX weights for MobileCLIP2-S2 (research-only).
#
# `workflow_dispatch` only, not `push`: unlike the `download-*.sh` scripts
# (a curl against an already-built file), this downloads a torch checkpoint
# from HuggingFace, exports it, quantizes it, and prunes the vocabulary —
# minutes of compute and hundreds of MB of network traffic per run, not
# something to run on every push to a phase branch. Manual trigger for now;
# this step is meant to eventually feed the Docker image bake, not the
# `backend` job in `ci.yml`.
#
# Verified BEFORE writing this file, in a network-restricted development
# sandbox (no access to huggingface.co, so no real weights): the mechanics
# of the whole pipeline (vision tower export, text tower export with
# vocabulary pruning+remap, quant_pre_process, quantize_dynamic, round-trip
# through onnxruntime) against a synthetic random-weight
# XLM-RoBERTa-base architecture — the same known public architecture and
# the same API calls as `scripts/export-openclip-xlmr-it-en.py`, verified
# byte-for-byte down to a 7e-8 difference between eager PyTorch and ONNX
# Runtime output. Not verified there (and verified here for the first
# time): the REAL checkpoint
# (`laion/CLIP-ViT-B-32-xlm-roberta-base-laion5B-s13B-b90k`), and therefore
# the real model quality and the weight/RSS/ms numbers the project needs.
#
# `push` below, scoped to `main`: Actions caches are scoped to the branch
# that saved them (plus the default branch) — a cache hit from a
# development branch was never visible to a run on `main` (discovered for
# real at the first merge: `Test` failed on `main` with the weights missing
# even though the same commit was green on the branch). A push to `main`
# that touches the export script repopulates the cache scoped to `main`,
# which is the one that matters for `ci.yml` from that point on. Before the
# merge this trigger was scoped to the development branch
# (`workflow_dispatch` alone only requires the file to already be on the
# default branch to be invokable via the API — verified: it 404s if you try
# to run it right after pushing to a non-default branch).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/export-openclip-xlmr-it-en.py
      - .github/workflows/export-openclip-xlmr.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install export's Python dependencies (only here, never at runtime)
        run: |
          pip install --quiet torch open_clip_torch transformers onnx onnxruntime wordfreq

      - name: Export, prune IT/EN vocabulary, quantize to int8
        run: python3 scripts/export-openclip-xlmr-it-en.py --out models/openclip-xlmr-it-en

      - name: Artifact sizes and hashes
        run: |
          ls -lh models/openclip-xlmr-it-en/
          sha256sum models/openclip-xlmr-it-en/*.onnx models/openclip-xlmr-it-en/*.json

      # Makes these weights reusable by the `backend` job in `ci.yml` (real
      # Rust embed/bench tests) without redoing the whole export there —
      # that would mean minutes of compute and network traffic to
      # HuggingFace on every push, exactly what this workflow is designed
      # to avoid (see the comment at the top of the file). Same key as the
      # "Cache OpenCLIP XLM-R IT/EN weights" step in `ci.yml`: the Actions
      # cache is shared per branch regardless of which workflow populated
      # it.
      - name: Cache weights for reuse from ci.yml
        uses: actions/cache@v4
        with:
          path: models/openclip-xlmr-it-en
          key: openclip-xlmr-it-en-${{ hashFiles('scripts/export-openclip-xlmr-it-en.py') }}

      # Downloading the artifact (Azure Blob Storage) isn't reachable from
      # the development sandbox's proxy — the same kind of block already
      # seen for huggingface.co, different domain. The two JSON files here
      # are small and their structure is known (written by this same
      # script), but printing the REAL values in the log avoids having to
      # infer them by hand.
      - name: Manifest contents (avoids downloading the artifact just to read them)
        run: |
          echo "--- export_manifest.json ---"
          cat models/openclip-xlmr-it-en/export_manifest.json
          echo
          echo "--- id_remap.json: metadata (without the full map, which is large) ---"
          python3 -c "
          import json
          d = json.load(open('models/openclip-xlmr-it-en/id_remap.json'))
          print('original_vocab_size:', d['original_vocab_size'])
          print('pruned_vocab_size:', d['pruned_vocab_size'])
          print('unk_new_index:', d['unk_new_index'])
          print('pad_token_id:', d['pad_token_id'])
          print('kept entries:', len(d['kept']))
          sample = list(d['kept'].items())[:5]
          print('sample kept (old_id -> new_index):', sample)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: openclip-xlmr-it-en
          path: models/openclip-xlmr-it-en/
          retention-days: 14
