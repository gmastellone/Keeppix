name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Formattazione
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # I test di integrazione avviano Postgres via testcontainers (immagine
      # postgis/postgis:17-3.5): Docker è già disponibile sui runner GitHub, e
      # il container usa-e-getta viene creato e distrutto automaticamente. In
      # locale, dove testcontainers non è raggiungibile, l'harness usa invece
      # la variabile KEEPPIX_TEST_DATABASE_URL per puntare a un Postgres già
      # in esecuzione: qui in CI non va impostata.
      - name: Test
        run: cargo test --workspace -- --test-threads=1

      - name: La specifica OpenAPI è aggiornata
        run: git diff --exit-code docs/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - run: npm ci
      - name: Tipi
        run: npx vue-tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

      - name: Budget del bundle iniziale (150 KB gzip)
        run: |
          SIZE=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
          echo "bundle gzip: $SIZE byte"
          if [ "$SIZE" -gt 153600 ]; then
            echo "::error::bundle oltre il budget di 153600 byte"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories bans licenses }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build immagine (senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
