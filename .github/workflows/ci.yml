name: CI

on:
  # 'fase-*' in addition to main: PRs against this repo are currently broken
  # on GitHub's side (pullRequests.totalCount returns 0 via both API and web
  # even though PRs #10/#11 existed and are listed in the commit history —
  # verified, not a local permissions issue). Until that's resolved on
  # GitHub's side, pushing directly to the phase branch is the only way to
  # get real CI before merging.
  push: { branches: [main, 'fase-*'] }
  pull_request:
  # Manual escape hatch: the push trigger for this specific file was once
  # left without any recorded runs for two consecutive commits on main while
  # the rest of the Actions platform was otherwise working again (confirmed
  # via a workflow_dispatch run on export-openclip-xlmr.yml) — a GitHub-side
  # webhook delivery issue, not a local one. workflow_dispatch gives a way to
  # run CI anyway without waiting on that path.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    # A single PostGIS for the job. testcontainers used to leave one running
    # per crate (Drop wasn't removing them) and the runner would run out of
    # disk space halfway through the suite.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KEEPPIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Public functions and routes with no callers
        run: python3 scripts/check-wired.py

      # keeppix-server embeds frontend/dist into the binary via
      # `#[derive(Embed)]` (rust-embed): if the folder is missing, the crate
      # doesn't compile at all (not a test that gets skipped). The
      # `frontend` job runs on a separate runner and doesn't share a
      # filesystem with this job, so the frontend has to be rebuilt here
      # independently — a few extra seconds, no coupling between the two
      # jobs via an artifact.
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend (required by rust-embed to compile keeppix-server)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@1.88.0
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # main only. "true" everywhere (PRs included) was tried at one
          # point to avoid a long-lived branch recompiling everything on
          # every push — but with several phases active in parallel, saving
          # on every PR pushed the repo's Actions cache to the 10 GB cap
          # (747 entries) and added to billing costs. The speed gain wasn't
          # worth that cost: back to main only.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Free disk space before tests
        run: |
          # ubuntu-latest runners already start full of unused toolchains;
          # clippy + workspace tests easily fill the ~14 GiB free and
          # Postgres ends up in PANIC on pg_wal (seen on PR #4).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules || true
          df -h /

      # Video playback/transcode tests probe with ffprobe and seed clips with
      # ffmpeg. Without these the suite writes a fake file and probe → 404.
      # `age` + `zstd` are required by the kpxb external-CLI round-trip test.
      # `libheif-examples` gives `heif-convert` (Task 22, HEIF/HEIC decode in
      # sandbox); on ubuntu-latest (24.04) libheif ships its codecs as
      # `dlopen` plugins, not linked in like on Debian bookworm (see
      # Dockerfile), so `libheif-plugin-libde265` is needed too or every HEIC
      # fixture test silently skips via `heif_convert_available()` instead of
      # actually running.
      - name: Install ffmpeg, age, zstd, libheif (video, backup, HEIF tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg age zstd libheif-examples libheif-plugin-libde265

      # The `keeppix-db` test harness (and `provision_with_vector` in
      # `keeppix-jobs`) requires pgvector. `services.postgres` stays on
      # `postgis/postgis:17-3.5` (without vector) for the other crates via
      # `KEEPPIX_TEST_DATABASE_URL`; when that URL doesn't offer `vector`,
      # the AI tests fall back to testcontainers' `keeppix-db:dev`. That
      # image isn't on Docker Hub — it has to be built here, otherwise the
      # pull 404s and aborts the whole albums/embeddings suite.
      - name: Build keeppix-db:dev (PostGIS + pgvector)
        run: docker build -f Dockerfile.db -t keeppix-db:dev .

      # YuNet+SFace weights (gitignored — replace SCRFD/ArcFace, which were
      # never downloaded: research-only weights, never run in any
      # environment). Without them, the `detect_faces` tests that need real
      # inference skip. ~9.6 MB total (vs. the tens-to-hundreds of MB of any
      # InsightFace variant).
      - name: Cache YuNet+SFace weights
        uses: actions/cache@v4
        with:
          path: models/yunet-sface
          key: yunet-sface-${{ hashFiles('scripts/download-yunet-sface.sh') }}
      - name: Download YuNet+SFace weights
        run: ./scripts/download-yunet-sface.sh

      # OpenCLIP XLM-R IT/EN weights (replace MobileCLIP2-S2, removed:
      # research-only, never fit for commercial use). Unlike the cache
      # above, there is NO download script here: these weights don't come
      # from a stable external URL, only `export-openclip-xlmr.yml`
      # produces them (a Python export from the HuggingFace checkpoint,
      # minutes of compute, not something to redo on every push of this
      # job). This job ONLY restores (no fallback download step): with the
      # same key used by the cache-save step in that workflow, a successful
      # run there makes the weights available here. In the absence of a
      # cache (the export never ran on this branch, or the entry expired
      # after 7 days), the tests that need `first_complete_model_dir()`
      # already degrade explicitly (skip via eprintln, not failure) — same
      # principle as the other weight caches.
      - name: Cache OpenCLIP XLM-R IT/EN weights (restore only, produced by export-openclip-xlmr.yml)
        uses: actions/cache@v4
        with:
          path: models/openclip-xlmr-it-en
          key: openclip-xlmr-it-en-${{ hashFiles('scripts/export-openclip-xlmr-it-en.py') }}

      # IT/EN test bench photos — never downloaded in CI until this was
      # discovered while checking `openclip_xlmr_it_en_retrieval_bench`,
      # which was skipping without visible output (the test harness
      # captures the `eprintln!` output of a passing test — "0.00s" and no
      # "skipping" line in the log — not a bug in the test, a pre-existing
      # gap here). It affected the MobileCLIP2-S2 bench in exactly the same
      # way (removed along with MobileCLIP2-S2): the IT/EN numbers on
      # record for that work were always measured by hand (on a dev
      # machine, not CI). The photos come from Wikimedia Commons
      # (`scripts/download-ai-bench.sh`), not from a gitignored mirror like
      # the model weights — same caching pattern regardless, keyed on the
      # script+caption content.
      - name: Cache IT/EN bench photos
        uses: actions/cache@v4
        with:
          path: models/bench-it-en
          key: ai-bench-${{ hashFiles('scripts/download-ai-bench.sh', 'crates/keeppix-media/testdata/ai-bench/captions.json') }}
      - name: Download IT/EN bench photos
        run: ./scripts/download-ai-bench.sh

      # `--jobs 1` lives in `scripts/test.sh` for a reason that **doesn't
      # apply here**: locally, tests use testcontainers and without that
      # limit a PostGIS spins up per crate in parallel. Not in CI — there's
      # a single service Postgres (without vector) plus, at most, a shared
      # `keeppix-db:dev` for tests that need pgvector.
      # Serializing compilation on a 4-core runner cost ~10 minutes for a
      # reason that doesn't exist in CI.
      #
      # No `--test-threads=1` here: every `TestDb::start()` does its own
      # `CREATE DATABASE` (see `crates/*/tests/harness/mod.rs`), isolated
      # even against the shared Postgres from `services:` — tests don't
      # step on each other, running in parallel is safe by construction.
      # The one exception was `keeppix-server/tests/config.rs`, which
      # mutates process environment variables: those tests (and the three
      # equivalent ones in `keeppix-media/tests/derive.rs`) are marked
      # `#[serial]` (`serial_test`), so there's no longer a need to
      # serialize the whole workspace for them. Measured: 34s of lint
      # versus 23m08s of tests on one run — the bottleneck was global
      # serialization, not compilation or the tests themselves.
      # `--no-fail-fast`: without it, cargo stops at the first failing
      # target and every subsequent bug stays hidden until that one is
      # fixed — three ~15-20 minute CI cycles for three separate bugs,
      # discovered one at a time instead of all together in a single run.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The step above also passes when this bench skips (weights or
      # photos missing): the `eprintln!` output of a PASSING test is
      # captured by the test harness and discarded, never visible in the
      # log — both the "skipping" line and, when it actually runs, the
      # "MEASUREMENT" block with real recall/mrr/ms/RSS numbers. Rerunning
      # the binary here with `--nocapture` is nearly free (already compiled
      # by the Test step above) and makes those numbers readable in every
      # run, not only when a dev reruns them by hand locally.
      - name: IT/EN retrieval bench (real numbers in log, weights+photos permitting)
        run: cargo test -p keeppix-media --test openclip_xlmr_retrieval_bench -- --nocapture

      - name: OpenAPI spec is up to date
        run: git diff --exit-code docs/api/openapi.json

      # `cargo clean` here would make the cache useless, and it's not
      # obvious why: normal steps run **before** post-steps, and
      # `Swatinem/rust-cache` saves in a post-step. On main — the only
      # branch where `save-if` is true — emptying `target/` before the Post
      # step means saving an empty cache (105 MB of sources only), and
      # every subsequent run recompiles from scratch: clippy plus tests
      # taking several extra minutes, as measured on a real run. On PRs
      # `save-if` is false, so cleaning here doesn't lose anything and
      # frees up runner disk space. Only clean where nothing is being
      # saved.
      - name: Free disk space after tests
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cargo clean || true
          df -h /

      - name: Disk space on main (cache is saved afterward)
        if: always() && github.ref == 'refs/heads/main'
        run: df -h /

  api-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate OpenAPI clients
        run: ./scripts/generate-api-clients.sh
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - name: Generated TypeScript client compiles
        working-directory: docs/api/clients/typescript-fetch
        run: |
          npm install --ignore-scripts
          npx tsc --noEmit -p tsconfig.json
      - name: Generated Swift package is valid
        run: |
          test -f docs/api/clients/swift5/Package.swift
          grep -q 'name: "KeeppixApiClient"' docs/api/clients/swift5/Package.swift

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - run: npm ci
      - name: Types
        run: npx vue-tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

      - name: Initial bundle budget (150 KB gzip)
        run: |
          # "Initial" = only the assets that dist/index.html loads
          # immediately (the entry script and the stylesheet Vite injects
          # into it). Per-route chunks lazily loaded via import() (see
          # src/router.ts) are deliberately excluded: the spec wants the
          # map, culling, settings, and video player in separate chunks,
          # outside the initial budget (design §10.9).
          test -f dist/index.html || { echo "::error::dist/index.html not found"; exit 1; }

          ASSETS=$(grep -oE '(src|href)="/assets/[^"]+\.(js|css)"' dist/index.html | sed -E 's/^(src|href)="//; s/"$//')
          if [ -z "$ASSETS" ]; then
            echo "::error::no entry asset found in dist/index.html"
            exit 1
          fi

          SIZE=0
          while IFS= read -r asset; do
            FILE="dist${asset}"
            test -f "$FILE" || { echo "::error::asset referenced in index.html is missing: $FILE"; exit 1; }
            SIZE=$((SIZE + $(gzip -c "$FILE" | wc -c)))
          done <<< "$ASSETS"

          echo "initial bundle gzip: $SIZE bytes"
          if [ "$SIZE" -gt 153600 ]; then
            echo "::error::bundle exceeds the 153600 byte budget"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories bans licenses }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
