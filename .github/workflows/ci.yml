name: CI

on:
  # 'fase-*' oltre a main: le PR verso questo repo sono attualmente rotte lato
  # GitHub (pullRequests.totalCount torna 0 via API e via web nonostante le PR
  # #10/#11 siano esistite ed elencate nella cronologia commit — verificato,
  # non è un problema di permessi locali). Finché non è risolto lato GitHub,
  # il push diretto sul branch di fase è l'unico modo di avere CI reale prima
  # del merge.
  push: { branches: [main, 'fase-*'] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    # Un solo PostGIS per il job. testcontainers ne lasciava uno per crate
    # (Drop non li toglieva) e il runner andava a disco pieno a metà suite.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KEEPPIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - name: Funzioni pubbliche e rotte senza chiamanti
        run: python3 scripts/check-wired.py

      # keeppix-server incorpora frontend/dist nel binario tramite
      # `#[derive(Embed)]` (rust-embed): se la cartella manca, il crate non
      # compila affatto (non un test che si salta). Il job `frontend` gira su
      # un runner separato e non condivide filesystem con questo job, quindi
      # il frontend va ricostruito qui, indipendentemente da lì — pochi
      # secondi in più, nessun accoppiamento fra i due job via artifact.
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend (richiesto da rust-embed per compilare keeppix-server)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@1.88.0
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Solo su main. Era stato provato "true" ovunque (anche sui PR) per
          # evitare che un branch lungo ricompilasse tutto a ogni push — ma
          # con 4 fasi attive in parallelo il salvataggio su ogni PR ha
          # spinto la cache Actions del repo al tetto di 10 GB (747 voci) e
          # contribuito ai costi di fatturazione. Il guadagno di velocità non
          # valeva quel costo: si torna al solo main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formattazione
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Libera disco prima dei test
        run: |
          # I runner ubuntu-latest partono già pieni di toolchain inutili;
          # clippy + test workspace riempiono facilmente i ~14 GiB liberi e
          # Postgres finisce in PANIC su pg_wal (visto su PR #4).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules || true
          df -h /

      # Video playback/transcode tests probe with ffprobe and seed clips with
      # ffmpeg. Without these the suite writes a fake file and probe → 404.
      # `age` + `zstd` are required by the kpxb external-CLI round-trip test.
      # `libheif-examples` gives `heif-convert` (Task 22, HEIF/HEIC decode in
      # sandbox); on ubuntu-latest (24.04) libheif ships its codecs as
      # `dlopen` plugins, not linked in like on Debian bookworm (see
      # Dockerfile), so `libheif-plugin-libde265` is needed too or every HEIC
      # fixture test silently skips via `heif_convert_available()` instead of
      # actually running.
      - name: Installa ffmpeg, age, zstd, libheif (test video, backup, HEIF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg age zstd libheif-examples libheif-plugin-libde265

      # Fase 7: lo harness di `keeppix-db` (e `provision_with_vector` in
      # `keeppix-jobs`) richiede pgvector. Il `services.postgres` resta
      # `postgis/postgis:17-3.5` (senza vector) per gli altri crate via
      # `KEEPPIX_TEST_DATABASE_URL`; quando quell'URL non offre `vector`,
      # i test AI ricadono su testcontainers `keeppix-db:dev`. Quell'immagine
      # non è su Docker Hub — va costruita qui, altrimenti il pull 404 abortisce
      # tutta la suite albums/embeddings.
      - name: Build keeppix-db:dev (PostGIS + pgvector)
        run: docker build -f Dockerfile.db -t keeppix-db:dev .

      # Pesi CLIP (gitignored). Senza di essi i test embed saltano; con cache
      # Actions la suite li esegue davvero dopo il primo download (~140 MB
      # visual + text). Zero rete a runtime del binario: solo CI/dev/bake.
      - name: Cache MobileCLIP2-S2 weights
        uses: actions/cache@v4
        with:
          path: models/mobileclip2-s2
          key: mobileclip2-s2-${{ hashFiles('scripts/download-mobileclip2-s2.sh') }}
      - name: Download MobileCLIP2-S2 weights
        run: ./scripts/download-mobileclip2-s2.sh

      # `--jobs 1` sta in `scripts/test.sh` per un motivo che **qui non vale**:
      # in locale i test usano testcontainers e senza quel limite parte un
      # PostGIS per crate in parallelo. In CI no — c'è un solo Postgres di
      # servizio (senza vector) più, al più, un `keeppix-db:dev` condiviso
      # per i test che richiedono pgvector.
      # Serializzare la compilazione su un runner a 4 core costava ~10 minuti
      # per una ragione che in CI non esiste.
      #
      # Niente `--test-threads=1` qui: ogni `TestDb::start()` fa il suo
      # `CREATE DATABASE` (vedi `crates/*/tests/harness/mod.rs`), isolato
      # anche contro il Postgres condiviso di `services:` — i test non si
      # calpestano a vicenda, girare in parallelo è sicuro per costruzione.
      # L'unica eccezione era `keeppix-server/tests/config.rs`, che muta
      # variabili d'ambiente di processo: quei test (e i tre equivalenti in
      # `keeppix-media/tests/derive.rs`) sono marcati `#[serial]`
      # (`serial_test`), non serve più serializzare l'intero workspace per
      # loro. Misurato: 34s di lint contro 23m08s di test sul run
      # 32236974676 — il collo di bottiglia era la serializzazione globale,
      # non la compilazione né i test in sé.
      # `--no-fail-fast`: senza, cargo si ferma al primo target che fallisce
      # e ogni bug successivo resta nascosto finché non si corregge quello
      # prima — tre cicli di CI da ~15-20 minuti l'uno per tre bug distinti,
      # scoperti uno alla volta, invece che tutti insieme in un solo run.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: La specifica OpenAPI è aggiornata
        run: git diff --exit-code docs/api/openapi.json

      # `cargo clean` qui rende inutile la cache, e non è ovvio: gli step
      # normali girano **prima** dei post-step, e `Swatinem/rust-cache`
      # salva in un post-step. Su main — l'unico ramo dove `save-if` è vero
      # — svuotare `target/` prima del Post significa salvare una cache
      # vuota (105 MB di sole sorgenti), e ogni run successivo ricompila da
      # capo: 3m07s di clippy più 10m36s di test, misurati sul run
      # 31972217130. Sui PR `save-if` è falso, quindi qui la pulizia non
      # toglie niente e libera lo spazio del runner. Si pulisce solo dove
      # non si salva.
      - name: Libera disco dopo i test
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cargo clean || true
          df -h /

      - name: Spazio disco su main (la cache viene salvata dopo)
        if: always() && github.ref == 'refs/heads/main'
        run: df -h /

  api-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Genera i client OpenAPI
        run: ./scripts/generate-api-clients.sh
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - name: Il client TypeScript generato compila
        working-directory: docs/api/clients/typescript-fetch
        run: |
          npm install --ignore-scripts
          npx tsc --noEmit -p tsconfig.json
      - name: Il package Swift generato è valido
        run: |
          test -f docs/api/clients/swift5/Package.swift
          grep -q 'name: "KeeppixApiClient"' docs/api/clients/swift5/Package.swift

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - run: npm ci
      - name: Tipi
        run: npx vue-tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

      - name: Budget del bundle iniziale (150 KB gzip)
        run: |
          # "Iniziale" = solo gli asset che dist/index.html carica subito
          # (lo script d'ingresso e il foglio di stile che Vite vi inietta).
          # I chunk per-rotta caricati pigramente via import() (vedi
          # src/router.ts) restano fuori di proposito: lo spec vuole mappa,
          # culling, impostazioni e player video in chunk separati, fuori dal
          # budget iniziale (design §10.9).
          test -f dist/index.html || { echo "::error::dist/index.html non trovato"; exit 1; }

          ASSETS=$(grep -oE '(src|href)="/assets/[^"]+\.(js|css)"' dist/index.html | sed -E 's/^(src|href)="//; s/"$//')
          if [ -z "$ASSETS" ]; then
            echo "::error::nessun asset d'ingresso trovato in dist/index.html"
            exit 1
          fi

          SIZE=0
          while IFS= read -r asset; do
            FILE="dist${asset}"
            test -f "$FILE" || { echo "::error::asset referenziato in index.html assente: $FILE"; exit 1; }
            SIZE=$((SIZE + $(gzip -c "$FILE" | wc -c)))
          done <<< "$ASSETS"

          echo "bundle iniziale gzip: $SIZE byte"
          if [ "$SIZE" -gt 153600 ]; then
            echo "::error::bundle oltre il budget di 153600 byte"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories bans licenses }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build immagine (senza push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
