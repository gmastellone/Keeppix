name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # Weekly rebuild: picks up security patches from the base images
    # without waiting for a release.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` preserves the repo name's exact case (e.g.
      # gmastellone/Keeppix), but OCI/ghcr.io image paths are always
      # lowercase. `docker/metadata-action` normalizes the `images:` field
      # on its own, but `cosign sign` below does not: computing a single
      # lowercase variable here and reusing it in both places guarantees
      # the signed reference is identical to the published one, instead of
      # depending on an action's internal normalization.
      - name: Image name (lowercase, required by the OCI spec)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
