name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # Ricostruzione settimanale: raccoglie le patch di sicurezza delle immagini
    # di base senza attendere una release.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `github.repository` conserva il case esatto del nome del repo
      # (qui gmastellone/Keeppix), ma i path immagine OCI/ghcr.io sono
      # sempre minuscoli. `docker/metadata-action` normalizza da sé il
      # campo `images:`, ma `cosign sign` più sotto no: calcolando qui
      # un'unica variabile minuscola e riusandola in entrambi i punti,
      # il riferimento firmato è garantito identico a quello pubblicato,
      # invece di dipendere dalla normalizzazione interna di un'azione.
      - name: Nome immagine (minuscolo, richiesto dallo spec OCI)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Firma l'immagine
        run: |
          cosign sign --yes \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
