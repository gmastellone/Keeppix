name: keeppix

services:
  keeppix:
    build: .
    image: keeppix:dev
    restart: unless-stopped
    environment:
      # With an external Postgres: set DATABASE_URL (in `.env` or the
      # shell) and launch without `--profile bundled` — the external value
      # wins and the `db` service won't start. Without DATABASE_URL, it
      # falls back to the bundled `db` service with DB_PASSWORD's password.
      DATABASE_URL: ${DATABASE_URL:-postgres://keeppix:${DB_PASSWORD:-changeme}@db/keeppix}
      KEEPPIX_ALLOWED_ORIGINS: '[]'
    ports:
      - "5673:5673"
    volumes:
      - ./data:/data
      # Originals are read-only: no bug can delete them.
      # Switch to `rw` only once upload needs it.
      - ${PHOTOS_PATH:-./photos}:/photos:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    profiles: ["bundled"]
    build:
      context: .
      dockerfile: Dockerfile.db
    image: keeppix-db:dev
    restart: unless-stopped
    command:
      - postgres
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-20}
    environment:
      POSTGRES_USER: keeppix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: keeppix
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeppix -d keeppix"]
      interval: 5s
      timeout: 3s
      retries: 10
