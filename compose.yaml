name: keeppix

services:
  keeppix:
    build: .
    image: keeppix:dev
    restart: unless-stopped
    environment:
      # With an external Postgres: set DATABASE_URL (in `.env` or the
      # shell) and launch without `--profile bundled` — the external value
      # wins and the `db` service won't start. Without DATABASE_URL, it
      # falls back to the bundled `db` service with DB_PASSWORD's password.
      # No hardcoded fallback password: an unset DB_PASSWORD here means an
      # empty password, which the bundled `db` service below refuses to
      # start with — a loud failure instead of a silently-usable weak
      # default. Generate a real one: `openssl rand -hex 24` — hex, not
      # base64: this value gets embedded directly in a postgres:// URL
      # (right below), and base64's alphabet includes '/', which a URL
      # parser reads as a path separator.
      DATABASE_URL: ${DATABASE_URL:-postgres://keeppix:${DB_PASSWORD:-}@db/keeppix}
      KEEPPIX_ALLOWED_ORIGINS: '[]'
    ports:
      - "5673:5673"
    volumes:
      - ./data:/data
      # Writable: "delete from disk" (routes::trash::batch_delete,
      # DiskAction::Purged) needs to actually remove the original file, not
      # just the DB row — under `:ro` that action always fails with a
      # filesystem permission error (the DB side still commits first, so
      # the asset silently drops out of the index while the file survives
      # untouched on disk, only to reappear at the next scan). Upload and
      # move/rename also write here.
      - ${PHOTOS_PATH:-./photos}:/photos
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    profiles: ["bundled"]
    build:
      context: .
      dockerfile: Dockerfile.db
    image: keeppix-db:dev
    restart: unless-stopped
    command:
      - postgres
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-20}
    environment:
      POSTGRES_USER: keeppix
      # No fallback default: postgres refuses to start with an empty
      # password, so an unset DB_PASSWORD fails loudly instead of starting
      # a database anyone can guess their way into.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: keeppix
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeppix -d keeppix"]
      interval: 5s
      timeout: 3s
      retries: 10
