[advisories]
yanked = "deny"
# age 0.11 → i18n-embed-fl → proc-macro-error2 (unmaintained, RUSTSEC-2026-0173).
# age 0.12 drops that crate but currently fails to compile (ml-kem 0.2.1 vs
# crypto-common dual versions). The advisory is build-time-only for age's
# fluent macros — not reachable at runtime in keeppix. Revisit when age 0.12
# (or a patched ml-kem) builds cleanly.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "transitive build-only via age 0.11; age 0.12 does not compile yet (ml-kem)" },
    # tokenizers (CLIP BPE) pulls `paste` as a build-time proc-macro.
    # Upstream still depends on paste through 0.23.x; pastey is not a drop-in
    # for that crate graph. Not linked into the keeppix binary.
    { id = "RUSTSEC-2024-0436", reason = "build-only proc-macro via tokenizers; no pastey migration upstream yet" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0",
         "AGPL-3.0-or-later", "CDLA-Permissive-2.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"

# The boundary between crates called out as the most important one:
# `keeppix-media` must not know about the database, `keeppix-db` must not know
# about images. Today that's true because the two crates are empty, i.e. by
# convention only: nothing would stop someone from adding `keeppix-db` to
# `keeppix-media`'s dependencies and writing a query into it.
#
# `wrappers` is the allowlist of who may depend on `keeppix-db`: anyone else
# doing so becomes a `cargo deny check bans` error, and therefore a CI
# failure. The two entries are today's real dependents. `keeppix-jobs` and
# `keeppix-dav`, which are legitimate future consumers, are **not** listed in
# advance on purpose: when `jobs → db` gets wired up, CI will stop, and adding
# the entry will be a decision made by looking at the actual change, not an
# already-wide allowlist to slot into.
#
# Known limitation, stated so the rule isn't trusted more than it deserves:
# the check is on **direct** dependents. An indirect path `media → jobs → db`
# would not be caught once `jobs` is authorized. That is, however, the
# reverse of the intended direction (`jobs → media`), which cargo's acyclic
# dependency graph makes impossible once it exists.
[[bans.deny]]
crate = "keeppix-db"
wrappers = ["keeppix-api", "keeppix-server", "keeppix-jobs"]
